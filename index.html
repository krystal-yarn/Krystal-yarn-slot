<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krystal 的毛线研究室｜老虎机</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#f5a5c0;
  --primary-light:#ffe7f0;
  --primary-bg:#fff6fa;
  --deep:#d96d96;
  --line:#f2c8d8;
  --cream:#fffaf3;
  --brown:#6b4c4c;
  --text:#5d4a4a;
  --white:#fff;
  --shadow:0 8px 22px rgba(120,80,100,.12);
  --radius:22px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--primary-bg);
  color:var(--text);
  font-family:"Noto Sans SC",sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

/* =========================
   基础
========================= */

.app{
  min-height:100vh;
}

.hidden{
  display:none!important;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.container{
  width:min(1180px,94%);
  margin:auto;
}

/* =========================
   Header
========================= */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  width:min(1180px,94%);
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  font-size:32px;
}

.logo-title{
  font-family:"ZCOOL KuaiLe",cursive;
  font-size:25px;
  color:var(--deep);
}

.logo-sub{
  font-size:12px;
  color:#a78686;
  margin-top:2px;
}

.nav{
  display:flex;
  gap:8px;
}

.nav button{
  border:0;
  background:transparent;
  color:#927272;
  padding:10px 15px;
  border-radius:999px;
}

.nav button.active,
.nav button:hover{
  background:var(--primary-light);
  color:var(--deep);
}

/* =========================
   通用卡片
========================= */

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.section{
  padding:28px 0;
}

.section-title{
  font-family:"ZCOOL KuaiLe",cursive;
  font-size:24px;
  color:var(--deep);
  margin:0 0 18px;
}

.muted{
  color:#a88d8d;
  font-size:13px;
}

.small{
  font-size:12px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:5px 10px;
  border-radius:999px;
  background:var(--primary-light);
  color:var(--deep);
  font-size:12px;
}

/* =========================
   产品选择
========================= */

.product-picker{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:20px 0;
}

.product-card{
  border:2px solid var(--line);
  background:#fff;
  border-radius:20px;
  padding:18px;
  text-align:center;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-2px);
}

.product-card.active{
  border-color:var(--primary);
  background:var(--primary-light);
  box-shadow:0 8px 18px rgba(0,0,0,.06);
}

.product-emoji{
  font-size:35px;
}

.product-name{
  margin-top:8px;
  font-weight:700;
}

/* =========================
   游戏进度
========================= */

.progress{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin:24px 0;
}

.progress-step{
  display:flex;
  align-items:center;
  gap:7px;
  color:#b99d9d;
  font-size:13px;
}

.progress-step.active{
  color:var(--deep);
  font-weight:700;
}

.progress-number{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#f4eeee;
  display:grid;
  place-items:center;
}

.progress-step.active .progress-number{
  background:var(--primary);
  color:#fff;
}

.progress-line{
  width:35px;
  height:2px;
  background:#eadcdc;
}

/* =========================
   订单
========================= */

.order-box{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:20px;
}

.order-box input{
  flex:1;
  min-width:0;
}

/* =========================
   Input / button
========================= */

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:11px 13px;
  outline:none;
  color:var(--text);
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(245,165,192,.15);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  border:0;
  border-radius:999px;
  padding:11px 18px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--deep);
}

.btn-soft{
  background:var(--primary-light);
  color:var(--deep);
}

.btn-plain{
  background:#f6f1f1;
  color:#806c6c;
}

.btn-danger{
  background:#fff0f0;
  color:#c75d5d;
}

.btn-small{
  padding:7px 12px;
  font-size:12px;
}

.btn-large{
  padding:14px 28px;
  font-size:16px;
}

/* =========================
   游戏区域
========================= */

.game-card{
  padding:28px;
  position:relative;
  overflow:hidden;
}

.game-card::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:var(--primary-light);
  top:-90px;
  right:-50px;
  opacity:.7;
}

.stage-label{
  text-align:center;
  position:relative;
  z-index:1;
}

.stage-label .mini{
  font-size:12px;
  color:#b28c8c;
}

.stage-label h2{
  font-family:"ZCOOL KuaiLe",cursive;
  color:var(--deep);
  margin:7px 0 4px;
  font-size:29px;
}

/* =========================
   Slot Machine
========================= */

.machine-area{
  display:grid;
  gap:18px;
  margin-top:25px;
}

.style-machine{
  max-width:420px;
  margin:0 auto;
}

.material-machines{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:16px;
}

.reel-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:12px;
  box-shadow:0 6px 18px rgba(120,80,100,.08);
}

.reel-title{
  text-align:center;
  color:var(--deep);
  font-weight:700;
  font-size:14px;
  margin-bottom:8px;
}

.reel-window{
  height:180px;
  border-radius:16px;
  overflow:hidden;
  background:linear-gradient(#fff,#fff8fb);
  border:1px solid #f0dfe5;
  position:relative;
}

.reel-window::before,
.reel-window::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:40px;
  z-index:3;
  pointer-events:none;
}

.reel-window::before{
  top:0;
  background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,0));
}

.reel-window::after{
  bottom:0;
  background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.95));
}

.reel-track{
  height:100%;
  display:flex;
  flex-direction:column;
  transition:transform .8s cubic-bezier(.12,.7,.2,1);
}

.reel-item{
  height:180px;
  flex:0 0 180px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px;
  padding:10px;
  text-align:center;
}

.reel-item img{
  max-width:110px;
  max-height:110px;
  object-fit:contain;
  border-radius:12px;
}

.reel-item span{
  font-size:15px;
  font-weight:600;
}

.reel-center-line{
  position:absolute;
  top:50%;
  left:8px;
  right:8px;
  height:2px;
  background:var(--primary);
  opacity:.5;
  z-index:4;
}

.reel-running .reel-window{
  box-shadow:0 0 0 3px rgba(245,165,192,.2);
}

.reel-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.reel-actions button{
  flex:1;
  font-size:12px;
}

/* =========================
   游戏操作
========================= */

.game-actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:24px;
}

.tip-box{
  margin-top:20px;
  padding:13px 15px;
  border-radius:15px;
  background:#fff8ee;
  color:#9b8063;
  font-size:13px;
}

/* =========================
   Style confirmation
========================= */

.confirm-style{
  text-align:center;
  padding:25px;
  margin-top:20px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
}

.confirm-style-image{
  width:150px;
  height:150px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:22px;
  background:var(--primary-light);
  overflow:hidden;
  font-size:60px;
}

.confirm-style-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.confirm-style h3{
  font-family:"ZCOOL KuaiLe",cursive;
  font-size:26px;
  color:var(--deep);
  margin:14px 0 4px;
}

/* =========================
   Result modal
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(80,50,60,.35);
  backdrop-filter:blur(5px);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:28px;
  padding:26px;
  box-shadow:0 20px 60px rgba(80,40,60,.2);
  position:relative;
}

.modal h2{
  font-family:"ZCOOL KuaiLe",cursive;
  color:var(--deep);
  margin-top:0;
}

.modal-close{
  position:absolute;
  right:16px;
  top:14px;
  border:0;
  background:#f7eeee;
  width:32px;
  height:32px;
  border-radius:50%;
}

.result-style{
  display:flex;
  align-items:center;
  gap:15px;
  padding:14px;
  background:var(--primary-light);
  border-radius:18px;
  margin-bottom:15px;
}

.result-style img{
  width:70px;
  height:70px;
  object-fit:contain;
  border-radius:12px;
  background:#fff;
}

.result-list{
  display:grid;
  gap:9px;
}

.result-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:11px 13px;
  background:#faf6f6;
  border-radius:13px;
}

.result-row .label{
  color:#a08383;
}

.result-row .value{
  font-weight:700;
}

.modal-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

/* =========================
   Lucky sign
========================= */

.lucky-stage{
  text-align:center;
}

.lucky-stage h2{
  font-family:"ZCOOL KuaiLe",cursive;
  color:var(--deep);
}

.lucky-envelope{
  width:260px;
  height:350px;
  margin:25px auto;
  position:relative;
  perspective:900px;
}

.lucky-card{
  position:absolute;
  inset:0;
  background:linear-gradient(145deg,#fff,#fff5f8);
  border:2px solid var(--line);
  border-radius:25px;
  box-shadow:0 15px 35px rgba(120,80,100,.15);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:25px;
  overflow:hidden;
}

.lucky-decoration{
  position:absolute;
  pointer-events:none;
  z-index:1;
  user-select:none;
  transition:.3s;
}

.lucky-card-content{
  position:relative;
  z-index:5;
}

.lucky-symbol{
  font-size:48px;
}

.lucky-name{
  font-family:"ZCOOL KuaiLe",cursive;
  color:var(--deep);
  font-size:29px;
  margin:10px 0;
}

.lucky-text{
  font-size:14px;
  line-height:1.8;
  color:#806c6c;
}

.lucky-reward{
  margin-top:14px;
  padding:9px 13px;
  background:var(--primary-light);
  border-radius:999px;
  color:var(--deep);
  font-weight:700;
  font-size:13px;
}

.lucky-running .lucky-card{
  animation:luckyShake .12s infinite alternate;
}

@keyframes luckyShake{
  from{transform:rotate(-1deg) translateX(-2px)}
  to{transform:rotate(1deg) translateX(2px)}
}

/* =========================
   History
========================= */

.history-list{
  display:grid;
  gap:15px;
}

.history-card{
  padding:18px;
}

.history-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.history-head h3{
  margin:0;
  color:var(--deep);
}

.history-materials{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.history-chip{
  padding:6px 10px;
  background:#faf4f5;
  border-radius:999px;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#b09595;
}

/* =========================
   Settings
========================= */

.settings-wrap{
  display:grid;
  gap:18px;
}

.settings-card{
  padding:22px;
}

.settings-card h3{
  margin-top:0;
  color:var(--deep);
}

.settings-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.settings-product-tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.settings-product-tabs button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:9px 14px;
}

.settings-product-tabs button.active{
  background:var(--primary-light);
  color:var(--deep);
  border-color:var(--primary);
}

.style-setting{
  border:1px solid #eedee3;
  border-radius:18px;
  padding:17px;
  margin-top:12px;
  background:#fff;
}

.style-setting-head{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
}

.style-setting-main{
  display:flex;
  align-items:center;
  gap:10px;
}

.style-thumb{
  width:58px;
  height:58px;
  border-radius:13px;
  background:var(--primary-light);
  display:grid;
  place-items:center;
  overflow:hidden;
  font-size:24px;
}

.style-thumb img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.slot-list{
  display:grid;
  gap:8px;
  margin-top:15px;
}

.slot-setting{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 11px;
  border-radius:12px;
  background:#faf6f7;
}

.slot-setting input[type="checkbox"]{
  width:auto;
}

.slot-setting-name{
  flex:1;
}

.category-card{
  border:1px solid #eedee3;
  border-radius:18px;
  padding:17px;
  margin-top:12px;
}

.category-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.category-items{
  display:grid;
  gap:8px;
  margin-top:12px;
}

.item-setting{
  display:grid;
  grid-template-columns:58px 1fr auto;
  gap:10px;
  align-items:center;
  padding:9px;
  background:#faf7f7;
  border-radius:13px;
}

.item-setting-image{
  width:58px;
  height:58px;
  border-radius:10px;
  overflow:hidden;
  background:#fff;
  display:grid;
  place-items:center;
}

.item-setting-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.item-setting-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.inline-fields{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.field{
  display:grid;
  gap:5px;
}

.field label{
  font-size:12px;
  color:#927878;
}

/* =========================
   Rules
========================= */

.rule-box{
  background:#fff9f2;
  border:1px solid #f0dfc6;
  border-radius:17px;
  padding:16px;
  margin-top:12px;
}

.rule-row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:8px;
  align-items:center;
  margin-top:9px;
}

.rule-row select{
  min-width:0;
}

/* =========================
   Theme settings
========================= */

.theme-note{
  background:#f9f4ff;
  border:1px solid #e8d9f5;
  padding:13px;
  border-radius:14px;
  font-size:13px;
  color:#806b8f;
}

/* =========================
   Toast
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:#6d5757;
  color:#fff;
  padding:11px 17px;
  border-radius:999px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:2000;
  font-size:13px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   Responsive
========================= */

@media(max-width:700px){
  .header-inner{
    flex-direction:column;
    align-items:flex-start;
    padding:12px 0;
  }

  .nav{
    width:100%;
    overflow:auto;
  }

  .product-picker{
    grid-template-columns:1fr;
  }

  .game-card{
    padding:18px;
  }

  .material-machines{
    grid-template-columns:repeat(2,1fr);
  }

  .reel-window,
  .reel-item{
    height:155px;
  }

  .reel-item{
    flex-basis:155px;
  }

  .item-setting{
    grid-template-columns:48px 1fr;
  }

  .item-setting-actions{
    grid-column:1 / -1;
    justify-content:flex-start;
  }

  .rule-row{
    grid-template-columns:1fr;
  }

  .inline-fields{
    grid-template-columns:1fr;
  }
}

@media(max-width:430px){
  .material-machines{
    grid-template-columns:1fr;
  }

  .logo-title{
    font-size:21px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="header-inner">

    <div class="logo">
      <div class="logo-icon">🧶</div>
      <div>
        <div class="logo-title">Krystal 的毛线研究室</div>
        <div class="logo-sub">甜甜配色 · 今天抽到什么呢？</div>
      </div>
    </div>

    <nav class="nav">
      <button class="active" data-page="draw">🎰 抽取</button>
      <button data-page="history">📖 历史</button>
      <button data-page="settings">⚙️ 设置</button>
    </nav>

  </div>
</header>


<!-- =========================
     抽取页面
========================= -->

<main id="pageDraw" class="page active">

  <div class="container">

    <section class="section">

      <h1 class="section-title">今天来玩什么？</h1>

      <div id="productPicker" class="product-picker"></div>

      <div class="order-box">
        <input id="orderNumber"
               placeholder="请输入订单号，例如 KS20260919001">
        <button class="btn btn-soft" onclick="useRandomOrder()">随机订单号</button>
      </div>

      <div class="progress">

        <div id="progress1" class="progress-step active">
          <span class="progress-number">1</span>
          <span>抽款式</span>
        </div>

        <div class="progress-line"></div>

        <div id="progress2" class="progress-step">
          <span class="progress-number">2</span>
          <span>抽材料</span>
        </div>

        <div class="progress-line"></div>

        <div id="progress3" class="progress-step">
          <span class="progress-number">3</span>
          <span>幸运签</span>
        </div>

      </div>


      <div id="drawGame"></div>

    </section>

  </div>

</main>


<!-- =========================
     历史
========================= -->

<main id="pageHistory" class="page">

  <div class="container">

    <section class="section">

/* =========================================================
   LocalStorage
========================================================= */

const STORAGE_KEY = "krystal_slot_machine_complete_v10";
const OLD_KEY = "krystal_slot_machine_v2";

function deepClone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function loadData(){

  try{
    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
      const parsed = JSON.parse(saved);

      const merged = deepClone(DEFAULT_DATA);

      Object.keys(parsed.products || {}).forEach(pid=>{
        if(merged.products[pid]){
          merged.products[pid] = normalizeProduct(parsed.products[pid]);
        }
      });

      return merged;
    }

    const old = localStorage.getItem(OLD_KEY);

    if(old){
      return migrateOldData(JSON.parse(old));
    }

  }catch(error){
    console.error(error);
  }

  return deepClone(DEFAULT_DATA);
}

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function normalizeProduct(product){

  product = product || {};

  product.categories = Array.isArray(product.categories)
    ? product.categories
    : [];

  product.styles = Array.isArray(product.styles)
    ? product.styles
    : [];

  product.rules = product.rules || {};

  product.rules.styleCategory =
    Array.isArray(product.rules.styleCategory)
      ? product.rules.styleCategory
      : [];

  product.rules.categoryPair =
    Array.isArray(product.rules.categoryPair)
      ? product.rules.categoryPair
      : [];

  product.luckySigns =
    Array.isArray(product.luckySigns)
      ? product.luckySigns
      : [];

  product.scenicThemes =
    Array.isArray(product.scenicThemes)
      ? product.scenicThemes
      : [];

  product.styles.forEach(style=>{
    style.slots = Array.isArray(style.slots)
      ? style.slots
      : [];

    style.slots.forEach(slot=>{
      if(slot.enabled === undefined){
        slot.enabled = true;
      }
    });
  });

  product.categories.forEach(cat=>{
    cat.items = Array.isArray(cat.items)
      ? cat.items
      : [];
  });

  return product;
}


/* =========================================================
   Migration
========================================================= */

function migrateOldData(old){

  const result = deepClone(DEFAULT_DATA);

  try{

    if(old && old.products){

      Object.keys(result.products).forEach(pid=>{

        if(!old.products[pid]) return;

        const oldProduct = old.products[pid];

        /*
          旧版 categories 如果是 object，
          自动转成新版 array
        */

        if(oldProduct.categories &&
           !Array.isArray(oldProduct.categories)){

          const newCategories = [];

          Object.keys(oldProduct.categories).forEach(key=>{

            const cat = oldProduct.categories[key];

            newCategories.push({
              id:"cat_"+key,
              name:cat.name || key,
              items:(cat.items || []).map(item=>({
                ...item,
                stock:item.stock ?? 99,
                image:item.image || "",
                photoOnly:item.photoOnly || false
              }))
            });

          });

          result.products[pid].categories = newCategories;
        }

        /*
          旧版 styles 转换
        */

        if(Array.isArray(oldProduct.styles)){

          const cats = result.products[pid].categories;

          result.products[pid].styles =
            oldProduct.styles.map((style,index)=>{

              let slots = [];

              if(Array.isArray(style.slots)){

                slots = style.slots.map((catId,i)=>{

                  let categoryId = catId;

                  if(!String(catId).startsWith("cat_")){
                    categoryId = "cat_"+catId;
                  }

                  const cat = cats.find(c=>c.id===categoryId);

                  return {
                    id:"slot_migrated_"+index+"_"+i,
                    categoryId:cat ? categoryId : cats[0]?.id,
                    label:cat ? cat.name : "材料",
                    enabled:true
                  };

                });

              }

              return {
                id:style.id || uid("style"),
                name:style.name || "未命名款式",
                image:style.image || "",
                photoOnly:style.photoOnly || false,
                stock:style.stock ?? 99,
                slots
              };

            });

        }

      });

    }

  }catch(error){
    console.error("Migration error:",error);
  }

  return result;
}


/* =========================================================
   Utils
========================================================= */

function uid(prefix="id"){
  return prefix+"_"+Math.random().toString(36).slice(2,9);
}

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function random(arr){
  if(!arr || !arr.length) return null;
  return arr[Math.floor(Math.random()*arr.length)];
}

function randomInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function productData(){
  return data.products[currentProduct];
}

function categoryById(id){
  return productData().categories.find(c=>c.id===id);
}

function styleById(id){
  return productData().styles.find(s=>s.id===id);
}

function itemById(categoryId,itemId){
  const cat = categoryById(categoryId);
  return cat?.items.find(i=>i.id===itemId);
}

function showToast(message){

  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =

}

function escapeJs(value){
  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}

/* =========================================================

========================================================= */

function buildReelItems(items){

  const repeated = [];

  for(let r=0;r<5;r++){
    items.forEach(item=>{
      repeated.push(item);
    });
  }

  return repeated.map(item=>`

    <div class="reel-item">

      ${
        item.image
        ? `<img src="${item.image}" alt="${esc(item.name)}">`
        : `<div style="font-size:45px">🧶</div>`
      }

      <span>${esc(item.name)}</span>

    </div>

  `).join("");
}


/* =========================================================
   Style Draw
========================================================= */

function startStyleDraw(){

  if(game.styleRunning) return;

  const order =
    document.getElementById("orderNumber").value.trim();

  if(!order){
    showToast("请先输入订单号");
    return;
  }

  game.order = order;
  game.styleRunning = true;

  const reel = document.getElementById("styleReel");

  reel?.classList.add("reel-running");

  const track = document.getElementById("styleTrack");

  if(!track) return;

  const styles =
    productData().styles.filter(s=>Number(s.stock ?? 99)>0);

  let position = 0;

  game.styleTimer = setInterval(()=>{

    position++;

    track.style.transition =
      "transform .12s linear";

    track.style.transform =
      `translateY(-${position*180}px)`;

  },130);

}

function stopStyleDraw(){

  if(!game.styleRunning) return;

  clearInterval(game.styleTimer);

  game.styleRunning = false;

  const styles =
    productData().styles.filter(s=>Number(s.stock ?? 99)>0);

  const chosen = random(styles);

  game.selectedStyle = chosen;

  const track = document.getElementById("styleTrack");

  if(track){

    const all =
      styles.length * 5;

    const index =
      Math.max(0,all-styles.length+styles.indexOf(chosen));

    track.style.transition =

function availableItemsForSlot(slot){

  const category =
    categoryById(slot.categoryId);

  if(!category) return [];

  let items =
    category.items.filter(
      item=>Number(item.stock ?? 99)>0
    );

  items =
    applyStyleRules(
      game.selectedStyle,
      category.id,
      items
    );

  items =
    applyPairRules(
      slot,
      items
    );

  return items;
}


/* =========================================================
   Style / Category Rules
========================================================= */

function applyStyleRules(style,categoryId,items){

  const rules =
    productData().rules.styleCategory || [];

  const matched =
    rules.filter(rule=>
      rule.styleId===style.id &&
      rule.categoryId===categoryId
    );

  if(!matched.length){
    return items;
  }

  const allowedIds =
    matched.flatMap(rule=>rule.allowedItemIds || []);

  if(!allowedIds.length){
    return items;
  }

  return items.filter(item=>allowedIds.includes(item.id));
}

function applyPairRules(slot,items){

  const previousResults =
    game.materialResults || [];

  if(!previousResults.length){
    return items;
  }

  const rules =
    productData().rules.categoryPair || [];

  let filtered = items;

  previousResults.forEach(previous=>{

    const matches =
      rules.filter(rule=>
        rule.fromCategoryId===previous.categoryId &&
        rule.fromItemId===previous.itemId &&
        rule.toCategoryId===slot.categoryId
      );

    if(matches.length){

      const allowed =
        matches.flatMap(r=>r.allowedItemIds || []);

      if(allowed.length){
        filtered =
          filtered.filter(item=>allowed.includes(item.id));
      }

    }

  });

  return filtered;
}


/* =========================================================
   Material Draw
========================================================= */

function startMaterial(slotId){

  if(game.materialRunning[slotId]) return;

  const slot =
    findCurrentSlot(slotId);

  if(!slot) return;

  const items =
    availableItemsForSlot(slot);

  if(!items.length){

    showToast(
      `${slot.label} 没有符合规则的可抽取材料`
    );

    return;
  }

  game.materialRunning[slotId] = true;

  document
    .getElementById("materialReel_"+slotId)
    ?.classList.add("reel-running");

  const track =
    document.getElementById("track_"+slotId);

  let position = 0;

  game.materialTimers[slotId] =
    setInterval(()=>{

      position++;

      track.style.transition =
        "transform .12s linear";

      track.style.transform =
        `translateY(-${position*180}px)`;

    },120);
}

function stopMaterial(slotId){

  if(!game.materialRunning[slotId]) return;

  clearInterval(game.materialTimers[slotId]);

  game.materialRunning[slotId] = false;

  const slot =
    findCurrentSlot(slotId);

  if(!slot) return;

  const items =
    availableItemsForSlot(slot);

  if(!items.length) return;

  const chosen =
    random(items);

  const existingIndex =
    game.materialResults.findIndex(
      x=>x.slotId===slotId
    );

  const result = {
    slotId,
    label:slot.label,
    categoryId:slot.categoryId,
    categoryName:categoryById(slot.categoryId)?.name || "",
    itemId:chosen.id,
    itemName:chosen.name,
    itemImage:chosen.image || ""
  };

  if(existingIndex>=0){
    game.materialResults[existingIndex] = result;
  }else{
    game.materialResults.push(result);
  }

  const track =
    document.getElementById("track_"+slotId);

  if(track){

    const index =
      Math.max(
        0,
        items.length*4-items.length+items.indexOf(chosen)
      );

    track.style.transition =
      "transform .75s cubic-bezier(.12,.7,.2,1)";

    track.style.transform =
      `translateY(-${index*180}px)`;
  }

  document
    .getElementById("materialReel_"+slotId)
    ?.classList.remove("reel-running");

  checkMaterialsComplete();
}

function findCurrentSlot(slotId){

  return game.selectedStyle?.slots.find(
    slot=>slot.id===slotId
  );
}

function startAllMaterials(){

  const slots =
    game.selectedStyle.slots
      .filter(s=>s.enabled!==false);

  let hasProblem = false;

  slots.forEach(slot=>{

    const items =
      availableItemsForSlot(slot);

    if(!items.length){
      hasProblem = true;
    }

  });

  if(hasProblem){

    showToast("有材料格没有可用库存或符合规则的材料");
    return;
  }

  slots.forEach(slot=>{
    startMaterial(slot.id);
  });

}

function stopAllMaterials(){

  const slots =
    game.selectedStyle.slots
      .filter(s=>s.enabled!==false);

  slots.forEach(slot=>{
    if(game.materialRunning[slot.id]){
      stopMaterial(slot.id);
    }

}

function checkMaterialsComplete(){

  const slots =
    game.selectedStyle.slots

function weightedRandomSigns(signs){

  const weights =
    signs.map(sign=>Number(sign.weight ?? 1));

  const total =
    weights.reduce((a,b)=>a+b,0);

  if(total<=0){
    return random(signs);
  }

  let r = Math.random()*total;

  for(let i=0;i<signs.length;i++){

    r -= weights[i];

    if(r<=0){
      return signs[i];
    }

  }

  return signs[signs.length-1];
}


/* =========================================================
   Lucky dynamic reward
========================================================= */

function getLuckyReward(sign){

  if(!sign) return null;

  let rewardText =
    sign.rewardText || "";

  let rewardItem = null;

  /*
    sameMainColor:
    与本次主色相同/同名
  */

  if(sign.rewardType==="sameMainColor"){

    const mainResult =
      findMainColorResult();

    if(mainResult){

      rewardItem = findSameColorReward(
        mainResult
      );

      if(rewardItem){

        rewardText =
          sign.rewardText
            .replace(/\{主色\}/g,mainResult.itemName)
            .replace(/\{奖励\}/g,rewardItem.name);

      }

    }

  }

  /*
    randomCategory:
    随机某个材料类别
  */

  if(sign.rewardType==="randomCategory"){

    const cat =
      categoryById(sign.rewardCategoryId);

    if(cat){

      const items =
        cat.items.filter(i=>Number(i.stock ?? 99)>0);

      rewardItem = random(items);

      if(rewardItem){

        rewardText =
          sign.rewardText
            .replace(/\{奖励\}/g,rewardItem.name);

      }

    }

  }

  /*
    fixed:
    固定奖励
  */

  if(sign.rewardType==="fixed"){

    rewardText =
      sign.rewardText
        .replace(/\{奖励\}/g,sign.rewardValue || "");

  }

  /*
    dynamic text:
    只改变文字，不实际扣库存
  */

  if(sign.rewardType==="blessing"){

    rewardText =
      sign.rewardText || "";
  }

  return {
    text:rewardText,
    item:rewardItem
  };

}

function findMainColorResult(){

  const result =
    game.materialResults.find(result=>{

      const label =
        String(result.label).toLowerCase();

      const category =
        String(result.categoryName).toLowerCase();

      return (
        label.includes("主色") ||
        category.includes("主色") ||
        label.includes("颜色") ||
        category.includes("颜色")
      );

    });

  return result || game.materialResults[0];
}

function findSameColorReward(mainResult){

  /*
    这里默认按照名字寻找相同/包含颜色关键词的奖励。
    如果以后需要更精确，可以在材料后台增加 colorGroup。
  */

  const keywords = [
    mainResult.itemName
  ];

  const allCategories =
    productData().categories;

  const candidates = [];

  allCategories.forEach(category=>{

    category.items.forEach(item=>{

      if(Number(item.stock ?? 99)<=0) return;

      const matched =
        keywords.some(keyword=>
          item.name.includes(keyword) ||
          keyword.includes(item.name)
        );

      if(matched){
        candidates.push(item);
      }

    });

  });

  return random(candidates);
}


/* =========================================================
   Show Lucky Result
========================================================= */

function getActiveScenicTheme(){

  const themes =
    productData().scenicThemes
      .filter(theme=>theme.enabled!==false);

  if(!themes.length) return null;

  const mode =
    themes.find(t=>t.forceActive);

  if(mode){
    return mode;
  }

  const today =
    new Date();

  const month =
    today.getMonth()+1;

  const day =
    today.getDate();

  const current =
    month*100+day;

  const matched =
    themes.find(theme=>{

      if(!theme.autoDate) return false;

      const start =
        parseMMDD(theme.startDate);

      const end =
        parseMMDD(theme.endDate);

      if(start<=end){
        return current>=start && current<=end;
      }

      return current>=start || current<=end;

    });

  return matched || null;
}

function parseMMDD(value){

  if(!value) return 0;

  const [m,d] =
    value.split("-").map(Number);

  return m*100+d;
}

function randomScenicAsset(theme){

  if(!theme) return null;

  const assets =
    (theme.assets || [])
      .filter(a=>a.enabled!==false);

  return random(assets);
}

function consumeStock(){

  /*
    款式库存
  */

  if(game.selectedStyle){

    if(Number(game.selectedStyle.stock ?? 99)<999){
      game.selectedStyle.stock =
        Math.max(
          0,
          Number(game.selectedStyle.stock ?? 99)-1
        );
    }

  }

  /*
    材料库存
  */

  game.materialResults.forEach(result=>{

    const item =
      itemById(
        result.categoryId,
        result.itemId
      );

    if(item && Number(item.stock ?? 99)<999){

      item.stock =
        Math.max(
          0,
          Number(item.stock ?? 99)-1
        );

    }

  });

  /*
    幸运签奖励材料库存
  */

  if(game.luckyResult){

    const reward =
      getLuckyReward(game.luckyResult);

    if(reward?.item){

      const item =
        findItemAnywhere(reward.item.id);

      if(item && Number(item.stock ?? 99)<999){

        item.stock =
          Math.max(
            0,
            Number(item.stock ?? 99)-1
          );

      }

    }

  }

  saveData();
}

function findItemAnywhere(itemId){

  for(const category of productData().categories){

    const item =
      category.items.find(i=>i.id===itemId);

    if(item) return item;

  }

  return null;
}

    productId:currentProduct,

    productName:
      PRODUCT_DEFS[currentProduct].name,

    order:game.order,

    style:{
      id:game.selectedStyle?.id,
      name:game.selectedStyle?.name,
      image:game.selectedStyle?.image || ""
    },

    materials:
      deepClone(game.materialResults),

    lucky:
      game.luckyResult
      ? {
          name:game.luckyResult.name,
          text:game.luckyResult.text,
          reward:luckyReward?.text || ""
        }
      : null

  });

  localStorage.setItem(
    "krystal_slot_history_v10",
    JSON.stringify(history)
  );

}

                  </strong>

                  </div>

                      '${style.id}',
                      '${slot.id}'
                    )
                  "
                >
                  删除这一格
                </button>

              </div>

            `;

          }).join("")
        }

      </div>

      <div class="game-actions" style="justify-content:flex-start;">

        <button
          class="btn btn-soft btn-small"
          onclick="addStyleSlot('${style.id}')"
        >
          ＋ 添加一个抽取格
        </button>

      </div>

}

function categoryByIdFromProduct(product,id){

  return product.categories.find(c=>c.id===id);
}

function addStyle(){

  const name =
    prompt("请输入新款式名称");

  if(!name) return;

  const p = settingsData();

  p.styles.push({

    id:uid("style"),

    name:name.trim(),

    image:"",

    photoOnly:false,

    stock:99,

    slots:[]

  });

  saveData();
  renderSettings();

}

function editStyle(styleId){

  const p = settingsData();

  const style =
    p.styles.find(s=>s.id===styleId);

  if(!style) return;

  const name =
    prompt("款式名称",style.name);

  if(name!==null && name.trim()){
    style.name=name.trim();
  }

  const stock =
    prompt(
      "库存数量（999 = 无限）",
      style.stock ?? 99
    );

  if(stock!==null && !isNaN(stock)){
    style.stock =
      Math.max(0,Number(stock));
  }

  const image =
    prompt(
      "图片网址（留空则使用文字/🧶）",
      style.image || ""
    );

  if(image!==null){
    style.image=image.trim();
  }

  saveData();
  renderSettings();

}

function deleteStyle(styleId){

  if(!confirm("确定删除这个款式吗？")){
    return;
  }

  const p = settingsData();

  p.styles =
    p.styles.filter(s=>s.id!==styleId);

  p.rules.styleCategory =
    p.rules.styleCategory.filter(
      r=>r.styleId!==styleId
    );

  saveData();
  renderSettings();

}

function toggleStyleSlot(styleId,slotId){

  const style =
    settingsData().styles.find(s=>s.id===styleId);

  const slot =
    style?.slots.find(s=>s.id===slotId);

  if(!slot) return;

  slot.enabled =
    !slot.enabled;

  saveData();
  renderSettings();

}

function removeStyleSlot(styleId,slotId){

  const style =
    settingsData().styles.find(s=>s.id===styleId);

  if(!style) return;

  style.slots =
    style.slots.filter(s=>s.id!==slotId);

  saveData();
  renderSettings();

}

function addStyleSlot(styleId){

  const p = settingsData();

  const style =
    p.styles.find(s=>s.id===styleId);

  if(!style) return;

  if(!p.categories.length){

    showToast("请先新增材料类别");
    return;
  }

  const categoryNameList =
    p.categories
      .map((cat,index)=>
        `${index+1}. ${cat.name}`
      )
      .join("\n");

  const choice =
    prompt(
      "请选择材料类别编号：\n\n"+
      categoryNameList
    );

  if(choice===null) return;

  const index =
    Number(choice)-1;

  const category =
    p.categories[index];

  if(!category){

    showToast("类别编号不正确");
    return;
  }

  const defaultLabel =
    category.name;

  const label =
    prompt(
      "这一格显示什么名字？",
      defaultLabel
    );

  if(label===null) return;

  style.slots.push({

    id:uid("slot"),

    categoryId:category.id,

    label:
      label.trim() || defaultLabel,

    enabled:true

  });

  saveData();
  renderSettings();

}

function addCategory(){

  const name =
    prompt("请输入新的材料类别名称，例如：珍珠、挂件、包带、珠子");

  if(!name || !name.trim()) return;

  const p = settingsData();

  p.categories.push({

    id:uid("cat"),

    name:name.trim(),

    items:[]

  });

  saveData();
  renderSettings();

}

function renameCategory(categoryId){

  const p = settingsData();

  const category =
    p.categories.find(c=>c.id===categoryId);

  if(!category) return;

  const name =
    prompt(
      "新的类别名称",
      category.name
    );

  if(name!==null && name.trim()){

    category.name =
      name.trim();

  }

  saveData();
  renderSettings();

}

function deleteCategory(categoryId){

  const p = settingsData();

  const category =
    p.categories.find(c=>c.id===categoryId);

  if(!category) return;

  if(!confirm(
    `确定删除「${category.name}」吗？\n\n`+
    "已经使用这个类别的抽取格也会被移除。"
  )){
    return;
  }

  p.categories =
    p.categories.filter(
      c=>c.id!==categoryId
    );

  p.styles.forEach(style=>{

    style.slots =
      style.slots.filter(
        slot=>slot.categoryId!==categoryId
      );

  });

  p.rules.styleCategory =
    p.rules.styleCategory.filter(
      r=>r.categoryId!==categoryId
    );

  p.rules.categoryPair =
    p.rules.categoryPair.filter(
      r=>
        r.fromCategoryId!==categoryId &&
        r.toCategoryId!==categoryId
    );

  saveData();
  renderSettings();

}

function addCategoryItem(categoryId){

  const p = settingsData();

  const category =
    p.categories.find(c=>c.id===categoryId);

  if(!category) return;

  const name =
    prompt("材料名称");

  if(!name || !name.trim()) return;

  const stock =
    prompt(
      "库存数量（999 = 无限）",
      "99"
    );

  const image =
    prompt(
      "图片网址（可以留空）",
      ""
    );

  category.items.push({

    id:uid("item"),

    name:name.trim(),

    image:image?.trim() || "",

    photoOnly:false,

    stock:
      isNaN(Number(stock))
      ? 99
      : Math.max(0,Number(stock))

  });

  saveData();
  renderSettings();

}

function editCategoryItem(categoryId,itemId){

  const category =
    settingsData()
      .categories
      .find(c=>c.id===categoryId);

  const item =
    category?.items.find(
      i=>i.id===itemId
    );

  if(!item) return;

  const name =
    prompt(
      "材料名称",
      item.name
    );

  if(name!==null && name.trim()){
    item.name=name.trim();
  }

  const stock =
    prompt(
      "库存数量（999 = 无限）",
      item.stock ?? 99
    );

  if(stock!==null && !isNaN(stock)){
    item.stock=Math.max(0,Number(stock));
  }

  const image =
    prompt(
      "图片网址（留空则无图片）",
      item.image || ""
    );

  if(image!==null){
    item.image=image.trim();
  }

  saveData();
  renderSettings();

}

function deleteCategoryItem(categoryId,itemId){

  if(!confirm("确定删除这个材料吗？")){
    return;
  }

  const category =
    settingsData()
      .categories
      .find(c=>c.id===categoryId);

  if(!category) return;

  category.items =
    category.items.filter(
      i=>i.id!==itemId
    );

  /*
    同时清理规则
  */

  const p = settingsData();

  p.rules.styleCategory =
    p.rules.styleCategory.map(rule=>{

      rule.allowedItemIds =
        (rule.allowedItemIds || [])
          .filter(id=>id!==itemId);

      return rule;

    });

  p.rules.categoryPair =
    p.rules.categoryPair.map(rule=>{

      rule.allowedItemIds =
        (rule.allowedItemIds || [])
          .filter(id=>id!==itemId);

      return rule;

    });

  saveData();
  renderSettings();

}

function renderLuckySignSetting(sign){

  return `

    <div class="category-card">

      <div class="category-head">

        <div>

            ${sign.symbol || "🍀"}
            ${esc(sign.name)}
          </strong>

          >

          }

function rewardTypeName(type){

  const map = {
    blessing:"纯祝福",
    fixed:"固定奖励",
    sameMainColor:"与主色同色系",
    randomCategory:"随机材料"
  };

  return map[type] || "祝福";
}

function addLuckySign(){

  const p = settingsData();

  p.luckySigns.push({

    id:uid("sign"),

    name:"新幸运签",

    symbol:"🍀",

    text:"今天也会有一点小幸运。",

    rewardType:"blessing",

    rewardText:"愿你今天也被温柔对待。",

    rewardValue:"",

    rewardCategoryId:"",

    weight:1,

    enabled:true

  });

  saveData();
  renderSettings();

}

function editLuckySign(signId){

  const p = settingsData();

  const sign =
    p.luckySigns.find(
      s=>s.id===signId
    );

  if(!sign) return;

  const name =
    prompt(
      "签名",
      sign.name
    );

  if(name!==null && name.trim()){
    sign.name=name.trim();
  }

  const symbol =
    prompt(
      "图标，例如 🌸 / 🍀 / 💕",
      sign.symbol || "🍀"
    );

  if(symbol!==null){
    sign.symbol=symbol.trim();
  }

  const text =
    prompt(
      "签文",
      sign.text || ""
    );

  if(text!==null){
    sign.text=text;
  }

  const type =
    prompt(
      "奖励类型：\n"+
      "blessing = 纯祝福\n"+
      "fixed = 固定奖励\n"+
      "sameMainColor = 与本次主色同色系\n"+
      "randomCategory = 随机材料",
      sign.rewardType || "blessing"
    );

  if(type!==null){
    sign.rewardType=type.trim();
  }

  const rewardText =
    prompt(
      "奖励显示文字。\n"+
      "可以使用 {主色} 和 {奖励}。",
      sign.rewardText || ""
    );

  if(rewardText!==null){
    sign.rewardText=rewardText;
  }

  if(sign.rewardType==="fixed"){

    const rewardValue =
      prompt(
        "固定奖励内容",
        sign.rewardValue || ""
      );

    if(rewardValue!==null){
      sign.rewardValue=rewardValue;
    }

  }

  if(sign.rewardType==="randomCategory"){

    const p = settingsData();

    const list =
      p.categories
        .map((c,i)=>`${i+1}. ${c.name}`)
        .join("\n");

    const choice =
      prompt(
        "选择随机材料类别：\n\n"+list
      );

    if(choice!==null){

      const cat =
        p.categories[
          Number(choice)-1
        ];

      if(cat){
        sign.rewardCategoryId=cat.id;
      }

    }

  }

  const weight =
    prompt(
      "抽取权重（数字越大越容易抽到）",
      sign.weight ?? 1
    );

  if(weight!==null && !isNaN(weight)){
    sign.weight=Math.max(.01,Number(weight));
  }

  const enabled =
    confirm(
      "这个幸运签现在要启用吗？\n\n"+
      "确定 = 启用\n取消 = 关闭"
    );

  sign.enabled=enabled;

  saveData();
  renderSettings();

}

function deleteLuckySign(signId){

  if(!confirm("确定删除这个幸运签吗？")){
    return;
  }

  const p = settingsData();

  p.luckySigns =
    p.luckySigns.filter(
      s=>s.id!==signId
    );

  saveData();
  renderSettings();

}


/* =========================================================
   Scenic Theme Settings
========================================================= */

function renderScenicTheme(theme){

  return `

    <div class="category-card">

      <div class="category-head">

        <div>

          <strong>
            ${esc(theme.emoji || "✨")}
            ${esc(theme.name)}
          </strong>

          <div class="muted">

            ${
              theme.autoDate
              ? `${esc(theme.startDate)} ～ ${esc(theme.endDate)}`
              : "手动/常驻主题"
            }

            ·

            ${
              theme.forceActive
              ? "当前强制使用"
              : theme.enabled===false
                ? "已关闭"
                : "启用中"
            }

          </div>

        </div>

        <div class="item-setting-actions">

          <button
            class="btn btn-soft btn-small"
            onclick="editScenicTheme('${theme.id}')"
          >
            编辑
          </button>

          <button
            class="btn btn-danger btn-small"
            onclick="deleteScenicTheme('${theme.id}')"
          >
            删除
          </button>

        </div>

      </div>

      <div class="category-items">

        ${
          (theme.assets || []).length
          ? theme.assets.map(asset=>`

              <div class="item-setting">

                <div class="item-setting-image">

                  ${
                    asset.image
                    ? `<img src="${asset.image}">`
                    : "✨"
                  }

                </div>

                <div>

                  <strong>
                    ${esc(asset.name)}
                  </strong>

                  <div class="muted">
                    ${asset.enabled===false?"已关闭":"启用"}
                    · ${asset.size || 65}px
                  </div>

                </div>

                <div class="item-setting-actions">

                  <button
                    class="btn btn-soft btn-small"
                    onclick="
                      editScenicAsset(
                        '${theme.id}',
                        '${asset.id}'
                      )
                    "
                  >
                    编辑
                  </button>

                  <button
                    class="btn btn-danger btn-small"
                    onclick="
                      deleteScenicAsset(
                        '${theme.id}',
                        '${asset.id}'
                      )
                    "
                  >
                    删除
                  </button>

                </div>

              </div>

            `).join("")
          : `
            <div class="muted">
              这个主题还没有素材。
            </div>
          `
        }

      </div>

      <div class="game-actions" style="justify-content:flex-start;">

        <button
          class="btn btn-primary btn-small"
          onclick="addScenicAsset('${theme.id}')"
        >
          ＋ 添加素材
        </button>

      </div>

    </div>

  `;

}

function addScenicTheme(){

  const p = settingsData();

  const name =
    prompt(
      "主题名称，例如：圣诞节 / 情人节 / 樱花季"
    );

  if(!name || !name.trim()) return;

  const emoji =
    prompt(
      "主题图标",
      "🎄"
    );

  p.scenicThemes.push({

    id:uid("theme"),

    name:name.trim(),

    emoji:emoji || "✨",

    enabled:true,

    autoDate:false,

    startDate:"12-01",

    endDate:"12-31",

    forceActive:false,

    assets:[]

  });

  saveData();
  renderSettings();

}

function editScenicTheme(themeId){

  const p = settingsData();

  const theme =
    p.scenicThemes.find(
      t=>t.id===themeId
    );

  if(!theme) return;

  const name =
    prompt(
      "主题名称",
      theme.name
    );

  if(name!==null && name.trim()){
    theme.name=name.trim();
  }

  const emoji =
    prompt(
      "主题图标",
      theme.emoji || "✨"
    );

  if(emoji!==null){
    theme.emoji=emoji;
  }

  const auto =
    confirm(
      "是否根据日期自动启用这个主题？\n\n"+
      "确定 = 自动日期模式\n"+
      "取消 = 手动/常驻模式"
    );

  theme.autoDate=auto;

  if(auto){

    const start =
      prompt(
        "开始日期 MM-DD",
        theme.startDate || "12-01"
      );

    const end =
      prompt(
        "结束日期 MM-DD",
        theme.endDate || "12-31"
      );

    if(start!==null){
      theme.startDate=start;
    }

    if(end!==null){
      theme.endDate=end;
    }

  }

  const force =
    confirm(
      "是否强制让这个主题成为当前主题？\n\n"+
      "如果有多个主题同时符合日期，强制主题优先。"
    );

  theme.forceActive=force;

  saveData();
  renderSettings();

}

function deleteScenicTheme(themeId){

  if(!confirm("确定删除这个应景主题吗？")){
    return;
  }

  const p = settingsData();

  p.scenicThemes =
    p.scenicThemes.filter(
      t=>t.id!==themeId
    );

  saveData();
  renderSettings();

}

function addScenicAsset(themeId){

  const theme =
    settingsData()
      .scenicThemes
      .find(t=>t.id===themeId);

  if(!theme) return;

  const name =
    prompt(
      "素材名称，例如：姜饼人"
    );

  if(!name || !name.trim()) return;

  const image =
    prompt(
      "素材图片网址。\n"+
      "建议使用透明 PNG。",
      ""
    );

  if(!image) return;

  const size =
    prompt(
      "显示大小（px）",
      "65"
    );

  theme.assets.push({

    id:uid("asset"),

    name:name.trim(),

    image:image.trim(),

    size:
      isNaN(Number(size))
      ? 65
      : Number(size),

    enabled:true

  });

  saveData();
  renderSettings();

}

function editScenicAsset(themeId,assetId){

  const theme =
    settingsData()
      .scenicThemes
      .find(t=>t.id===themeId);

  const asset =
    theme?.assets.find(
      a=>a.id===assetId
    );

  if(!asset) return;

  const name =
    prompt(
      "素材名称",
      asset.name
    );

  if(name!==null && name.trim()){
    asset.name=name.trim();
  }

  const image =
    prompt(
      "图片网址",
      asset.image
    );

  if(image!==null){
    asset.image=image.trim();
  }

  const size =
    prompt(
      "显示大小",
      asset.size || 65
    );

  if(size!==null && !isNaN(size)){
    asset.size=Number(size);
  }

  asset.enabled =
    confirm(
      "是否启用这个素材？"
    );

  saveData();
  renderSettings();

}

function deleteScenicAsset(themeId,assetId){

  if(!confirm("确定删除这个应景素材吗？")){
    return;
  }

  const theme =
    settingsData()
      .scenicThemes
      .find(t=>t.id===themeId);

  if(!theme) return;

  theme.assets =
    theme.assets.filter(
      a=>a.id!==assetId
    );

  saveData();
  renderSettings();

}


/* =========================================================
   Rules Settings
========================================================= */

function renderRulesSettings(){

  const p = settingsData();

  return `

    <div class="rule-box">

      <strong>
        🎀 款式 → 材料限制
      </strong>

      <div class="muted">
        例如：云朵款的主色只能抽米白、浅蓝。
      </div>

      ${
        p.rules.styleCategory.map(rule=>
          renderStyleRule(rule)
        ).join("")
      }

      <div class="game-actions" style="justify-content:flex-start;">

        <button
          class="btn btn-soft btn-small"
          onclick="addStyleRule()"
        >
          ＋ 添加款式限制
        </button>

      </div>

    </div>


    <div class="rule-box">

      <strong>
        🎨 材料 → 材料搭配限制
      </strong>

      <div class="muted">
        例如：主色=金黄时，配色只能出现米白/橘黄。
      </div>

      ${
        p.rules.categoryPair.map(rule=>
          renderPairRule(rule)
        ).join("")
      }

      <div class="game-actions" style="justify-content:flex-start;">

        <button
          class="btn btn-soft btn-small"
          onclick="addPairRule()"
        >
          ＋ 添加搭配规则
        </button>

      </div>

    </div>

  `;

}

function renderStyleRule(rule){

  const p = settingsData();

  const style =
    p.styles.find(
      s=>s.id===rule.styleId
    );

  const category =
    p.categories.find(
      c=>c.id===rule.categoryId
    );

  return `

    <div class="rule-row">

      <select
        onchange="
          updateStyleRule(
            '${rule.id}',
            'styleId',
            this.value
          )
        "
      >

        <option value="">
          选择款式
        </option>

        ${
          p.styles.map(style=>`

            <option
              value="${style.id}"
              ${style.id===rule.styleId?"selected":""}
            >
              ${esc(style.name)}
            </option>

          `).join("")
        }

      </select>


      <select
        onchange="
          updateStyleRule(
            '${rule.id}',
            'categoryId',
            this.value
          )
        "
      >

        <option value="">
          选择材料类别
        </option>

        ${
          p.categories.map(cat=>`

            <option
              value="${cat.id}"
              ${cat.id===rule.categoryId?"selected":""}
            >
              ${esc(cat.name)}
            </option>

          `).join("")
        }

      </select>


      <button
        class="btn btn-danger btn-small"
        onclick="deleteStyleRule('${rule.id}')"
      >
        删除
      </button>

    </div>

    <div style="margin-top:7px;">

      <div class="muted">
        允许的材料：
      </div>

      <select
        multiple
        size="4"
        onchange="
          updateStyleRuleItems(
            '${rule.id}',
            this
          )
        "
      >

        ${
          category
          ? category.items.map(item=>`

              <option
                value="${item.id}"
                ${
                  (rule.allowedItemIds||[])
                    .includes(item.id)
                  ? "selected"
                  : ""
                }
              >
                ${esc(item.name)}
              </option>

            `).join("")
          : ""
        }

      </select>

    </div>

  `;

}

function addStyleRule(){

  settingsData().rules.styleCategory.push({

    id:uid("rule"),

    styleId:
      settingsData().styles[0]?.id || "",

    categoryId:
      settingsData().categories[0]?.id || "",

    allowedItemIds:[]

  });

  saveData();
  renderSettings();

}

function updateStyleRule(ruleId,key,value){

  const rule =
    settingsData()
      .rules
      .styleCategory
      .find(r=>r.id===ruleId);

  if(!rule) return;

  rule[key]=value;

  saveData();
  renderSettings();

}

function updateStyleRuleItems(ruleId,select){

  const rule =
    settingsData()
      .rules
      .styleCategory
      .find(r=>r.id===ruleId);

  if(!rule) return;

  rule.allowedItemIds =
    [...select.selectedOptions]
      .map(option=>option.value);

  saveData();

}

function deleteStyleRule(ruleId){

  const p=settingsData();

  p.rules.styleCategory =
    p.rules.styleCategory
      .filter(r=>r.id!==ruleId);

  saveData();
  renderSettings();

}

function renderPairRule(rule){

  const p=settingsData();

  const fromCategory =
    p.categories.find(
      c=>c.id===rule.fromCategoryId
    );

  const fromItem =
    fromCategory?.items.find(
      i=>i.id===rule.fromItemId
    );

  const toCategory =
    p.categories.find(
      c=>c.id===rule.toCategoryId
    );

  return `

    <div class="rule-row">

      <select
        onchange="
          updatePairRule(
            '${rule.id}',
            'fromCategoryId',
            this.value
          )
        "
      >

        <option value="">
          来源类别
        </option>

        ${
          p.categories.map(cat=>`

            <option
              value="${cat.id}"
              ${cat.id===rule.fromCategoryId?"selected":""}
            >
              ${esc(cat.name)}
            </option>

          `).join("")
        }

      </select>


      <select
        onchange="
          updatePairRule(
            '${rule.id}',
            'toCategoryId',
            this.value
          )
        "
      >

        <option value="">
          目标类别
        </option>

        ${
          p.categories.map(cat=>`

            <option
              value="${cat.id}"
              ${cat.id===rule.toCategoryId?"selected":""}
            >
              ${esc(cat.name)}
            </option>

          `).join("")
        }

      </select>


      <button
        class="btn btn-danger btn-small"
        onclick="deletePairRule('${rule.id}')"
      >
        删除
      </button>

    </div>


    <div style="margin-top:7px;">

      <div class="muted">
        来源材料：
      </div>

      <select
        onchange="
          updatePairRule(
            '${rule.id}',
            'fromItemId',
            this.value
          )
        "
      >

        <option value="">
          选择来源材料
        </option>

        ${
          fromCategory
          ? fromCategory.items.map(item=>`

              <option
                value="${item.id}"
                ${item.id===rule.fromItemId?"selected":""}
              >
                ${esc(item.name)}
              </option>

            `).join("")
          : ""
        }

      </select>

    </div>


    <div style="margin-top:7px;">

      <div class="muted">
        允许目标材料：
      </div>

      <select
        multiple
        size="4"
        onchange="
          updatePairRuleItems(
            '${rule.id}',
            this
          )
        "
      >

        ${
          toCategory
          ? toCategory.items.map(item=>`

              <option
                value="${item.id}"
                ${
                  (rule.allowedItemIds||[])
                    .includes(item.id)
                  ? "selected"
                  : ""
                }
              >
                ${esc(item.name)}
              </option>

            `).join("")
          : ""
        }

      </select>

    </div>

  `;

}

function addPairRule(){

  const p=settingsData();

  p.rules.categoryPair.push({

    id:uid("pair"),

    fromCategoryId:
      p.categories[0]?.id || "",

    fromItemId:"",

    toCategoryId:
      p.categories[1]?.id ||
      p.categories[0]?.id ||
      "",

    allowedItemIds:[]

  });

  saveData();
  renderSettings();

}

function updatePairRule(ruleId,key,value){

  const rule =
    settingsData()
      .rules
      .categoryPair
      .find(r=>r.id===ruleId);

  if(!rule) return;

  rule[key]=value;

  saveData();
  renderSettings();

}

function updatePairRuleItems(ruleId,select){

  const rule =
    settingsData()
      .rules
      .categoryPair
      .find(r=>r.id===ruleId);

  if(!rule) return;

  rule.allowedItemIds =
    [...select.selectedOptions]
      .map(option=>option.value);

  saveData();

}

function deletePairRule(ruleId){

  const p=settingsData();

  p.rules.categoryPair =
    p.rules.categoryPair
      .filter(r=>r.id!==ruleId);

  saveData();
  renderSettings();

}


/* =========================================================
   Modal
========================================================= */

function openModal(html){

  const backdrop =
    document.getElementById("modalBackdrop");

  const content =
    document.getElementById("modalContent");

  content.innerHTML=html;

  backdrop.classList.add("show");

}

function closeModal(){

  document
    .getElementById("modalBackdrop")
    .classList.remove("show");

}

document
  .getElementById("modalBackdrop")
  .addEventListener("click",event=>{

    if(event.target.id==="modalBackdrop"){
      closeModal();
    }

  });


/* =========================================================
   Stop all
========================================================= */

function stopAllRunning(){

  if(game.styleTimer){
    clearInterval(game.styleTimer);
  }

  Object.values(
    game.materialTimers || {}
  ).forEach(timer=>{
    clearInterval(timer);
  });

  if(game.luckyTimer){
    clearInterval(game.luckyTimer);
  }

  game.styleRunning=false;
  game.luckyRunning=false;

  Object.keys(
    game.materialRunning || {}
  ).forEach(key=>{
    game.materialRunning[key]=false;
  });

}
