<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krystal 的毛线研究室</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

:root{
  --pink:#ff9fbd;
  --pink2:#f58cab;
  --light:#fff2f6;
  --cream:#fffaf7;
  --text:#705b64;
  --muted:#ad919b;
  --border:#efd2dc;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,#fff0f5 0 7%,transparent 8%),
    radial-gradient(circle at 90% 15%,#fff5df 0 6%,transparent 7%),
    linear-gradient(180deg,#fff9fb,#fffaf6);

  color:var(--text);

  font-family:
    "ZCOOL KuaiLe",
    "STYuanti-SC",
    "Yuanti SC",
    "Hannotate SC",
    "Hiragino Maru Gothic ProN",
    "Arial Rounded MT Bold",
    "PingFang SC",
    sans-serif;
}

button,
input{
  font-family:inherit;
}

header{
  position:sticky;
  top:0;
  z-index:100;

  background:rgba(255,250,252,.96);
  backdrop-filter:blur(12px);

  border-bottom:1px solid #f5dce4;
}

.header-inner{
  max-width:1400px;
  margin:auto;
  padding:14px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:#df7899;
  font-size:24px;
  white-space:nowrap;
}

.nav{
  display:flex;
  gap:8px;
}

.nav button{
  border:1px solid var(--border);
  background:white;
  color:var(--text);

  border-radius:999px;
  padding:9px 16px;

  font-size:16px;
  cursor:pointer;
}

.nav button.active{
  background:var(--pink);
  color:white;
  border-color:var(--pink);
}

main{
  max-width:1450px;
  margin:auto;
  padding:28px 18px 70px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  text-align:center;
  margin-bottom:25px;
}

.page-title h1{
  margin:0;
  color:#df7899;
  font-size:35px;
}

.page-title p{
  margin:7px 0 0;
  color:var(--muted);
}

/* =========================
老虎机
========================= */

.draw-panel{
  background:rgba(255,255,255,.94);
  border:2px solid #f5d9e2;
  border-radius:28px;
  padding:20px;

  box-shadow:
    0 8px 28px rgba(225,145,170,.16);
}

/*
  六个永远一排
*/

.machine-grid{
  display:grid;
  grid-template-columns:
    repeat(6,minmax(150px,1fr));

  gap:12px;

  min-width:950px;
}

.machine-scroll{
  overflow-x:auto;
  padding-bottom:5px;
}

.machine{
  background:#fffafb;
  border:2px solid #f4dce4;
  border-radius:20px;
  padding:12px;
  text-align:center;
}

.machine-title{
  color:#d97898;
  font-size:19px;
  margin-bottom:10px;
  white-space:nowrap;
}

.reel-window{
  position:relative;
  height:270px;
  overflow:hidden;

  background:white;
  border:2px solid #efd0db;
  border-radius:16px;
}

/* 中间中奖格 */

.reel-window::after{
  content:"";

  position:absolute;
  z-index:20;

  left:0;
  right:0;
  top:90px;

  height:90px;

  border-top:3px solid #ff9fbd;
  border-bottom:3px solid #ff9fbd;

  background:rgba(255,170,195,.08);

  pointer-events:none;
}

.reel{
  position:absolute;
  left:0;
  top:0;

  width:100%;

  will-change:transform;
}

.reel-item{
  width:100%;
  height:90px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/*
  统一尺寸。
  有照片：照片
  没照片：文字
*/

.reel-visual{
  width:70px;
  height:70px;

  border-radius:15px;

  border:2px solid #efd2dc;

  background:#fff2f6;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  text-align:center;

  color:#d27a96;
  font-size:15px;
  line-height:1.2;

  padding:5px;
}

.reel-visual img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.machine-buttons{
  margin-top:10px;
}

.stop-one{
  width:100%;

  border:none;
  border-radius:999px;

  padding:8px;

  background:#ffe3ec;
  color:#c76c8b;

  font-size:14px;
  cursor:pointer;
}

.stop-one:hover{
  background:#ffd4e1;
}

.main-controls{
  display:flex;
  justify-content:center;
  gap:12px;

  margin-top:22px;
}

.main-controls button{
  border:none;
  border-radius:999px;

  padding:13px 28px;

  font-size:18px;
  cursor:pointer;
}

.start-btn{
  background:var(--pink);
  color:white;
}

.stop-all-btn{
  background:#ffe1ea;
  color:#c56d89;
}

/* =========================
结果弹窗
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:500;

  background:rgba(70,45,56,.35);
  backdrop-filter:blur(5px);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal-overlay.show{
  display:flex;
}

.result-modal{
  width:min(680px,100%);
  max-height:90vh;
  overflow:auto;

  background:#fffafb;

  border:3px solid #f4ccd9;
  border-radius:28px;

  padding:25px;

  box-shadow:0 20px 60px rgba(120,70,90,.22);
}

.result-title{
  text-align:center;
  color:#df7899;
  font-size:30px;
  margin-bottom:20px;
}

.result-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.result-row{
  min-height:88px;

  display:flex;
  align-items:center;

  gap:15px;

  padding:9px 13px;

  background:white;

  border:1px solid #efd6df;
  border-radius:18px;
}

.result-visual{
  width:70px;
  height:70px;
  min-width:70px;

  border-radius:15px;

  overflow:hidden;

  border:2px solid #efd2dc;

  background:#fff2f6;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  color:#d27a96;
  font-size:15px;

  padding:5px;
}

.result-visual img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.result-info{
  flex:1;
}

.result-label{
  color:#b08491;
  font-size:14px;
  margin-bottom:4px;
}

.result-name{
  color:#705b64;
  font-size:20px;
}

.result-actions{
  display:flex;
  justify-content:center;

  margin-top:22px;
}

.confirm-btn{
  border:none;
  border-radius:999px;

  padding:13px 42px;

  background:#f58cab;
  color:white;

  font-size:19px;
  cursor:pointer;
}

/* =========================
设置
========================= */

.settings-section{
  background:rgba(255,255,255,.95);

  border:2px solid #f4d9e2;
  border-radius:25px;

  padding:22px;
  margin-bottom:22px;

  box-shadow:
    0 8px 28px rgba(225,145,170,.12);
}

.settings-section h2{
  margin-top:0;
  color:#dc7898;
}

.add-box{
  background:#fff6fa;

  border:1px dashed #efbdce;
  border-radius:18px;

  padding:16px;
  margin-bottom:17px;
}

.add-row{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

input[type=text],
input[type=number]{
  border:1px solid #e3c5d0;

  border-radius:12px;

  padding:9px 11px;

  background:white;

  color:var(--text);

  font-size:15px;
}

input[type=text]{
  min-width:190px;
}

input[type=number]{
  width:65px;
  text-align:center;
}

input[type=file]{
  max-width:230px;
}

.add-button{
  border:none;
  border-radius:999px;

  background:#ffabc5;
  color:white;

  padding:9px 15px;

  cursor:pointer;
}

.photo-only-label{
  display:inline-flex;
  align-items:center;
  gap:5px;

  font-size:14px;
}

.items-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.manage-card{
  background:#fffafb;

  border:1px solid #efd5de;
  border-radius:19px;

  padding:14px;
}

.manage-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.manage-visual{
  width:80px;
  height:80px;
  min-width:80px;

  border-radius:15px;

  border:2px solid #efd2dc;

  background:#fff2f6;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#d27a96;
  font-size:15px;

  text-align:center;

  padding:5px;
}

.manage-visual img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.manage-info{
  flex:1;
}

.manage-name{
  font-size:18px;
  color:#765d66;
  margin-bottom:5px;
}

.delete-btn{
  border:none;
  border-radius:999px;

  background:#ffe7ee;
  color:#d06e8d;

  padding:7px 11px;

  cursor:pointer;
}

.photo-tools{
  display:flex;
  gap:7px;
  flex-wrap:wrap;

  margin-top:12px;
  padding-top:11px;

  border-top:1px dashed #efd6df;
}

.photo-change-btn,
.photo-delete-btn{
  border:none;
  border-radius:999px;

  padding:7px 12px;

  font-size:13px;
  cursor:pointer;
}

.photo-change-btn{
  background:#ffe1eb;
  color:#c96987;
}

.photo-delete-btn{
  background:#f2ecef;
  color:#997d86;
}

/* =========================
库存
========================= */

.stock-box{
  margin-top:11px;

  background:white;

  border:1px solid #eed3dc;
  border-radius:15px;

  padding:10px 12px;
}

.stock-title{
  color:#9d7480;
  font-size:14px;
  margin-bottom:6px;
}

.stock-control{
  display:flex;
  align-items:center;
  gap:7px;
}

.stock-control button{
  width:32px;
  height:32px;

  border:none;
  border-radius:50%;

  background:#ffe0e9;
  color:#c96685;

  font-size:20px;
  cursor:pointer;
}

.stock-control input{
  width:60px;
  height:32px;
  padding:2px;
}

.stock-ok{
  color:#68a780;
  font-size:13px;
}

.stock-zero{
  color:#d27d7d;
  font-size:13px;
}

/* =========================
规则
========================= */

.rules-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.rule-box{
  border:1px solid #efd5de;
  border-radius:17px;

  padding:15px;

  background:#fffafb;
}

.rule-box h3{
  margin-top:0;
  color:#bd7c8e;
}

.checkbox-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.checkbox-item{
  background:white;

  border:1px solid #ecd1da;
  border-radius:999px;

  padding:6px 9px;

  font-size:13px;
}

.save-rules{
  margin-top:20px;

  border:none;
  border-radius:999px;

  background:#ff9fbd;
  color:white;

  padding:12px 25px;

  font-size:16px;
  cursor:pointer;
}

/* =========================
手机
========================= */

@media(max-width:700px){

  .header-inner{
    flex-direction:column;
  }

  .items-list{
    grid-template-columns:1fr;
  }

  .rules-grid{
    grid-template-columns:1fr;
  }

  .page-title h1{
    font-size:29px;
  }

}
</style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      🧶 Krystal 的毛线研究室
    </div>

    <div class="nav">

      <button
        id="navDraw"
        class="active"
        onclick="showPage('draw')">
        🎰 开始抽取
      </button>

      <button
        id="navSettings"
        onclick="showPage('settings')">
        ⚙️ 页面设置
      </button>

    </div>

  </div>

</header>


<main>

<!-- =====================================================
抽取页面
===================================================== -->

<section
  id="drawPage"
  class="page active">

  <div class="page-title">

    <h1>
      🎰 毛线研究室老虎机
    </h1>

    <p>
      今天会抽到什么组合呢？
    </p>

  </div>


  <div class="draw-panel">

    <!-- 横向滚动容器 -->
    <div class="machine-scroll">

      <div class="machine-grid">


        <!-- 款式 -->

        <div class="machine">

          <div class="machine-title">
            👜 款式
          </div>

          <div class="reel-window">

            <div
              id="reel-style"
              class="reel">
            </div>

          </div>

          <div class="machine-buttons">

            <button
              class="stop-one"
              onclick="stopSingle('style')">

              单独停止

            </button>

          </div>

        </div>


        <!-- 主色 -->

        <div class="machine">

          <div class="machine-title">
            🎨 线材主色
          </div>

          <div class="reel-window">

            <div
              id="reel-mainColor"
              class="reel">
            </div>

          </div>

          <div class="machine-buttons">

            <button
              class="stop-one"
              onclick="stopSingle('mainColor')">

              单独停止

            </button>

          </div>

        </div>


        <!-- 配色 -->

        <div class="machine">

          <div class="machine-title">
            🌈 线材配色
          </div>

          <div class="reel-window">

            <div
              id="reel-secondaryColor"
              class="reel">
            </div>

          </div>

          <div class="machine-buttons">

            <button
              class="stop-one"
              onclick="stopSingle('secondaryColor')">

              单独停止

            </button>

          </div>

        </div>


        <!-- 主扣 -->

        <div class="machine">

          <div class="machine-title">
            🎀 主扣
          </div>

          <div class="reel-window">

            <div
              id="reel-mainButton"
              class="reel">
            </div>

          </div>

          <div class="machine-buttons">

            <button
              class="stop-one"
              onclick="stopSingle('mainButton')">

              单独停止

            </button>

          </div>

        </div>


        <!-- 副扣 -->

        <div class="machine">

          <div class="machine-title">
            🎀 副扣
          </div>

          <div class="reel-window">

            <div
              id="reel-subButton"
              class="reel">
            </div>

          </div>

          <div class="machine-buttons">

            <button
              class="stop-one"
              onclick="stopSingle('subButton')">

              单独停止

            </button>

          </div>

        </div>


        <!-- 吊饰 -->

        <div class="machine">

          <div class="machine-title">
            ✨ 小吊饰
          </div>

          <div class="reel-window">

            <div
              id="reel-charm"
              class="reel">
            </div>

          </div>

          <div class="machine-buttons">

            <button
              class="stop-one"
              onclick="stopSingle('charm')">

              单独停止

            </button>

          </div>

        </div>


      </div>

    </div>


    <div class="main-controls">

      <button
        class="start-btn"
        onclick="startAll()">

        🎰 全部开始

      </button>

      <button
        class="stop-all-btn"
        onclick="stopAll()">

        🛑 全部停止

      </button>

    </div>

  </div>

</section>


<!-- =====================================================
设置页面
===================================================== -->

<section
  id="settingsPage"
  class="page">

  <div class="page-title">

    <h1>
      ⚙️ 页面设置
    </h1>

    <p>
      管理项目、照片、库存和抽取规则
    </p>

  </div>


  <!-- 款式 -->

  <div class="settings-section">

    <h2>
      👜 款式管理
    </h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="styleName"
          type="text"
          placeholder="例如：蝴蝶结">

        <input
          id="styleImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">

          <input
            id="stylePhotoOnly"
            type="checkbox">

          只显示照片

        </label>

        <button
          class="add-button"
          onclick="addItem('styles')">

          ＋ 添加款式

        </button>

      </div>

    </div>

    <div
      id="stylesList"
      class="items-list">
    </div>

  </div>


  <!-- 主色 -->

  <div class="settings-section">

    <h2>
      🎨 线材主色
    </h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="mainColorName"
          type="text"
          placeholder="例如：黄色">

        <input
          id="mainColorImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">

          <input
            id="mainColorPhotoOnly"
            type="checkbox">

          只显示照片

        </label>

        <button
          class="add-button"
          onclick="addItem('mainColors')">

          ＋ 添加主色

        </button>

      </div>

    </div>

    <div
      id="mainColorsList"
      class="items-list">
    </div>

  </div>


  <!-- 配色 -->

  <div class="settings-section">

    <h2>
      🌈 线材配色
    </h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="secondaryColorName"
          type="text"
          placeholder="例如：红色">

        <input
          id="secondaryColorImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">

          <input
            id="secondaryColorPhotoOnly"
            type="checkbox">

          只显示照片

        </label>

        <button
          class="add-button"
          onclick="addItem('secondaryColors')">

          ＋ 添加配色

        </button>

      </div>

    </div>

    <div
      id="secondaryColorsList"
      class="items-list">
    </div>

  </div>


  <!-- 扣子 -->

  <div class="settings-section">

    <h2>
      🎀 主扣 / 副扣
    </h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="buttonName"
          type="text"
          placeholder="例如：白色">

        <input
          id="buttonImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">

          <input
            id="buttonPhotoOnly"
            type="checkbox">

          只显示照片

        </label>

        <button
          class="add-button"
          onclick="addItem('buttons')">

          ＋ 添加扣子

        </button>

      </div>

    </div>

    <div
      id="buttonsList"
      class="items-list">
    </div>

  </div>


  <!-- 吊饰 -->

  <div class="settings-section">

    <h2>
      ✨ 小吊饰
    </h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="charmName"
          type="text"
          placeholder="例如：圣诞">

        <input
          id="charmImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">

          <input
            id="charmPhotoOnly"
            type="checkbox">

          只显示照片

        </label>

        <button
          class="add-button"
          onclick="addItem('charms')">

          ＋ 添加吊饰

        </button>

      </div>

    </div>

    <div
      id="charmsList"
      class="items-list">
    </div>

  </div>


  <!-- 规则 -->

  <div class="settings-section">

    <h2>
      🔮 抽取限制
    </h2>

    <p>
      不勾选任何项目 = 全部允许。
    </p>

    <div
      id="rulesContainer"
      class="rules-grid">
    </div>

    <button
      class="save-rules"
      onclick="saveRules()">

      💗 保存抽取规则

    </button>

  </div>

</section>

</main>


<!-- =====================================================
结果弹窗
===================================================== -->

<div
  id="resultModal"
  class="modal-overlay">

  <div class="result-modal">

    <div class="result-title">
      💗 抽取结果
    </div>

    <div
      id="resultList"
      class="result-list">
    </div>

    <div class="result-actions">

      <button
        class="confirm-btn"
        onclick="confirmResult()">

        💗 确认

      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
数据
===================================================== */

const DEFAULT_DATA={

  styles:[
    {
      id:"style_basic",
      name:"基础款",
      image:"",
      stock:10,
      photoOnly:false
    }
  ],

  mainColors:[
    {
      id:"mc_yellow",
      name:"黄色",
      image:"",
      stock:10,
      photoOnly:false
    },
    {

/* =====================================================
储存
===================================================== */

function loadData(){

  const saved=
    localStorage.getItem(
      "krystalSlotMachine"
    );


  if(!saved){

    return structuredClone(
      DEFAULT_DATA
    );

  }


  try{

    const parsed=JSON.parse(saved);


    const result={
      ...structuredClone(DEFAULT_DATA),
      ...parsed
    };


    [
      "styles",
      "mainColors",
      "secondaryColors",
      "buttons",
      "charms"
    ].forEach(category=>{

      if(!Array.isArray(result[category])){
        result[category]=[];
      }


      result[category].forEach(item=>{

        if(!item.id){
          item.id=createId();
        }

        if(typeof item.stock!=="number"){
          item.stock=10;
        }

        if(typeof item.image!=="string"){
          item.image="";
        }

        if(typeof item.photoOnly!=="boolean"){
          item.photoOnly=false;
        }

      });

    });


    if(!result.styleRules){
      result.styleRules={};
    }

    if(!result.mainColorRules){
      result.mainColorRules={};
    }


    return result;

  }catch(e){

    return structuredClone(
      DEFAULT_DATA
    );

  }

}


function saveData(){

  localStorage.setItem(
    "krystalSlotMachine",
    JSON.stringify(data)
  );

}


function createId(){

  return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);

}


function getItems(category){

  return data[category]||[];

}


function getItem(category,id){

  return getItems(category)
    .find(item=>item.id===id);

}


function escapeHtml(text){

  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

async function addItem(category){

  const config={

    styles:{
      name:"styleName",
      image:"styleImage",
      photoOnly:"stylePhotoOnly"
    },

    mainColors:{
      name:"mainColorName",
      image:"mainColorImage",
      photoOnly:"mainColorPhotoOnly"
    },

    secondaryColors:{
      name:"secondaryColorName",
      image:"secondaryColorImage",
      photoOnly:"secondaryColorPhotoOnly"
    },

    buttons:{
      name:"buttonName",
      image:"buttonImage",
      photoOnly:"buttonPhotoOnly"
    },

    charms:{
      name:"charmName",
      image:"charmImage",
      photoOnly:"charmPhotoOnly"
    }

  }[category];


  const name=
    document
      .getElementById(config.name)
      .value
      .trim();


  const file=
    document
      .getElementById(config.image)
      .files[0];


  const photoOnly=
    document
      .getElementById(config.photoOnly)
      .checked;


  if(!name&&!file){

    alert(
      "请输入名称或者上传照片。"
    );

    return;

  }


  let image="";


  if(file){

    image=
      await readImage(file);

  }


  data[category].push({

    id:createId(),

    name:name||"照片项目",

    image,

    stock:10,

    photoOnly

  });


  saveData();


  document
    .getElementById(config.name)
    .value="";

  document
    .getElementById(config.image)
    .value="";

  document
    .getElementById(config.photoOnly)
    .checked=false;


  renderSettings();

}


function readImage(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}

function deleteItem(

  if(!item) return;

    !confirm(
      `确定删除「${item.name}」吗？`
    )

库存
===================================================== */

function setStock(
  category,
  id,
  value
){

  const item=
    getItem(category,id);


  if(!item) return;


  let stock=
    parseInt(value,10);


  if(isNaN(stock)||stock<0){
    stock=0;
  }


  item.stock=stock;

  saveData();

  renderManageList(category);

}


function changeStock(
  category,
  id,
  amount
){

  const item=
    getItem(category,id);


  if(!item) return;


  item.stock=
    Math.max(
      0,
      Number(item.stock||0)+amount
    );


  saveData();

  renderManageList(category);

}

/* =====================================================
抽取池
===================================================== */

function getVisualPool(
  slot,
  context
){

  const category=
    categoryMap[slot];


  let items=
    [...getItems(category)];


  /*
    主色跟随款式
  */

  if(
    slot==="mainColor" &&
    context.style
  ){

    const rule=
      data.styleRules[
        context.style
      ];


    if(
      rule &&
      rule.mainColors &&
      rule.mainColors.length
    ){

      items=
        items.filter(item=>
          rule.mainColors.includes(
            item.id
          )
        );

    }

  }


  /*
    配色跟随主色
  */

  if(
    slot==="secondaryColor" &&
    context.mainColor
  ){

    const rule=
      data.mainColorRules[
        context.mainColor
      ];


    if(
      rule &&
      rule.length
    ){

      items=
        items.filter(item=>
          rule.includes(item.id)
        );

    }

  }


  /*
    扣子 / 吊饰跟随款式
  */

  if(
    (
      slot==="mainButton"||
      slot==="subButton"||
      slot==="charm"
    ) &&
    context.style
  ){

    const rule=
      data.styleRules[
        context.style
      ];


    const allowed=
      rule &&
      rule[category];


    if(
      allowed &&
      allowed.length
    ){

      items=
        items.filter(item=>
          allowed.includes(item.id)
        );

    }

  }


  return items;

}


function getAvailablePool(
  slot,
  context
){

  return getVisualPool(
    slot,
    context
  )
  .filter(
    item=>Number(item.stock)>0
  );

}


/* =====================================================
最终组合
===================================================== */

function pickRandom(array){

  if(!array.length){
    return null;
  }


  return array[
    Math.floor(
      Math.random()*array.length
    )
  ];

}


function generateFinalResult(){

  const result={};


  const styles=
    getAvailablePool(
      "style",
      result
    );


  if(!styles.length){
    throw new Error("没有可用的款式库存。");
  }


  result.style=
    pickRandom(styles).id;


  const mainColors=
    getAvailablePool(
      "mainColor",
      result
    );


  if(!mainColors.length){
    throw new Error("当前款式没有可用的主色库存。");
  }


  result.mainColor=
    pickRandom(mainColors).id;


  const secondaryColors=
    getAvailablePool(
      "secondaryColor",
      result
    );


  if(!secondaryColors.length){
    throw new Error("当前主色没有可用的配色库存。");
  }


  result.secondaryColor=
    pickRandom(secondaryColors).id;


  const mainButtons=
    getAvailablePool(
      "mainButton",
      result
    );


  if(!mainButtons.length){
    throw new Error("没有可用的主扣库存。");
  }


  result.mainButton=
    pickRandom(mainButtons).id;


  const subButtons=
    getAvailablePool(
      "subButton",
      result
    );


  if(!subButtons.length){
    throw new Error("没有可用的副扣库存。");
  }


  result.subButton=
    pickRandom(subButtons).id;


  const charms=
    getAvailablePool(
      "charm",
      result
    );


  if(!charms.length){
    throw new Error("没有可用的小吊饰库存。");
  }


  result.charm=
    pickRandom(charms).id;


  return result;

}


/* =====================================================
滚盘
===================================================== */

function createReel(pool){

  if(!pool.length){

    return `
      <div class="reel-item">
        <div class="reel-visual">
          暂无
        </div>
      </div>
    `;

  }


  const itemHeight=90;


  const rounds=
    Math.max(
      35,
      Math.ceil(
        9000/
        (pool.length*itemHeight)
      )+5
    );


  let html="";


  for(
    let r=0;
    r<rounds;
    r++
  ){

    pool.forEach(item=>{

      html+=`

        <div class="reel-item">

          ${reelVisual(item)}

        </div>

      `;

    });

  }


  return html;

}


function renderReels(){

  slotKeys.forEach(slot=>{

    const reel=
      document.getElementById(
        "reel-"+slot
      );


    if(!reel) return;


    const pool=
      getVisualPool(
        slot,
        {}
      );


    reel.innerHTML=
      createReel(pool);

    reel.style.transition="none";

    reel.style.transform=
      "translateY(0)";

  });

}


/* =====================================================
开始
===================================================== */

function startAll(){

  if(isDrawing){
    return;
  }


  try{

    currentResult=
      generateFinalResult();

  }catch(error){

    alert(error.message);

    return;

  }


  isDrawing=true;


  const context={

    style:
      currentResult.style,

    mainColor:
      currentResult.mainColor

  };


  slotKeys.forEach(slot=>{

    const reel=
      document.getElementById(
        "reel-"+slot
      );


    const pool=
      getVisualPool(
        slot,
        context
      );


    reel.innerHTML=
      createReel(pool);

    reel.style.transition="none";

    reel.style.transform=
      "translateY(0)";


    startSlot(
      slot,
      currentResult
    );

  });


  /*
    滚3秒以后，
    每1秒停一个
  */

  setTimeout(()=>{

    slotKeys.forEach(
      (slot,index)=>{

        setTimeout(()=>{

          if(
            slotState[slot] &&
            slotState[slot].running
          ){

            stopSingle(slot);

          }

        },index*1000);

      }
    );

  },3000);

}


/* =====================================================
单个滚盘
===================================================== */

function startSlot(
  slot,
  finalResult
){

  const reel=
    document.getElementById(
      "reel-"+slot
    );


  const context={

    style:
      finalResult.style,

    mainColor:
      finalResult.mainColor

  };


  const pool=
    getVisualPool(
      slot,
      context
    );


  const targetId=
    finalResult[slot];


  const targetIndex=
    Math.max(
      0,
      pool.findIndex(
        item=>item.id===targetId
      )
    );


  slotState[slot]={

    running:true,

    startTime:
      performance.now(),

    speed:720,

    pool,

    targetIndex,

    animationFrame:null

  };


  function animate(now){

    const state=
      slotState[slot];


    if(
      !state||
      !state.running
    ){

      return;

    }


    const elapsed=
      (now-state.startTime)/1000;


    const distance=
      elapsed*state.speed;


    reel.style.transform=
      `translateY(-${distance}px)`;


    state.animationFrame=
      requestAnimationFrame(
        animate
      );

  }


  slotState[slot].animationFrame=
    requestAnimationFrame(
      animate
    );

}


/* =====================================================
停止一个
===================================================== */

function stopSingle(slot){

  const state=
    slotState[slot];


  if(
    !state||
    !state.running
  ){

    return;

  }


  state.running=false;


  if(state.animationFrame){

    cancelAnimationFrame(
      state.animationFrame
    );

  }


  const reel=
    document.getElementById(
      "reel-"+slot
    );


  const elapsed=
    (
      performance.now()-
      state.startTime
    )/1000;


  const currentDistance=
    elapsed*state.speed;


  const itemHeight=90;


  const currentIndex=
    Math.floor(
      currentDistance/itemHeight
    );


  /*
    再滚8格
  */

  let finalIndex=
    currentIndex+8;


  const poolLength=
    state.pool.length;


  const remainder=
    finalIndex%poolLength;


  finalIndex+=
    (
      state.targetIndex-
      remainder+
      poolLength
    )%poolLength;


  /*
    让目标项目准确停在
    中间90px区域
  */

  const finalTranslate=
    -(
      finalIndex*itemHeight-
      itemHeight
    );


  reel.style.transition=
    "transform 1.5s cubic-bezier(.12,.7,.15,1)";


  reel.style.transform=
    `translateY(${finalTranslate}px)`;


  setTimeout(
    checkAllStopped,
    1600
  );

}


/* =====================================================
全部停止
===================================================== */

function stopAll(){

  slotKeys.forEach(slot=>{

    if(
      slotState[slot] &&
      slotState[slot].running
    ){

      stopSingle(slot);

    }

  });

}


function checkAllStopped(){

  const running=
    slotKeys.some(slot=>
      slotState[slot] &&
      slotState[slot].running
    );


  if(running){
    return;
  }


  if(!isDrawing){
    return;
  }


  isDrawing=false;

  showResult();

}


/* =====================================================
结果
===================================================== */

function showResult(){

  if(!currentResult){
    return;
  }


  const list=
    document.getElementById(
      "resultList"
    );


  const resultItems=[

    {
      slot:"style",
      title:"款式"
    },

    {
      slot:"mainColor",
      title:"线材主色"
    },

    {
      slot:"secondaryColor",
      title:"线材配色"
    },

    {
      slot:"mainButton",
      title:"主扣"
    },

    {
      slot:"subButton",
      title:"副扣"
    },

    {
      slot:"charm",
      title:"小吊饰"
    }

  ];


  list.innerHTML=
    resultItems.map(entry=>{

      const category=
        categoryMap[entry.slot];


      const item=
        getItem(
          category,
          currentResult[entry.slot]
        );


      return `

        <div class="result-row">

          ${resultVisual(item)}

          <div class="result-info">

            <div class="result-label">
              ${entry.title}
            </div>

            <div class="result-name">
              ${escapeHtml(
                item
                ?item.name
                :"暂无"
              )}
            </div>

          </div>

        </div>

      `;

    }).join("");


  document
    .getElementById(
      "resultModal"
    )
    .classList.add("show");

}


/* =====================================================
确认
===================================================== */

function confirmResult(){

  if(!currentResult){
    return;
  }


  /*
    因为现在没有订单系统，
    这里确认后直接扣库存。
  */

  const used=[

    ["styles",currentResult.style],

    [
      "mainColors",
      currentResult.mainColor
    ],

    [
      "secondaryColors",
      currentResult.secondaryColor
    ],

    [
      "buttons",
      currentResult.mainButton
    ],

    [
      "buttons",
      currentResult.subButton
    ],

    [
      "charms",
      currentResult.charm
    ]

  ];


  /*
    再检查一次库存
  */

  const countMap={};


  used.forEach(
    ([category,id])=>{

      const key=
        category+"_"+id;

      countMap[key]=
        (countMap[key]||0)+1;

    }
  );


  for(
    const key in countMap
  ){

    const split=
      key.split("_");

    const category=
      split.shift();

    const id=
      split.join("_");


    const item=
      getItem(
        category,
        id
      );


    if(
      !item ||
      Number(item.stock)<
      countMap[key]
    ){

      alert(
        `「${item?item.name:"项目"}」库存不足，无法确认。`
      );

      return;

    }

  }


  /*
    扣库存
  */

  used.forEach(
    ([category,id])=>{

      const item=
        getItem(
          category,
          id
        );


      if(item){

        item.stock=
          Math.max(
            0,
            Number(item.stock)-1
          );

      }

    }
  );


  saveData();


  document
    .getElementById(
      "resultModal"
    )
    .classList.remove("show");


  currentResult=null;


  renderReels();


  alert(
    "💗 已确认，库存已更新！"
  );

}


/* =====================================================
启动
===================================================== */

renderReels();

</script>
