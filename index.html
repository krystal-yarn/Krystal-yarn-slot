<style>

@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

:root{
  --pink:#f5a5c0;
  --pink-light:#ffe7f0;
  --pink-bg:#fff6fa;
  --cream:#fffaf3;
  --brown:#6b4c4c;
  --deep:#d96d96;
  --line:#f2c8d8;
  --shadow:0 8px 22px rgba(190,120,145,.15);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(
    180deg,
    #fff7fa 0%,
    #fffaf3 100%
  );
  color:var(--brown);

  font-family:

    "STYuanti-SC",
    "Yuanti SC",
    "Hannotate SC",

button,
input{

}

button{
  cursor:pointer;
}


/* =========================
   HEADER
========================= */

header{
  text-align:center;
  padding:25px 15px 14px;
}

.logo{
  font-size:30px;
  color:#d96d96;
  margin-bottom:5px;
}

.subtitle{
  font-size:14px;
  color:#a98691;
}


/* =========================
   NAV
========================= */

.nav{
  display:flex;
  justify-content:center;

  margin:10px auto 20px;
  padding:0 12px;

.nav button{
  border:none;
  background:#fff;
  color:#a56d7e;
  padding:10px 20px;
  border-radius:30px;

  font-size:15px;
}

.nav button.active{

  color:white;

/* =========================
   PAGE
========================= */

.page.active{

.container{

/* =========================

========================= */

  border:2px solid #f6d5e1;
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
  text-align:center;
}

.order-title{
  font-size:18px;
  margin-bottom:10px;
  color:#d96d96;
}

.order-input{
  width:min(400px,90%);
  border:2px solid #f0c7d6;
  border-radius:30px;
  padding:12px 18px;
  outline:none;
  font-size:16px;
  text-align:center;
  background:#fffafc;
}

.order-input:focus{
  border-color:#ed9fbb;
  box-shadow:0 0 0 4px #ffeaf2;
}


/* =========================
   CONTROLS
========================= */

.draw-controls{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.main-btn,
.stop-all-btn{
  border:none;
  border-radius:30px;
  padding:13px 26px;
  font-size:17px;
  box-shadow:var(--shadow);
}

.main-btn{
  background:#f39abb;
  color:white;
}

.main-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.stop-all-btn{
  background:#fff;
  color:#d96d96;
  border:2px solid #f2bfd0;
}


/* =========================
   SIX MACHINES
   永远一排
========================= */

.machine-scroll{
  width:100%;
  overflow:hidden;
}

.machine-grid{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(6,minmax(0,1fr));

  gap:clamp(4px,1vw,14px);

  align-items:start;
}

.machine{
  min-width:0;

  background:#fff;

  border:2px solid #f5d5e1;

  border-radius:20px;

  padding:clamp(5px,1vw,12px);

  box-shadow:var(--shadow);

  overflow:hidden;
}

.machine-title{
  text-align:center;

  color:#d96d96;

  font-size:
    clamp(11px,1.35vw,18px);

  margin-bottom:8px;

  white-space:nowrap;
}


/* =========================
   REEL
========================= */

.reel-window{
  position:relative;

  height:
    clamp(105px,11vw,145px);

  overflow:hidden;

  border-radius:14px;

  background:#fff8fb;

  border:2px solid #f4d5e0;
}

.reel-window::before,
.reel-window::after{
  content:"";

  position:absolute;

  left:0;
  right:0;

  height:25%;

  z-index:5;

  pointer-events:none;
}

.reel-window::before{
  top:0;

  background:
    linear-gradient(
      to bottom,
      rgba(255,248,251,.98),
      rgba(255,248,251,0)
    );
}

.reel-window::after{
  bottom:0;

  background:
    linear-gradient(
      to top,
      rgba(255,248,251,.98),
      rgba(255,248,251,0)
    );
}

.reel-track{
  position:absolute;

  top:0;
  left:0;

  width:100%;

  will-change:transform;
}

.reel-item{

  width:100%;

  height:
    clamp(105px,11vw,145px);

  display:flex;

  align-items:center;
  justify-content:center;

  padding:5px;

  text-align:center;
}

.reel-item-inner{

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  border-radius:12px;
}

.reel-item img{

  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:11px;
}

.reel-text{

  font-size:
    clamp(11px,1.2vw,17px);

  line-height:1.2;

  padding:5px;

  word-break:break-all;
}

.reel-middle{

  position:absolute;

  left:3px;
  right:3px;

  top:50%;

  height:
    clamp(105px,11vw,145px);

  transform:translateY(-50%);

  border:3px solid #f19bb9;

  border-radius:12px;

  z-index:10;

  pointer-events:none;

  box-shadow:
    0 0 0 3px rgba(255,255,255,.65);
}


/* =========================
   STOP BUTTON
========================= */

.machine-stop{

  width:100%;

  border:none;

  margin-top:8px;

  padding:8px 4px;

  border-radius:20px;

  background:#ffe5ee;

  color:#c96789;

  font-size:

}

.machine-stop:disabled{
  opacity:.4;
  cursor:not-allowed;

.delete-btn{

.stock-row{

  flex-wrap:wrap;
}

.stock-row button{

.stock-input{

  border-radius:10px;

  text-align:center;

.stock-status{

  border-radius:20px;

  color:#6b9b75;

.stock-status.out{

.photo-check{

.add-area{

  margin-bottom:15px;

.add-input{

  flex:1;

  border:1px solid #ebcbd7;

  border-radius:20px;

  padding:10px 14px;

.add-btn{

  border-radius:20px;

  padding:10px 18px;

  background:#f4a3bd;

/* =========================
   RULES
========================= */

.rules-box{

.rule-row{

.rule-row:last-child{

/* =========================

.modal{

  inset:0;

  align-items:center;

.modal.show{

}

  background:#fff7fa;

  display:flex;

  align-items:center;
  justify-content:center;

.result-visual img{

  width:100%;
  height:100%;

.result-name{

.confirm-btn{

  margin-top:18px;

  border:none;

  border-radius:30px;

  background:#f29cba;

  color:white;

  padding:13px;

/* =========================
   EMPTY
========================= */

/* =========================
   MOBILE
========================= */

  .reel-item{

    padding:3px;
  }

  .reel-text{

    font-size:9px;
  }

  .order-box{

    padding:13px;
  }

}

/* =====================================================
   DATA
===================================================== */

function clone(obj){

  return JSON.parse(
    JSON.stringify(obj)
  );

}


function createId(){

  return (
    "id_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8)
  );

}


function loadData(){

  const saved =
    localStorage.getItem(
      "krystal_slot_machine"
    );

  if(!saved){

    return clone(DEFAULT_DATA);

  }

  try{

    const data =
      JSON.parse(saved);


    const categories=[

      "styles",
      "mainColors",
      "secondaryColors",
      "mainButtons",
      "charms"

    ];


    categories.forEach(category=>{

      if(!Array.isArray(data[category])){

        data[category] =
          clone(DEFAULT_DATA[category]);

      }


      data[category].forEach(item=>{

        if(item.stock===undefined){
          item.stock=5;
        }

        if(item.image===undefined){
          item.image="";
        }

        if(item.photoOnly===undefined){
          item.photoOnly=false;
        }

      });

    });


    if(!data.rules){

      data.rules =
        clone(DEFAULT_DATA.rules);

    }


    return data;

  }catch(e){

    return clone(DEFAULT_DATA);

  }

}


let data=loadData();


function saveData(){

  localStorage.setItem(
    "krystal_slot_machine",
    JSON.stringify(data)
  );

}



/* =====================================================
   PAGE
===================================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(el=>{
      el.classList.remove("active");
    });


  document
    .querySelectorAll(".nav button")
    .forEach(el=>{
      el.classList.remove("active");
    });


  if(page==="draw"){

    document
      .getElementById("drawPage")
      .classList.add("active");


    document
      .getElementById("navDraw")
      .classList.add("active");


    renderReels();

  }else{

    document
      .getElementById("settingsPage")
      .classList.add("active");


    document
      .getElementById("navSettings")
      .classList.add("active");


    renderSettings();

  }

}

function escapeHTML(text){

  return String(text ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}



/* =====================================================
   VISUAL
===================================================== */

function visualHTML(item){

  if(item.image){

    return `
      <div class="reel-item-inner">

        <img
          src="${item.image}"
          alt=""
        >

      </div>
    `;

  }


  return `
    <div class="reel-item-inner">

      <div class="reel-text">

        ${escapeHTML(item.name)}

      </div>

    </div>
  `;

}


function resultVisualHTML(item){

  if(item.image){

    return `
      <div class="result-visual">

        <img
          src="${item.image}"
          alt=""
        >

      </div>
    `;

  }


  return `
    <div class="result-visual">

      <div class="reel-text">

        ${escapeHTML(item.name)}

      </div>

    </div>
  `;

}



/* =====================================================
   RULES
===================================================== */

function getRule(ruleObj,key){

  if(!ruleObj){
    return null;
  }


  if(
    Array.isArray(ruleObj[key]) &&
    ruleObj[key].length>0
  ){

    return ruleObj[key];

  }


  return null;

}


function getVisualPool(
  slot,
  context={}
){

  let list=[];


  if(slot==="style"){

    list=data.styles;

  }


  if(slot==="mainColor"){

    list=data.mainColors;


    const allowed =
      getRule(
        data.rules.styleMain,
        context.style
      );


    if(allowed){

      list =
        list.filter(
          x=>allowed.includes(x.id)
        );

    }

  }


  if(slot==="secondaryColor"){

    list=data.secondaryColors;


    const allowed =
      getRule(
        data.rules.mainSecondary,
        context.mainColor
      );


    if(allowed){

      list =
        list.filter(
          x=>allowed.includes(x.id)
        );

    }

  }


  if(
    slot==="mainButton" ||
    slot==="subButton"
  ){

    list=data.mainButtons;


    const allowed =
      getRule(
        data.rules.styleButtons,
        context.style
      );


    if(allowed){

      list =
        list.filter(
          x=>allowed.includes(x.id)
        );

    }

  }


  if(slot==="charm"){

    list=data.charms;


    const allowed =
      getRule(
        data.rules.styleCharms,
        context.style
      );


    if(allowed){

      list =
        list.filter(
          x=>allowed.includes(x.id)
        );

    }

  }


  return list;

}


function getAvailablePool(
  slot,
  context={}
){

  return getVisualPool(
    slot,
    context
  ).filter(
    item=>Number(item.stock)>0
  );

}



/* =====================================================
   SLOTS
===================================================== */

const SLOTS=[

  {

  },

  {

  {

  },

  },

  },

  }

];


const machineState={};

let finalResult=null;

let isRunning=false;

let currentOrder="";



/* =====================================================
   RENDER MACHINES

function renderReels(){

/* =====================================================
   SETUP MACHINE
===================================================== */

function setupMachine(key){

  const track =
    document.getElementById(
      "track_"+key
    );


  const pool =
    getVisualPool(
      key,
      {}
    );


  if(pool.length===0){

    track.innerHTML=`

      <div class="reel-item">

        <div class="reel-item-inner">

          <div class="reel-text">
            暂无内容
          </div>

        </div>

      </div>

    `;

    return;

  }


  let html="";


  /*
    多放很多项目，
    让老虎机可以长时间滚动
  */

  for(let i=0;i<80;i++){

    const item =
      pool[i%pool.length];


    html+=`

      <div class="reel-item">

        ${visualHTML(item)}

      </div>

    `;

  }


  track.innerHTML=html;


  track.style.transform=
    "translateY(0px)";


  machineState[key]={

    running:false,

    offset:0,

    timer:null

  };

}



/* =====================================================
   RANDOM
===================================================== */

function randomItem(list){

  if(
    !list ||
    list.length===0
  ){

    return null;

  }


  return list[
    Math.floor(
      Math.random()*list.length
    )
  ];

}



/* =====================================================
   FINAL RESULT
===================================================== */

function generateFinalResult(){

  const style =
    randomItem(
      getAvailablePool("style")
    );


  if(!style){

    alert(
      "目前没有可抽取的款式库存。"
    );

    return null;

  }


  const mainColor =
    randomItem(
      getAvailablePool(
        "mainColor",
        {
          style:style.id
        }
      )
    );


  if(!mainColor){

    alert(
      "目前没有符合条件的主色库存。"
    );

    return null;

  }


  const secondaryColor =
    randomItem(
      getAvailablePool(
        "secondaryColor",
        {
          mainColor:mainColor.id
        }
      )
    );


  if(!secondaryColor){

    alert(
      "目前没有符合条件的配色库存。"
    );

    return null;

  }


  const buttonPool =
    getAvailablePool(
      "mainButton",
      {
        style:style.id
      }
    );


  if(buttonPool.length===0){

    alert(
      "目前没有主扣库存。"
    );

    return null;

  }


  const mainButton =
    randomItem(buttonPool);


  const subButton =
    randomItem(buttonPool);


  const charm =
    randomItem(
      getAvailablePool(
        "charm",
        {
          style:style.id
        }
      )
    );


  if(!charm){

    alert(
      "目前没有小吊饰库存。"
    );

    return null;

  }


  return {

    style,

    mainColor,

    secondaryColor,

    mainButton,

    subButton,

    charm

  };

}



/* =====================================================
   START ALL
   不自动停止
===================================================== */

function startAll(){

  const orderInput =
    document.getElementById(
      "orderInput"
    );


  const order =
    orderInput.value.trim();


  /*
    没有订单号不能开始
  */

  if(!order){

    alert(
      "💗 请先输入订单号"
    );

    orderInput.focus();

    return;

  }


  /*
    已经在滚动
    不重复启动
  */

  if(isRunning){

    return;

  }


  /*
    先确定最终结果
    但用户看不到
  */

  const result =
    generateFinalResult();


  if(!result){

    return;

  }


  currentOrder=order;

  finalResult=result;

  isRunning=true;


  /*
    锁住开始按钮
  */

  document
    .getElementById(
      "startAllBtn"
    )
    .disabled=true;


  /*
    打开六个单独停止按钮
  */

  document
    .querySelectorAll(
      ".machine-stop"
    )
    .forEach(btn=>{

      btn.disabled=false;

    });


  /*
    六个一起无限滚动
  */

  SLOTS.forEach(slot=>{

    startSlot(
      slot.key,
      {
        style:result.style.id,

        mainColor:
          result.mainColor.id
      }
    );

  });

}



/* =====================================================
   START SLOT
   无限滚动
===================================================== */

function startSlot(
  key,
  context
){

  const track =
    document.getElementById(
      "track_"+key
    );


  const pool =
    getVisualPool(
      key,
      context
    );


  if(!pool.length){

    return;

  }


  const state =
    machineState[key];


  state.running=true;


  let position =
    state.offset || 0;


  track.style.transition="none";


  /*
    不设自动停止时间。
    只要 running=true，
    就一直滚。
  */

  function animate(){

    if(!state.running){

      return;

    }


    /*
      滚动速度
    */

    position -= 10;


    track.style.transform =
      `translateY(${position}px)`;


    state.offset=position;


    state.timer =
      requestAnimationFrame(
        animate
      );

  }


  animate();

}



/* =====================================================
   STOP SINGLE
===================================================== */

function stopSingle(key){

  const state =
    machineState[key];


  if(
    !state ||
    !state.running
  ){

    return;

  }


  const resultItem =
    finalResult[key];


  if(!resultItem){

    return;

  }


  /*
    停止无限滚动
  */

  state.running=false;


  cancelAnimationFrame(
    state.timer
  );


  const track =
    document.getElementById(
      "track_"+key
    );


  const item =
    track.parentElement
      .querySelector(
        ".reel-item"
      );


  const itemHeight =
    item.offsetHeight;


  const pool =
    getVisualPool(
      key,
      {
        style:
          finalResult.style.id,

        mainColor:
          finalResult.mainColor.id
      }
    );


  let targetIndex =
    pool.findIndex(
      item =>
        item.id === resultItem.id
    );


  if(targetIndex<0){

    targetIndex=0;

  }


  /*
    让最终项目完整进入中间框
  */

  const reelWindow =
    track.parentElement;


  const windowCenter =
    reelWindow.clientHeight/2;


  const itemCenter =
    itemHeight/2;


  const targetY =
    windowCenter -
    itemCenter -
    targetIndex*itemHeight;


  /*
    多滚几圈后再停
  */

  const extraLoops =
    itemHeight *
    pool.length *
    3;


  const finalY =
    targetY -
    extraLoops;


  track.style.transition =
    "transform 1.2s cubic-bezier(.15,.75,.25,1)";


  track.style.transform =
    `translateY(${finalY}px)`;


  state.offset=finalY;


  const stopBtn =
    document.getElementById(
      "stop_"+key
    );


  if(stopBtn){

    stopBtn.disabled=true;

  }


  setTimeout(()=>{

    checkAllStopped();

  },1250);

}



/* =====================================================
   STOP ALL
===================================================== */

function stopAll(){

  if(!isRunning){

    return;

  }


  /*
    六个一起停止
  */

  SLOTS.forEach(slot=>{

    if(
      machineState[slot.key] &&
      machineState[slot.key].running
    ){

      stopSingle(
        slot.key
      );

    }

  });

}



/* =====================================================
   CHECK ALL STOPPED
===================================================== */

function checkAllStopped(){

  const stillRunning =
    SLOTS.some(slot=>

      machineState[slot.key] &&
      machineState[slot.key].running

    );


  /*
    还有机器在滚
    就不要显示结果
  */

  if(stillRunning){

    return;

  }


  /*
    六个全部停了
  */

  isRunning=false;


  document
    .getElementById(
      "startAllBtn"
    )
    .disabled=false;


  document
    .querySelectorAll(
      ".machine-stop"
    )
    .forEach(btn=>{

      btn.disabled=true;

    });


  /*
    显示最终结果
  */

  showResult();

}

   RESULT
===================================================== */

      row.className =

  );

/* =====================================================
   CONFIRM
===================================================== */

function confirmResult(){

  if(!finalResult){

    return;

  }


  decreaseStock(
    "styles",
    finalResult.style.id
  );


  decreaseStock(
    "mainColors",
    finalResult.mainColor.id
  );


  decreaseStock(
    "secondaryColors",
    finalResult.secondaryColor.id
  );


  /*
    主扣扣一次
  */

  decreaseStock(
    "mainButtons",
    finalResult.mainButton.id
  );


  /*
    副扣再扣一次
    即使跟主扣相同也扣两次
  */

  decreaseStock(
    "mainButtons",
    finalResult.subButton.id
  );


  decreaseStock(
    "charms",
    finalResult.charm.id
  );


  saveData();


  document
    .getElementById(
      "resultModal"
    )
    .classList.remove(
      "show"
    );


  finalResult=null;


  renderReels();

}



/* =====================================================
   STOCK
===================================================== */

function decreaseStock(
  category,
  id
){

  const item =
    data[category]
      .find(
        x=>x.id===id
      );


  if(!item){

    return;

  }


  item.stock =
    Math.max(
      0,
      Number(item.stock)-1
    );

}

/* =====================================================
   ADD
===================================================== */

function addItem(category){

  const input =
    document.getElementById(
      "add_"+category
    );


  const name =
    input.value.trim();


  if(!name){

    alert(
      "请输入名称"
    );

    return;

  }


  data[category].push({

    id:createId(),

    name:name,

    image:"",

    photoOnly:false,

    stock:5

  });


  input.value="";


  saveData();


  renderSettings();

}



/* =====================================================
   DELETE
===================================================== */

function deleteItem(
  category,
  id
){

  const item =
    data[category]
      .find(
        x=>x.id===id
      );


  if(!item){

    return;

  }


  if(
    !confirm(
      `确定要删除「${item.name}」吗？`
    )
  ){

    return;

  }


  data[category] =
    data[category]
      .filter(
        x=>x.id!==id
      );


  /*
    从规则中一起删除
  */

  Object.keys(
    data.rules
  ).forEach(
    ruleGroup=>{

      Object.keys(
        data.rules[ruleGroup]
      ).forEach(
        key=>{

          data.rules[ruleGroup][key] =
            data.rules[ruleGroup][key]
              .filter(
                x=>x!==id
              );

        }
      );

    }
  );


  saveData();


  renderSettings();

}



/* =====================================================
   PHOTO
===================================================== */

function uploadPhoto(
  category,
  id
){

  const input =
    document.createElement(
      "input"
    );


  input.type="file";

  input.accept="image/*";


  input.onchange=function(){

    const file =
      input.files[0];


    if(!file){

      return;

    }


    const reader =
      new FileReader();


    reader.onload=function(e){

      const item =
        data[category]
          .find(
            x=>x.id===id
          );


      if(!item){

        return;

      }


      item.image =
        e.target.result;


      saveData();


      renderSettings();

    };


    reader.readAsDataURL(
      file
    );

  };


  input.click();

}



function removePhoto(
  category,
  id
){

  const item =
    data[category]
      .find(
        x=>x.id===id
      );


  if(!item){

    return;

  }


  item.image="";

  item.photoOnly=false;


  saveData();


  renderSettings();

}



function togglePhotoOnly(
  category,
  id,
  checked
){

  const item =
    data[category]
      .find(
        x=>x.id===id
      );


  if(!item){

    return;

  }


  item.photoOnly =
    checked;


  saveData();

}



/* =====================================================
   STOCK SETTINGS
===================================================== */

function changeStock(
  category,
  id,
  amount
){

  const item =
    data[category]
      .find(
        x=>x.id===id
      );


  if(!item){

    return;

  }


  item.stock =
    Math.max(
      0,
      Number(item.stock||0)
      +amount
    );


  saveData();


  renderSettings();

}



function setStock(
  category,
  id,
  value
){

  const item =
    data[category]
      .find(
        x=>x.id===id
      );


  if(!item){

    return;

  }


  item.stock =
    Math.max(
      0,
      parseInt(value)||0
    );


  saveData();


  renderSettings();

}

          id="rule_styleMain"
          class="rule-options"
        ></div>

      </div>


      <div class="rule-row">

        <div class="rule-title">
          款式 → 扣子
        </div>

        <div
          id="rule_styleButtons"
          class="rule-options"
        ></div>

      </div>


      <div class="rule-row">

        <div class="rule-title">
          款式 → 吊饰
        </div>

        <div
          id="rule_styleCharms"
          class="rule-options"
        ></div>

      </div>


      <div class="rule-row">

        <div class="rule-title">
          主色 → 配色
        </div>

        <div
          id="rule_mainSecondary"
          class="rule-options"
        ></div>

      </div>


    </div>


    <p
      style="
        font-size:12px;
        color:#a78994;
        margin:12px 0 0;
      "
    >

      💡 不勾选任何选项
      = 不限制，可以随机抽取全部。

    </p>

  `;


  container.appendChild(card);


  renderRuleGroup(

    "rule_styleMain",

    data.styles,

    data.mainColors,

    data.rules.styleMain

  );


  renderRuleGroup(

    "rule_styleButtons",

    data.styles,

    data.mainButtons,

    data.rules.styleButtons

  );


  renderRuleGroup(

    "rule_styleCharms",

    data.styles,

    data.charms,

    data.rules.styleCharms

  );


  renderRuleGroup(

    "rule_mainSecondary",

    data.mainColors,

    data.secondaryColors,

    data.rules.mainSecondary

  );

}



/* =====================================================
   RULE GROUP
===================================================== */

function renderRuleGroup(
  elementId,
  parents,
  children,
  ruleObject
){

  const box =
    document.getElementById(
      elementId
    );


  box.innerHTML="";


  parents.forEach(
    parent=>{

      const group =
        document.createElement(
          "div"
        );


      group.style.width="100%";

      group.style.marginBottom="8px";


      const current =
        ruleObject[parent.id] || [];


      let html=`

        <div
          style="
            font-size:12px;
            color:#a56d7e;
            margin-bottom:5px;
          "
        >

          ${escapeHTML(
            parent.name
          )}

        </div>


        <div
          style="
            display:flex;
            flex-wrap:wrap;
            gap:5px;
          "
        >

      `;


      children.forEach(
        child=>{

          const checked =
            current.includes(
              child.id
            );


          html+=`

            <label
              class="rule-option"
            >

              <input
                type="checkbox"

                ${
                  checked
                  ?
                  "checked"
                  :
                  ""
                }

                onchange="
                  toggleRule(
                    '${elementId}',
                    '${parent.id}',
                    '${child.id}',
                    this.checked
                  )
                "
              >

              ${escapeHTML(
                child.name
              )}

            </label>

          `;

        }
      );


      html+=`
        </div>
      `;


      group.innerHTML=html;


      box.appendChild(
        group
      );

    }
  );

}



/* =====================================================
   TOGGLE RULE
===================================================== */

function toggleRule(
  elementId,
  parentId,
  childId,
  checked
){

  let ruleName="";


  if(
    elementId==="rule_styleMain"
  ){

    ruleName="styleMain";

  }


  if(
    elementId==="rule_styleButtons"
  ){

    ruleName="styleButtons";

  }


  if(
    elementId==="rule_styleCharms"
  ){

    ruleName="styleCharms";

  }


  if(
    elementId==="rule_mainSecondary"
  ){

    ruleName="mainSecondary";

  }


  if(!ruleName){

    return;

  }


  if(
    !data.rules[ruleName][parentId]
  ){

    data.rules[ruleName][parentId]=[];

  }


  let arr =
    data.rules[ruleName][parentId];


  if(checked){

    if(
      !arr.includes(childId)
    ){

      arr.push(childId);

    }

  }else{

    arr =
      arr.filter(
        x=>x!==childId
      );


    data.rules[ruleName][parentId]
      =arr;

  }


  saveData();

}
