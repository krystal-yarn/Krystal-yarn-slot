<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krystal 研究室的老虎机</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
  background:#fff8fb;
  color:#684f59;
}

button{
  font-family:inherit;
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,248,251,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #f5dfe8;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:20px;
  font-weight:800;
  color:#d9789c;
}

.nav-buttons{
  display:flex;
  gap:8px;
}

.nav-buttons button{
  border:0;
  border-radius:20px;
  padding:9px 16px;
  background:#fff;
  color:#a9607c;
  box-shadow:0 3px 12px rgba(190,120,150,.12);
}

.nav-buttons button.active{
  background:#f39abb;
  color:white;
}

.page{
  display:none;
  max-width:1200px;
  margin:auto;
  padding:25px 18px 50px;
}

.page.active{
  display:block;
}

.hero{
  text-align:center;
  margin:10px 0 25px;
}

.hero h1{
  margin:0 0 8px;
  font-size:32px;
  color:#d66f96;
}

.hero p{
  margin:0;
  color:#aa8795;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin:20px 0 25px;
}

.main-btn{
  border:0;
  padding:12px 24px;
  border-radius:25px;
  font-size:15px;
  font-weight:700;
  box-shadow:0 5px 15px rgba(200,120,150,.18);
}

.start-btn{
  background:#f28fb4;
  color:white;
}

.stop-all-btn{
  background:#fff;
  color:#d96e91;
  border:1px solid #f0bfd0;
}

.reset-btn{
  background:#fff;
  color:#99727f;
  border:1px solid #ead9df;
}

/* =========================
   六个老虎机
========================= */

.slots-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
}

.slot-card{
  background:#fff;
  border:1px solid #f2dce5;
  border-radius:22px;
  padding:12px;
  box-shadow:0 7px 20px rgba(200,130,155,.10);
  min-width:0;
}

.slot-title{
  text-align:center;
  font-weight:800;
  color:#a95f7c;
  margin-bottom:10px;
  font-size:15px;
}

.reel-window{
  height:150px;
  overflow:hidden;
  position:relative;
  border-radius:16px;
  background:#fff9fb;
  border:2px solid #f5dbe5;
}

.reel-window:before,
.reel-window:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:35px;
  z-index:5;
  pointer-events:none;
}

.reel-window:before{
  top:0;
  background:linear-gradient(to bottom,rgba(255,249,251,.95),transparent);
}

.reel-window:after{
  bottom:0;
  background:linear-gradient(to top,rgba(255,249,251,.95),transparent);
}

.reel{
  position:absolute;
  width:100%;
  top:0;
  left:0;
  will-change:transform;
}

.reel-item{
  height:150px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px;
}

.reel-item img{
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:18px;
  border:3px solid white;
  box-shadow:0 3px 10px rgba(150,100,120,.12);
}

.reel-item .item-name{
  font-size:13px;
  font-weight:700;
  text-align:center;
  word-break:break-word;
}

.stop-one{
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:17px;
  padding:8px 5px;
  background:#fff0f5;
  color:#cc6c8d;
  font-size:13px;
  font-weight:700;
}

.stop-one:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.slot-status{
  text-align:center;
  margin-top:6px;
  min-height:18px;
  font-size:11px;
  color:#b797a3;
}

/* =========================
   最终结果
========================= */

.final-result{
  display:none;
  margin:30px auto 0;
  padding:20px;
  background:#fff;
  border:2px dashed #efb5ca;
  border-radius:24px;
  max-width:1000px;
}

.final-result.show{
  display:block;
}

.final-result h2{
  text-align:center;
  color:#d66f96;
  margin-top:0;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.result-item{
  text-align:center;
  background:#fff8fb;
  border-radius:15px;
  padding:10px;
}

.result-item .label{
  font-size:11px;
  color:#b28b98;
}

.result-item .value{
  margin-top:4px;
  font-size:13px;
  font-weight:800;
  color:#8f5b70;
}

/* =========================
   设置页面
========================= */

.settings-title{
  text-align:center;
  color:#d66f96;
  margin-bottom:8px;
}

.settings-desc{
  text-align:center;
  color:#aa8795;
  margin-bottom:25px;
}

.settings-section{
  background:#fff;
  border:1px solid #f1dce5;
  border-radius:22px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 15px rgba(200,130,155,.07);
}

.settings-section h2{
  margin-top:0;
  color:#a85e7c;
}

.add-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}

.add-row input[type="text"]{
  flex:1;
  min-width:160px;
  border:1px solid #ecd7df;
  border-radius:15px;
  padding:10px 13px;
  outline:none;
}

.upload-label{
  background:#fff0f5;
  color:#c96d8d;
  border-radius:15px;
  padding:10px 14px;
  cursor:pointer;
}

.upload-label input{
  display:none;
}

.add-btn{
  border:0;
  border-radius:15px;
  padding:10px 18px;
  background:#f292b6;
  color:white;
  font-weight:700;
}

.manage-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;
}

.manage-card{
  background:#fff8fb;
  border-radius:18px;
  padding:12px;
  text-align:center;
  border:1px solid #f2dce5;
}

.manage-card img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:15px;
  display:block;
  margin:0 auto 8px;
}

.manage-card-name{
  font-weight:700;
  font-size:13px;
  margin-bottom:8px;
}

.delete-btn{
  border:0;
  border-radius:12px;
  padding:6px 12px;
  background:#ffe4ec;
  color:#c86b8c;
  font-size:12px;
}

/* =========================
   限制设置
========================= */

.rule-select{
  width:100%;
  max-width:400px;
  padding:11px;
  border:1px solid #ead7df;
  border-radius:15px;
  background:white;
  margin-bottom:15px;
}

.rule-box{
  background:#fff8fb;
  padding:15px;
  border-radius:18px;
  margin-bottom:15px;
}

.rule-box h3{
  margin-top:0;
  color:#a85e7c;
}

.checkbox-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:8px;
}

.check-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px;
  border-radius:12px;
  background:white;
  border:1px solid #f0dfe5;
  font-size:13px;
}

.save-rule-btn{
  border:0;
  background:#f292b6;
  color:white;
  padding:10px 18px;
  border-radius:15px;
  font-weight:700;
}

.clear-rule-btn{
  border:0;
  background:#fff;
  border:1px solid #efd5df;
  color:#a77989;
  padding:10px 18px;
  border-radius:15px;
}

/* =========================
   提示
========================= */

.notice{
  background:#fff3f7;
  border-radius:15px;
  padding:12px 15px;
  color:#9d7180;
  font-size:13px;
  margin-bottom:15px;
}

/* =========================
   响应式
========================= */

@media(max-width:900px){
  .slots-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .result-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .header-inner{
    flex-direction:column;
  }

  .slots-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .result-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:25px;
  }

  .reel-window{
    height:135px;
  }

  .reel-item{
    height:135px;
  }

  .reel-item img{
    width:65px;
    height:65px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">🧶 Krystal 的毛线研究室</div>

    <div class="nav-buttons">
      <button id="drawNav" class="active" onclick="showPage('draw')">
        🎰 开始抽取
      </button>

      <button id="settingsNav" onclick="showPage('settings')">
        ⚙️ 页面设置
      </button>
    </div>
  </div>
</header>


<!-- =========================
     抽取页面
========================= -->

<main id="drawPage" class="page active">

  <div class="hero">
    <h1>🎰 Krystal 研究室的老虎机</h1>
    <p>抽一个属于你的甜甜配色吧 ♡</p>
  </div>

  <div class="controls">

    <button class="main-btn start-btn" onclick="startAll()">
      🎰 全部开始
    </button>

    <button class="main-btn stop-all-btn" onclick="stopAll()">
      🛑 全部停止
    </button>

    <button class="main-btn reset-btn" onclick="resetAll()">
      🔄 重置
    </button>

  </div>

  <div class="slots-grid" id="slotsGrid"></div>

  <div class="final-result" id="finalResult">

    <h2>✨ 今日抽取结果 ✨</h2>

    <div class="result-grid" id="resultGrid"></div>

  </div>

</main>


<!-- =========================
     设置页面
========================= -->

<main id="settingsPage" class="page">

  <h1 class="settings-title">⚙️ 页面设置</h1>

  <p class="settings-desc">
    所有材料、图片和搭配限制，都可以直接在这里管理
  </p>

  <div class="notice">
    💡 这里的设置会自动保存在浏览器里。以后新增颜色、扣子、吊饰时，不需要修改代码。
  </div>


  <!-- 款式 -->

  <section class="settings-section">

    <h2>👜 1. 款式管理</h2>

    <div class="add-row">

      <input
        type="text"
        id="styleName"
        placeholder="例如：小云朵包"
      >

      <label class="upload-label">
        📷 上传图片
        <input
          type="file"
          id="styleImage"
          accept="image/*"
        >
      </label>

      <button class="add-btn" onclick="addItem('styles')">
        ＋ 添加款式
      </button>

    </div>

    <div class="manage-list" id="stylesList"></div>

  </section>


  <!-- 主色 -->

  <section class="settings-section">

    <h2>🎨 2. 线材主色</h2>

    <div class="add-row">

      <input
        type="text"
        id="mainColorName"
        placeholder="例如：浅粉色"
      >

      <label class="upload-label">
        📷 上传图片
        <input
          type="file"
          id="mainColorImage"
          accept="image/*"
        >
      </label>

      <button class="add-btn" onclick="addItem('mainColors')">
        ＋ 添加主色
      </button>

    </div>

    <div class="manage-list" id="mainColorsList"></div>

  </section>


  <!-- 配色 -->

  <section class="settings-section">

    <h2>🌈 3. 线材配色</h2>

    <div class="add-row">

      <input
        type="text"
        id="secondaryColorName"
        placeholder="例如：米白色"
      >

      <label class="upload-label">
        📷 上传图片
        <input
          type="file"
          id="secondaryColorImage"
          accept="image/*"
        >
      </label>

      <button class="add-btn" onclick="addItem('secondaryColors')">
        ＋ 添加配色
      </button>

    </div>

    <div class="manage-list" id="secondaryColorsList"></div>

  </section>


  <!-- 扣子 -->

  <section class="settings-section">

    <h2>🔘 4. 扣子</h2>

    <div class="add-row">

      <input
        type="text"
        id="buttonName"
        placeholder="例如：草莓粉扣"
      >

      <label class="upload-label">
        📷 上传图片
        <input
          type="file"
          id="buttonImage"
          accept="image/*"
        >
      </label>

      <button class="add-btn" onclick="addItem('buttons')">
        ＋ 添加扣子
      </button>

    </div>

    <div class="manage-list" id="buttonsList"></div>

  </section>


  <!-- 吊饰 -->

  <section class="settings-section">

    <h2>🍓 5. 小吊饰</h2>

    <div class="add-row">

      <input
        type="text"
        id="charmName"
        placeholder="例如：草莓吊饰"
      >

      <label class="upload-label">
        📷 上传图片
        <input
          type="file"
          id="charmImage"
          accept="image/*"
        >
      </label>

      <button class="add-btn" onclick="addItem('charms')">
        ＋ 添加吊饰
      </button>

    </div>

    <div class="manage-list" id="charmsList"></div>

  </section>


  <!-- 款式限制 -->

  <section class="settings-section">

    <h2>🔗 6. 款式搭配限制</h2>

    <p>选择一个款式，然后决定它允许出现什么。</p>

    <select
      id="styleRuleSelect"
      class="rule-select"
      onchange="loadStyleRule()"
    >
      <option value="">请选择款式</option>
    </select>

    <div id="styleRuleArea"></div>

  </section>


  <!-- 主色限制 -->

  <section class="settings-section">

    <h2>🎨 7. 主色 → 配色限制</h2>

    <p>例如：金黄色只允许搭配米白、橘黄色。</p>

    <select
      id="colorRuleSelect"
      class="rule-select"
      onchange="loadColorRule()"
    >
      <option value="">请选择主色</option>
    </select>

    <div id="colorRuleArea"></div>

  </section>

</main>


<script>

/* =====================================================
   默认数据
===================================================== */

const DEFAULT_DATA = {

  styles: [
    {
      id:"style_default_1",
      name:"基础款",
      image:""
    }
  ],

  mainColors:[
    {id:"main_1",name:"酒红色",image:""},
    {id:"main_2",name:"米白色",image:""},
    {id:"main_3",name:"牛油果绿",image:""},
    {id:"main_4",name:"浅灰色",image:""},
    {id:"main_5",name:"金黄色",image:""},
    {id:"main_6",name:"大红色",image:""},
    {id:"main_7",name:"橘黄色",image:""},
    {id:"main_8",name:"玫红色",image:""},
    {id:"main_9",name:"深粉色",image:""},
    {id:"main_10",name:"浅粉色",image:""},
    {id:"main_11",name:"浅紫色",image:""},
    {id:"main_12",name:"米黄色",image:""}
  ],

  secondaryColors:[
    {id:"secondary_1",name:"米白色",image:""},
    {id:"secondary_2",name:"浅粉色",image:""},
    {id:"secondary_3",name:"米黄色",image:""},
    {id:"secondary_4",name:"浅紫色",image:""},
    {id:"secondary_5",name:"橘黄色",image:""},
    {id:"secondary_6",name:"浅灰色",image:""}
  ],

  buttons:[
    {id:"button_1",name:"红色",image:""},
    {id:"button_2",name:"白色",image:""},
    {id:"button_3",name:"紫色",image:""},
    {id:"button_4",name:"黄色",image:""},
    {id:"button_5",name:"橘色",image:""},
    {id:"button_6",name:"棕色",image:""}
  ],

  charms:[
    {id:"charm_1",name:"草莓",image:""},
    {id:"charm_2",name:"爱心",image:""},
    {id:"charm_3",name:"蝴蝶结",image:""},
    {id:"charm_4",name:"小花",image:""}
  ],

  styleRules:{},
  colorRules:{}

};


/* =====================================================
   数据读取 / 保存
===================================================== */

function loadData(){

  const saved = localStorage.getItem("krystalSlotData");

  if(!saved){

    localStorage.setItem(
      "krystalSlotData",
      JSON.stringify(DEFAULT_DATA)
    );

    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }

  try{

    const data = JSON.parse(saved);

    return {
      styles:data.styles || [],
      mainColors:data.mainColors || [],
      secondaryColors:data.secondaryColors || [],
      buttons:data.buttons || [],
      charms:data.charms || [],
      styleRules:data.styleRules || {},
      colorRules:data.colorRules || {}
    };

  }catch(e){

    return JSON.parse(JSON.stringify(DEFAULT_DATA));

  }
}


let data = loadData();


function saveData(){

  localStorage.setItem(
    "krystalSlotData",
    JSON.stringify(data)
  );

}


/* =====================================================
   页面切换
===================================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  document
    .querySelectorAll(".nav-buttons button")
    .forEach(b => b.classList.remove("active"));

  if(page === "draw"){

    document
      .getElementById("drawPage")
      .classList.add("active");

    document
      .getElementById("drawNav")
      .classList.add("active");

  }else{

    document
      .getElementById("settingsPage")
      .classList.add("active");

    document
      .getElementById("settingsNav")
      .classList.add("active");

    renderSettings();

  }

}


/* =====================================================
   图片读取
===================================================== */

function getFile(inputId){

  const input = document.getElementById(inputId);

  if(!input || !input.files || !input.files[0]){
    return Promise.resolve("");
  }

  return new Promise(resolve => {

    const reader = new FileReader();

    reader.onload = e => resolve(e.target.result);

    reader.readAsDataURL(input.files[0]);

  });

}


/* =====================================================
   新增项目
===================================================== */

async function addItem(type){

  const config = {

    styles:{
      name:"styleName",
      image:"styleImage"
    },

    mainColors:{
      name:"mainColorName",
      image:"mainColorImage"
    },

    secondaryColors:{
      name:"secondaryColorName",
      image:"secondaryColorImage"
    },

    buttons:{
      name:"buttonName",
      image:"buttonImage"
    },

    charms:{
      name:"charmName",
      image:"charmImage"
    }

  };

  const c = config[type];

  const name =
    document.getElementById(c.name).value.trim();

  if(!name){

    alert("请先输入名称 ♡");

    return;

  }

  const image =
    await getFile(c.image);

  data[type].push({

    id:
      type +
      "_" +
      Date.now(),

    name:name,

    image:image

  });

  saveData();

  document.getElementById(c.name).value = "";

  document.getElementById(c.image).value = "";

  renderSettings();

  buildSlots();

}


/* =====================================================
   删除项目
===================================================== */

function deleteItem(type,id){

  if(!confirm("确定要删除这个项目吗？")){
    return;
  }

  data[type] =
    data[type].filter(item => item.id !== id);

  saveData();

  renderSettings();

  buildSlots();

}


/* =====================================================
   设置页面渲染
===================================================== */

function renderSettings(){

  renderManageList(
    "styles",
    "stylesList"
  );

  renderManageList(
    "mainColors",
    "mainColorsList"
  );

  renderManageList(
    "secondaryColors",
    "secondaryColorsList"
  );

  renderManageList(
    "buttons",
    "buttonsList"
  );

  renderManageList(
    "charms",
    "charmsList"
  );

  renderStyleRuleSelect();

  renderColorRuleSelect();

}


/* =====================================================
   管理卡片
===================================================== */

function renderManageList(type,elementId){

  const container =
    document.getElementById(elementId);

  container.innerHTML = "";

  data[type].forEach(item => {

    const card =
      document.createElement("div");

    card.className = "manage-card";

    card.innerHTML = `

      ${
        item.image
        ?
        `<img src="${item.image}">`
        :
        `<div style="
          width:90px;
          height:90px;
          margin:0 auto 8px;
          border-radius:15px;
          background:#ffeef4;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:30px;
        ">🧶</div>`
      }

      <div class="manage-card-name">
        ${escapeHtml(item.name)}
      </div>

      <button
        class="delete-btn"
        onclick="deleteItem('${type}','${item.id}')"
      >
        删除
      </button>

    `;

    container.appendChild(card);

  });

}


/* =====================================================
   HTML 安全处理
===================================================== */

function escapeHtml(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =====================================================
   六个老虎机
===================================================== */

const SLOT_CONFIG = [

  {
    key:"style",
    title:"👜 款式"
  },

  {
    key:"mainColor",
    title:"🎨 线材主色"
  },

  {
    key:"secondaryColor",
    title:"🌈 线材配色"
  },

  {
    key:"button1",
    title:"🔘 扣子 1"
  },

  {
    key:"button2",
    title:"🔘 扣子 2"
  },

  {
    key:"charm",
    title:"🍓 小吊饰"
  }

];


const slotStates = {};

let sessionId = 0;


/* =====================================================
   建立老虎机
===================================================== */

function buildSlots(){

  const grid =
    document.getElementById("slotsGrid");

  grid.innerHTML = "";

  SLOT_CONFIG.forEach(slot => {

    const card =
      document.createElement("div");

    card.className = "slot-card";

    card.innerHTML = `

      <div class="slot-title">
        ${slot.title}
      </div>

      <div
        class="reel-window"
        id="window-${slot.key}"
      >
        <div
          class="reel"
          id="reel-${slot.key}"
        ></div>
      </div>

      <button
        class="stop-one"
        id="stop-${slot.key}"
        onclick="stopOne('${slot.key}')"
      >
        🛑 停止
      </button>

      <div
        class="slot-status"
        id="status-${slot.key}"
      >
        准备好了
      </div>

    `;

    grid.appendChild(card);

  });

  prepareIdleReels();

}


/* =====================================================
   初始显示
===================================================== */

function prepareIdleReels(){

  const pools = {

    style:data.styles,

    mainColor:data.mainColors,

    secondaryColor:data.secondaryColors,

    button1:data.buttons,

    button2:data.buttons,

    charm:data.charms

  };

  SLOT_CONFIG.forEach(slot => {

    const reel =
      document.getElementById(
        "reel-" + slot.key
      );

    if(!reel){
      return;
    }

    const items =
      pools[slot.key] || [];

    reel.innerHTML = "";

    if(items.length === 0){

      reel.innerHTML = `

        <div class="reel-item">

          <div style="font-size:30px">🧶</div>

          <div class="item-name">
            请先设置
          </div>

        </div>

      `;

      return;

    }

    const displayItems =
      [...items,...items,...items];

    displayItems.forEach(item => {

      reel.appendChild(
        createReelItem(item)
      );

    });

    reel.style.transform =
      "translateY(-150px)";

  });

}


/* =====================================================
   建立老虎机项目
===================================================== */

function createReelItem(item){

  const div =
    document.createElement("div");

  div.className = "reel-item";

  div.innerHTML = `

    ${
      item.image
      ?
      `<img src="${item.image}">`
      :
      `<div style="
        width:82px;
        height:82px;
        border-radius:18px;
        background:#ffeef4;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:30px;
      ">🧶</div>`
    }

    <div class="item-name">
      ${escapeHtml(item.name)}
    </div>

  `;

  return div;

}


/* =====================================================
   获取允许项目
===================================================== */

function getAllowed(type, context){

  let pool = [];

  if(type === "style"){
    pool = [...data.styles];
  }

  if(type === "mainColor"){

    pool = [...data.mainColors];

    const rule =
      data.styleRules[context.style];

    if(
      rule &&
      Array.isArray(rule.mainColors)
    ){

      pool =
        pool.filter(x =>
          rule.mainColors.includes(x.id)
        );

    }

  }

  if(type === "secondaryColor"){

    pool = [...data.secondaryColors];

    const rule =
      data.colorRules[context.mainColor];

    if(
      Array.isArray(rule)
    ){

      pool =
        pool.filter(x =>
          rule.includes(x.id)
        );

    }

  }

  if(
    type === "button1" ||
    type === "button2"
  ){

    pool = [...data.buttons];

    const rule =
      data.styleRules[context.style];

    if(
      rule &&
      Array.isArray(rule.buttons)
    ){

      pool =
        pool.filter(x =>
          rule.buttons.includes(x.id)
        );

    }

  }

  if(type === "charm"){

    pool = [...data.charms];

    const rule =
      data.styleRules[context.style];

    if(
      rule &&
      Array.isArray(rule.charms)
    ){

      pool =
        pool.filter(x =>
          rule.charms.includes(x.id)
        );

    }

  }

  return pool;

}


/* =====================================================
   随机项目
===================================================== */

function randomItem(pool){

  if(!pool || pool.length === 0){
    return null;
  }

  return pool[
    Math.floor(
      Math.random() * pool.length
    )
  ];

}


/* =====================================================
   预先决定最终结果
===================================================== */

function generateFinalResults(){

  const result = {};

  /* 先决定款式 */

  const styles =
    getAllowed("style",result);

  result.style =
    randomItem(styles);


  /* 主色 */

  const mains =
    getAllowed(
      "mainColor",
      {
        style:result.style
          ? result.style.id
          : null
      }
    );

  result.mainColor =
    randomItem(mains);


  /* 配色 */

  const secondaries =
    getAllowed(
      "secondaryColor",
      {
        mainColor:
          result.mainColor
          ? result.mainColor.id
          : null
      }
    );

  result.secondaryColor =
    randomItem(secondaries);


  /* 扣子 */

  const buttonContext = {

    style:
      result.style
      ? result.style.id
      : null

  };

  result.button1 =
    randomItem(
      getAllowed(
        "button1",
        buttonContext
      )
    );

  result.button2 =
    randomItem(
      getAllowed(
        "button2",
        buttonContext
      )
    );


  /* 吊饰 */

  result.charm =
    randomItem(
      getAllowed(
        "charm",
        buttonContext
      )
    );


  return result;

}


/* =====================================================
   开始全部
===================================================== */

function startAll(){

  sessionId++;

  const thisSession =
    sessionId;

  document
    .getElementById("finalResult")
    .classList.remove("show");

  const finalResults =
    generateFinalResults();

  /* 保存这次抽取的最终结果 */

  window.currentFinalResults =
    finalResults;


  SLOT_CONFIG.forEach(slot => {

    startSlot(
      slot.key,
      finalResults[slot.key],
      thisSession
    );

  });

  /* 最长滚动约 9 秒 */

  setTimeout(() => {

    if(thisSession !== sessionId){
      return;
    }

    stopAll();

  },9000);

}


/* =====================================================
   开始单个老虎机
===================================================== */

function startSlot(key,target,session){

  const reel =
    document.getElementById(
      "reel-" + key
    );

  const stopButton =
    document.getElementById(
      "stop-" + key
    );

  const status =
    document.getElementById(
      "status-" + key
    );

  if(!reel){
    return;
  }

  if(!target){

    status.textContent =
      "没有可抽取项目";

    return;

  }

  const slotItems =
    getSlotPool(key);

  if(slotItems.length === 0){
    return;
  }

  const targetIndex =
    slotItems.findIndex(
      x => x.id === target.id
    );

  const repeated =
    30;

  reel.innerHTML = "";

  for(let i=0;i<repeated;i++){

    slotItems.forEach(item => {

      reel.appendChild(
        createReelItem(item)
      );

    });

  }

  const itemHeight =
    getCurrentItemHeight();

  const cycleHeight =
    slotItems.length *
    itemHeight;

  const state = {

    key:key,

    target:target,

    targetIndex:
      targetIndex < 0
      ? 0
      : targetIndex,

    items:slotItems,

    itemHeight:itemHeight,

    cycleHeight:cycleHeight,

    distance:0,

    startTime:performance.now(),

    running:true,

    stopped:false,

    animationId:null,

    session:session

  };

  slotStates[key] =
    state;

  stopButton.disabled =
    false;

  status.textContent =
    "🎰 滚动中…";

  spinAnimation(state);

}


/* =====================================================
   实际上下滚动动画
===================================================== */

function spinAnimation(state){

  if(!state.running){
    return;
  }

  if(state.session !== sessionId){
    return;
  }

  const now =
    performance.now();

  const elapsed =
    now - state.startTime;

  /* 滚动速度 */

  const speed =
    850;

  state.distance =
    elapsed / 1000 * speed;

  state.distance =
    state.distance %
    state.cycleHeight;

  state.reel =
    document.getElementById(
      "reel-" + state.key
    );

  if(!state.reel){
    return;
  }

  state.reel.style.transform =
    `translateY(-${state.distance}px)`;

  state.animationId =
    requestAnimationFrame(
      () => spinAnimation(state)
    );

}


/* =====================================================
   单独停止
===================================================== */

function stopOne(key){

  const state =
    slotStates[key];

  if(!state || !state.running){
    return;
  }

  settleSlot(state);

}


/* =====================================================
   停止全部
===================================================== */

function stopAll(){

  SLOT_CONFIG.forEach(slot => {

    const state =
      slotStates[slot.key];

    if(
      state &&
      state.running
    ){

      settleSlot(state);

    }

  });

}


/* =====================================================
   停到最终结果
===================================================== */

function settleSlot(state){

  if(state.stopped){
    return;
  }

  state.running =
    false;

  state.stopped =
    true;

  cancelAnimationFrame(
    state.animationId
  );

  const reel =
    document.getElementById(
      "reel-" + state.key
    );

  const stopButton =
    document.getElementById(
      "stop-" + state.key
    );

  const status =
    document.getElementById(
      "status-" + state.key
    );

  if(!reel){
    return;
  }

  const itemHeight =
    getCurrentItemHeight();

  const itemCount =
    state.items.length;

  const cycleHeight =
    itemCount *
    itemHeight;

  const currentDistance =
    state.distance;

  /*
     找一个在当前滚动位置之后的目标。
     所以不会突然倒转。
  */

  const currentCycle =
    Math.floor(
      currentDistance /
      cycleHeight
    );

  const targetDistance =
    (
      currentCycle +
      3
    ) *
    cycleHeight
    +
    state.targetIndex *
    itemHeight;


  reel.style.transition =
    "transform .9s cubic-bezier(.12,.72,.2,1)";

  reel.style.transform =
    `translateY(-${targetDistance}px)`;


  stopButton.disabled =
    true;

  status.textContent =
    "✨ 已停止";


  setTimeout(() => {

    reel.style.transition =
      "";

    checkAllStopped();

  },950);

}


/* =====================================================
   获取老虎机高度
===================================================== */

function getCurrentItemHeight(){

  const item =
    document.querySelector(
      ".reel-item"
    );

  if(!item){
    return 150;
  }

  return item.getBoundingClientRect().height;

}


/* =====================================================
   获取当前类别池
===================================================== */

function getSlotPool(key){

  if(key === "style"){
    return data.styles;
  }

  if(key === "mainColor"){
    return data.mainColors;
  }

  if(key === "secondaryColor"){
    return data.secondaryColors;
  }

  if(
    key === "button1" ||
    key === "button2"
  ){
    return data.buttons;
  }

  if(key === "charm"){
    return data.charms;
  }

  return [];

}


/* =====================================================
   检查是否全部停止
===================================================== */

function checkAllStopped(){

  const allStopped =
    SLOT_CONFIG.every(slot => {

      const state =
        slotStates[slot.key];

      return state &&
             state.stopped;

    });

  if(!allStopped){
    return;
  }

  showFinalResult();

}


/* =====================================================
   显示最终结果
===================================================== */

function showFinalResult(){

  const result =
    window.currentFinalResults;

  if(!result){
    return;
  }

  const container =
    document.getElementById(
      "resultGrid"
    );

  container.innerHTML = "";

  const labels = {

    style:"款式",

    mainColor:"线材主色",

    secondaryColor:"线材配色",

    button1:"扣子 1",

    button2:"扣子 2",

    charm:"小吊饰"

  };


  SLOT_CONFIG.forEach(slot => {

    const item =
      result[slot.key];

    const div =
      document.createElement("div");

    div.className =
      "result-item";

    div.innerHTML = `

      <div class="label">
        ${labels[slot.key]}
      </div>

      <div class="value">
        ${
          item
          ? escapeHtml(item.name)
          : "未设置"
        }
      </div>

    `;

    container.appendChild(div);

  });


  document
    .getElementById("finalResult")
    .classList.add("show");

}


/* =====================================================
   重置
===================================================== */

function resetAll(){

  sessionId++;

  SLOT_CONFIG.forEach(slot => {

    const state =
      slotStates[slot.key];

    if(state){

      state.running = false;
      state.stopped = true;

      cancelAnimationFrame(
        state.animationId
      );

    }

    const button =
      document.getElementById(
        "stop-" + slot.key
      );

    const status =
      document.getElementById(
        "status-" + slot.key
      );

    if(button){
      button.disabled = false;
    }

    if(status){
      status.textContent =
        "准备好了";
    }

  });


  document
    .getElementById("finalResult")
    .classList.remove("show");

  window.currentFinalResults =
    null;

  prepareIdleReels();

}


/* =====================================================
   初始化
===================================================== */

buildSlots();

renderSettings();

</script>
