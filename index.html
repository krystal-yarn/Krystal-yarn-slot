<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Krystal 的毛线老虎机</title>


<style>

/* =========================
   基础
========================= */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 15% 15%,
      #ffe5ef 0,
      transparent 25%
    ),
    radial-gradient(
      circle at 85% 10%,
      #fff1c9 0,
      transparent 25%
    ),
    #fff8fb;

  color: #875d70;

}


/* =========================
   页面
========================= */

.page {

  max-width: 1100px;

  margin: auto;

  padding:
    30px 18px 60px;

}


/* =========================
   标题
========================= */

.header {

  text-align: center;

  margin-bottom: 25px;

}

.logo {

  color: #d58aa5;

  font-size: 13px;

  letter-spacing: 3px;

  margin-bottom: 8px;

}

h1 {

  margin: 0;

  color: #d46f97;

  font-size: 32px;

}

.subtitle {

  margin-top: 10px;

  color: #b795a4;

}


/* =========================
   顶部按钮
========================= */

.top-buttons {

  display: flex;

  justify-content: center;

  gap: 10px;

  margin: 20px 0;

}

.top-buttons button {

  border: none;

  border-radius: 30px;

  padding: 10px 18px;

  cursor: pointer;

  font-size: 14px;

  background: #f5c2d4;

  color: white;

}

.top-buttons button.active {

  background: #dc82a5;

}


/* =========================
   抽取页面
========================= */

#drawPage {

  display: block;

}


/* 六个老虎机 */

.slots {

  display: grid;

  grid-template-columns:
    repeat(6, minmax(130px, 1fr));

  gap: 12px;

  overflow-x: auto;

  padding: 10px 3px 20px;

}


/* 单个老虎机 */

.slot {

  min-width: 130px;

  background: white;

  border: 3px solid #f1b2c9;

  border-radius: 25px;

  padding: 12px;

  box-shadow:
    0 8px 20px
    rgba(210,110,150,0.12);

}


/* 标题 */

.slot-title {

  text-align: center;

  font-size: 14px;

  font-weight: bold;

  color: #d37698;

  margin-bottom: 10px;

}


/* 滚轮外框 */

.reel-window {

  height: 180px;

  overflow: hidden;

  border-radius: 18px;

  border: 3px solid #f7d3df;

  background: #fff8fb;

  position: relative;

}


/* 中间中奖框 */

.reel-window::after {

  content: "";

  position: absolute;

  left: 4px;

  right: 4px;

  top: 50%;

  transform: translateY(-50%);

  height: 70px;

  border-top: 2px solid #ef9fba;

  border-bottom: 2px solid #ef9fba;

  background:
    rgba(255,230,240,0.25);

  pointer-events: none;

}


/* 真正移动的滚轮 */

.reel {

  position: absolute;

  top: 0;

  left: 0;

  width: 100%;

}


/* 滚轮项目 */

.reel-item {

  height: 70px;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 5px;

}


/* 图片 */

.reel-item img {

  width: 58px;

  height: 58px;

  object-fit: cover;

  border-radius: 14px;

  border: 2px solid #f3cad8;

}


/* 没有照片时 */

.reel-placeholder {

  width: 90%;

  height: 55px;

  display: flex;

  justify-content: center;

  align-items: center;

  border-radius: 15px;

  background: #fff0f6;

  color: #d6819e;

  font-size: 13px;

  font-weight: bold;

  text-align: center;

}


/* 抽取按钮 */

.draw-main-button {

  display: block;

  margin: 25px auto;

  border: none;

  border-radius: 50px;

  padding: 16px 45px;

  background:
    linear-gradient(
      135deg,
      #f5aac4,
      #dc7fa4
    );

  color: white;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 8px 18px
    rgba(215,115,153,0.25);

}

.draw-main-button:disabled {

  opacity: 0.6;

}


/* 最终结果 */

.final-result {

  background: white;

  border: 3px solid #f4bfd2;

  border-radius: 25px;

  padding: 20px;

  text-align: center;

  margin-top: 20px;

}

.final-result h2 {

  color: #d87599;

  margin-top: 0;

}

.result-grid {

  display: grid;

  grid-template-columns:
    repeat(6, 1fr);

  gap: 10px;

}

.result-item {

  background: #fff5f9;

  border-radius: 15px;

  padding: 10px;

}

.result-item img {

  width: 55px;

  height: 55px;

  object-fit: cover;

  border-radius: 12px;

}


/* =========================
   设置页面
========================= */

#settingsPage {

  display: none;

}

.settings-box {

  background: white;

  border-radius: 28px;

  padding: 22px;

  margin-bottom: 20px;

  border: 3px solid #f3c1d2;

  box-shadow:
    0 8px 20px
    rgba(210,110,150,0.08);

}

.settings-box h2 {

  color: #d37498;

  margin-top: 0;

}


/* 项目 */

.data-row {

  display: flex;

  align-items: center;

  gap: 12px;

  padding: 10px;

  margin-bottom: 8px;

  background: #fff7fa;

  border-radius: 16px;

}


.data-row img {

  width: 55px;

  height: 55px;

  object-fit: cover;

  border-radius: 12px;

}


.data-name {

  flex: 1;

  font-weight: bold;

}


.small-button {

  border: none;

  border-radius: 20px;

  padding: 7px 12px;

  cursor: pointer;

  background: #f1aec4;

  color: white;

}


.delete-button {

  background: #e7a0a0;

}


/* 上传 */

.upload-area {

  border: 2px dashed #efb5c9;

  border-radius: 18px;

  padding: 15px;

  margin-top: 15px;

  background: #fffafd;

}


.upload-area input {

  width: 100%;

  margin-bottom: 10px;

}


/* 限制设置 */

.limit-section {

  background: #fff6fa;

  padding: 15px;

  border-radius: 18px;

  margin-top: 15px;

}


.checkbox-list {

  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(140px, 1fr));

  gap: 8px;

  margin-top: 10px;

}


.checkbox-list label {

  background: white;

  padding: 8px;

  border-radius: 12px;

  font-size: 13px;

}


select {

  width: 100%;

  padding: 10px;

  border-radius: 12px;

  border: 2px solid #f0c5d4;

  background: white;

}


/* 手机 */

@media (max-width: 700px) {

  h1 {

    font-size: 27px;

  }

  .slots {

    grid-template-columns:
      repeat(6, 135px);

  }

  .result-grid {

    grid-template-columns:
      repeat(2, 1fr);

  }

}

</style>

</head>


<body>


<div class="page">


<!-- =========================
     顶部
========================= -->

<div class="header">

  <div class="logo">
    KRYSTAL'S YARN LAB
  </div>

  <h1>
    🎀 毛线老虎机
  </h1>

  <div class="subtitle">
    抽出今天的小幸运 ✨
  </div>

</div>


<div class="top-buttons">

  <button
    id="drawTab"
    class="active"
    onclick="showDrawPage()"
  >
    🎰 开始抽取
  </button>

  <button
    id="settingsTab"
    onclick="showSettingsPage()"
  >
    ⚙️ 设置
  </button>

</div>


<!-- ==================================================
     抽取页面
================================================== -->

<div id="drawPage">


  <div class="slots">


    <!-- 1 款式 -->

    <div class="slot">

      <div class="slot-title">
        ① 款式
      </div>

      <div class="reel-window">

        <div
          class="reel"
          id="reel-style"
        ></div>

      </div>

    </div>


    <!-- 2 主色 -->

    <div class="slot">

      <div class="slot-title">
        ② 线材主色
      </div>

      <div class="reel-window">

        <div
          class="reel"
          id="reel-mainColor"
        ></div>

      </div>

    </div>


    <!-- 3 配色 -->

    <div class="slot">

      <div class="slot-title">
        ③ 线材配色
      </div>

      <div class="reel-window">

        <div
          class="reel"
          id="reel-secondaryColor"
        ></div>

      </div>

    </div>


    <!-- 4 扣子1 -->

    <div class="slot">

      <div class="slot-title">
        ④ 扣子①
      </div>

      <div class="reel-window">

        <div
          class="reel"
          id="reel-button1"
        ></div>

      </div>

    </div>


    <!-- 5 扣子2 -->

    <div class="slot">

      <div class="slot-title">
        ⑤ 扣子②
      </div>

      <div class="reel-window">

        <div
          class="reel"
          id="reel-button2"
        ></div>

      </div>

    </div>


    <!-- 6 吊饰 -->

    <div class="slot">

      <div class="slot-title">
        ⑥ 小吊饰
      </div>

      <div class="reel-window">

        <div
          class="reel"
          id="reel-charm"
        ></div>

      </div>

    </div>


  </div>


  <button
    class="draw-main-button"
    id="drawButton"
    onclick="startFullDraw()"
  >
    🎰 开始抽取
  </button>


  <div
    class="final-result"
    id="finalResult"
    style="display:none"
  >

    <h2>
      ✨ 今日幸运组合 ✨
    </h2>

    <div
      class="result-grid"
      id="resultGrid"
    ></div>

  </div>


</div>


<!-- ==================================================
     设置页面
================================================== -->

<div id="settingsPage">


  <!-- =========================
       款式
  ========================= -->

  <div class="settings-box">

    <h2>
      👜 ① 款式管理
    </h2>

    <div id="styleList"></div>

    <div class="upload-area">

      <strong>
        添加新款式
      </strong>

      <br><br>

      <input
        type="text"
        id="newStyleName"
        placeholder="例如：云朵包"
      >

      <input
        type="file"
        id="newStyleImage"
        accept="image/*"
      >

      <button
        class="small-button"
        onclick="addStyle()"
      >
        ＋ 添加款式
      </button>

    </div>

  </div>


  <!-- =========================
       主色
  ========================= -->

  <div class="settings-box">

    <h2>
      🧶 ② 线材主色
    </h2>

    <div id="mainColorList"></div>

    <div class="upload-area">

      <strong>
        添加主色
      </strong>

      <br><br>

      <input
        type="text"
        id="newMainColorName"
        placeholder="例如：浅粉色"
      >

      <input
        type="file"
        id="newMainColorImage"
        accept="image/*"
      >

      <button
        class="small-button"
        onclick="addMainColor()"
      >
        ＋ 添加主色
      </button>

    </div>

  </div>


  <!-- =========================
       配色
  ========================= -->

  <div class="settings-box">

    <h2>
      🎨 ③ 线材配色
    </h2>

    <div id="secondaryColorList"></div>

    <div class="upload-area">

      <strong>
        添加配色
      </strong>

      <br><br>

      <input
        type="text"
        id="newSecondaryColorName"
        placeholder="例如：米白色"
      >

      <input
        type="file"
        id="newSecondaryColorImage"
        accept="image/*"
      >

      <button
        class="small-button"
        onclick="addSecondaryColor()"
      >
        ＋ 添加配色
      </button>

    </div>

  </div>


  <!-- =========================
       扣子
  ========================= -->

  <div class="settings-box">

    <h2>
      🔘 ④⑤ 扣子
    </h2>

    <div id="buttonList"></div>

    <div class="upload-area">

      <strong>
        添加扣子
      </strong>

      <br><br>

      <input
        type="text"
        id="newButtonName"
        placeholder="例如：白色圆扣"
      >

      <input
        type="file"
        id="newButtonImage"
        accept="image/*"
      >

      <button
        class="small-button"
        onclick="addButtonItem()"
      >
        ＋ 添加扣子
      </button>

    </div>

  </div>


  <!-- =========================
       吊饰
  ========================= -->

  <div class="settings-box">

    <h2>
      🍓 ⑥ 小吊饰
    </h2>

    <div id="charmList"></div>

    <div class="upload-area">

      <strong>
        添加小吊饰
      </strong>

      <br><br>

      <input
        type="text"
        id="newCharmName"
        placeholder="例如：苹果"
      >

      <input
        type="file"
        id="newCharmImage"
        accept="image/*"
      >

      <button
        class="small-button"
        onclick="addCharm()"
      >
        ＋ 添加吊饰
      </button>

    </div>

  </div>


  <!-- =========================
       搭配限制
  ========================= -->

  <div class="settings-box">

    <h2>
      🔗 搭配限制
    </h2>


    <div class="limit-section">

      <strong>
        选择款式
      </strong>

      <select
        id="limitStyleSelect"
        onchange="renderLimits()"
      ></select>


      <h3>
        主色允许出现：
      </h3>

      <div
        id="styleMainColorLimits"
        class="checkbox-list"
      ></div>


      <h3>
        扣子①允许出现：
      </h3>

      <div
        id="styleButton1Limits"
        class="checkbox-list"
      ></div>


      <h3>
        扣子②允许出现：
      </h3>

      <div
        id="styleButton2Limits"
        class="checkbox-list"
      ></div>


      <h3>
        吊饰允许出现：
      </h3>

      <div
        id="styleCharmLimits"
        class="checkbox-list"
      ></div>

    </div>


    <div class="limit-section">

      <strong>
        选择主色
      </strong>

      <select
        id="limitColorSelect"
        onchange="renderColorLimits()"
      ></select>


      <h3>
        这个主色允许搭配：
      </h3>

      <div
        id="secondaryLimits"
        class="checkbox-list"
      ></div>

    </div>

  </div>


</div>


</div>


<script>

/* ==================================================
   数据
================================================== */


/*
  第一次打开时使用这些示例资料。
  以后全部可以在网页设置里面修改。
*/

let data = {

  styles: [

    {
      id: "style1",
      name: "示例款式",
      image: ""
    }

  ],


  mainColors: [

    {
      id: "main1",
      name: "酒红色",
      image: ""
    },

    {
      id: "main2",
      name: "米白色",
      image: ""
    },

    {
      id: "main3",
      name: "牛油果绿",
      image: ""
    },

    {
      id: "main4",
      name: "浅灰色",
      image: ""
    },

    {
      id: "main5",
      name: "金黄色",
      image: ""
    },

    {
      id: "main6",
      name: "大红色",
      image: ""
    },

    {
      id: "main7",
      name: "橘黄色",
      image: ""
    },

    {
      id: "main8",
      name: "玫红色",
      image: ""
    },

    {
      id: "main9",
      name: "深粉色",
      image: ""
    },

    {
      id: "main10",
      name: "浅粉色",
      image: ""
    },

    {
      id: "main11",
      name: "浅紫色",
      image: ""
    },

    {
      id: "main12",
      name: "米黄色",
      image: ""
    }

  ],


  secondaryColors: [],


  buttons: [],


  charms: [],


  /*
    款式限制
  */

  styleRules: {},


  /*
    主色 → 配色限制
  */

  colorRules: {}

};


/* ==================================================
   保存 / 读取
================================================== */

function saveData() {

  localStorage.setItem(
    "krystalSlotMachineData",
    JSON.stringify(data)
  );

}


function loadData() {

  const saved =
    localStorage.getItem(
      "krystalSlotMachineData"
    );


  if (saved) {

    try {

      data = JSON.parse(saved);

    }

    catch (error) {

      console.log(
        "读取资料失败，使用默认资料"
      );

    }

  }

}


loadData();


/* ==================================================
   ID
================================================== */

function createId(prefix) {

  return (
    prefix +
    Date.now() +
    Math.random()
      .toString(36)
      .substring(2, 7)
  );

}


/* ==================================================
   图片转本地资料
================================================== */

function readImage(file) {

  return new Promise(
    function(resolve) {

      if (!file) {

        resolve("");

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          resolve(
            event.target.result
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


/* ==================================================
   页面切换
================================================== */

function showDrawPage() {

  document
    .getElementById("drawPage")
    .style.display = "block";

  document
    .getElementById("settingsPage")
    .style.display = "none";


  document
    .getElementById("drawTab")
    .classList.add("active");

  document
    .getElementById("settingsTab")
    .classList.remove("active");


  refreshDrawPage();

}


function showSettingsPage() {

  document
    .getElementById("drawPage")
    .style.display = "none";

  document
    .getElementById("settingsPage")
    .style.display = "block";


  document
    .getElementById("settingsTab")
    .classList.add("active");

  document
    .getElementById("drawTab")
    .classList.remove("active");


  renderSettings();

}


/* ==================================================
   设置页面
================================================== */

function renderSettings() {

  renderStyles();

  renderMainColors();

  renderSecondaryColors();

  renderButtons();

  renderCharms();

  renderLimitSelectors();

  renderLimits();

  renderColorLimits();

}


/* ==================================================
   款式
================================================== */

function renderStyles() {

  const box =
    document.getElementById(
      "styleList"
    );


  box.innerHTML = "";


  data.styles.forEach(
    function(item) {

      box.innerHTML += `

        <div class="data-row">

          ${
            item.image
            ?
            `<img src="${item.image}">`
            :
            `<div class="reel-placeholder">
              暂无照片
            </div>`
          }

          <div class="data-name">
            ${item.name}
          </div>

          <button
            class="small-button delete-button"
            onclick="deleteItem('styles','${item.id}')"
          >
            删除
          </button>

        </div>

      `;

    }
  );

}


async function addStyle() {

  const name =
    document
      .getElementById("newStyleName")
      .value
      .trim();


  const file =
    document
      .getElementById("newStyleImage")
      .files[0];


  if (!name) {

    alert("请输入款式名称");

    return;

  }


  const image =
    await readImage(file);


  data.styles.push({

    id: createId("style"),

    name: name,

    image: image

  });


  saveData();


  document
    .getElementById("newStyleName")
    .value = "";


  document
    .getElementById("newStyleImage")
    .value = "";


  renderSettings();

}


/* ==================================================
   主色
================================================== */

function renderMainColors() {

  const box =
    document.getElementById(
      "mainColorList"
    );


  box.innerHTML = "";


  data.mainColors.forEach(
    function(item) {

      box.innerHTML += `

        <div class="data-row">

          ${
            item.image
            ?
            `<img src="${item.image}">`
            :
            `<div class="reel-placeholder">
              ${item.name}
            </div>`
          }

          <div class="data-name">
            ${item.name}
          </div>

          <button
            class="small-button delete-button"
            onclick="deleteItem('mainColors','${item.id}')"
          >
            删除
          </button>

        </div>

      `;

    }
  );

}


async function addMainColor() {

  const name =
    document
      .getElementById(
        "newMainColorName"
      )
      .value
      .trim();


  const file =
    document
      .getElementById(
        "newMainColorImage"
      )
      .files[0];


  if (!name) {

    alert("请输入颜色名称");

    return;

  }


  const image =
    await readImage(file);


  data.mainColors.push({

    id: createId("main"),

    name: name,

    image: image

  });


  saveData();


  document
    .getElementById(
      "newMainColorName"
    )
    .value = "";


  document
    .getElementById(
      "newMainColorImage"
    )
    .value = "";


  renderSettings();

}


/* ==================================================
   配色
================================================== */

function renderSecondaryColors() {

  const box =
    document.getElementById(
      "secondaryColorList"
    );


  box.innerHTML = "";


  data.secondaryColors.forEach(
    function(item) {

      box.innerHTML += `

        <div class="data-row">

          ${
            item.image
            ?
            `<img src="${item.image}">`
            :
            `<div class="reel-placeholder">
              ${item.name}
            </div>`
          }

          <div class="data-name">
            ${item.name}
          </div>

          <button
            class="small-button delete-button"
            onclick="deleteItem('secondaryColors','${item.id}')"
          >
            删除
          </button>

        </div>

      `;

    }
  );

}


async function addSecondaryColor() {

  const name =
    document

  category,
  id
) {

    !confirm("确定要删除这个项目吗？")

    return;

  }


  data[category] =
    data[category].filter(
      function(item) {

        return item.id !== id;

      }
    );


  saveData();

  renderSettings();

}

/* ==================================================
   创建 checkbox
================================================== */

function createCheckboxList(
  container,
  items,
  selected,
  callback
) {

  container.innerHTML = "";


  items.forEach(
    function(item) {

      const checked =
        selected.includes(item.id)
        ?
        "checked"
        :
        "";


      container.innerHTML += `

        <label>

          <input
            type="checkbox"
            value="${item.id}"
            ${checked}
            onchange="${callback}(this)"
          >

          ${item.name}

        </label>

      `;

    }
  );

}


/* ==================================================
   款式限制
================================================== */

function getStyleRule(
  styleId
) {

  if (!data.styleRules[styleId]) {

    data.styleRules[styleId] = {

      mainColors: [],

      button1: [],

      button2: [],

      charms: []

    };

  }


  return data.styleRules[styleId];

}


function renderLimits() {

  const select =
    document.getElementById(
      "limitStyleSelect"
    );


  if (!select.value) {
    return;
  }


  const rule =
    getStyleRule(
      select.value
    );


  createCheckboxList(

    document.getElementById(
      "styleMainColorLimits"
    ),

    data.mainColors,

    rule.mainColors,

    "changeStyleMainColor"

  );


  createCheckboxList(

    document.getElementById(
      "styleButton1Limits"
    ),

    data.buttons,

    rule.button1,

    "changeStyleButton1"

  );


  createCheckboxList(

    document.getElementById(
      "styleButton2Limits"
    ),

    data.buttons,

    rule.button2,

    "changeStyleButton2"

  );


  createCheckboxList(

    document.getElementById(
      "styleCharmLimits"
    ),

    data.charms,

    rule.charms,

    "changeStyleCharm"

  );

}

function updateRuleArray(
  styleId,
  category,
  checkbox
) {

  const rule =
    getStyleRule(styleId);


  if (checkbox.checked) {

    if (
      !rule[category].includes(
        checkbox.value
      )
    ) {

      rule[category].push(
        checkbox.value
      );

    }

  }

  else {

    rule[category] =
      rule[category].filter(
        function(id) {

          return id !== checkbox.value;

        }
      );

  }


  saveData();

}

/* ==================================================
   抽取系统
================================================== */


/*
  如果某个限制没有设置，
  就使用全部项目。

  这样你不用每一个东西都设置限制。
*/


function getAllowedItems(
  items,
  selectedIds
) {

  if (
    !selectedIds ||
    selectedIds.length === 0
  ) {

    return items;

  }


  return items.filter(
    function(item) {

      return selectedIds.includes(
        item.id
      );

    }
  );

}


/* 随机 */

function randomItem(items) {

  if (!items || items.length === 0) {

    return null;

  }


  return items[
    Math.floor(
      Math.random() * items.length
    )
  ];

}


/* ==================================================
   创建滚轮
================================================== */

function buildReel(
  element,
  items
) {

  element.innerHTML = "";

  element.style.transition =
    "none";

  element.style.transform =
    "translateY(0px)";


  if (!items || items.length === 0) {

    items = [
      {
        id: "empty",
        name: "请先设置",
        image: ""
      }
    ];

  }


  /*
    重复很多轮，
    制造真正滚动的感觉。
  */

  const repeat = 8;


  for (
    let r = 0;
    r < repeat;
    r++
  ) {

    items.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "reel-item";


        if (item.image) {

          div.innerHTML = `

            <img
              src="${item.image}"
              alt="${item.name}"
            >

          `;

        }

        else {

          div.innerHTML = `

            <div
              class="reel-placeholder"
            >
              ${item.name}
            </div>

          `;

        }


        element.appendChild(div);

      }
    );

  }


  return items;

}


/* ==================================================
   单个老虎机动画
================================================== */

function animateReel(
  element,
  items,
  finalItem,
  delay
) {

  return new Promise(
    function(resolve) {


      if (!items.length) {

        resolve(finalItem);

        return;

      }


      const finalIndex =
        items.findIndex(
          function(item) {

            return item.id ===
              finalItem.id;

          }
        );


      const rounds = 5;


      const targetIndex =
        rounds * items.length
        + finalIndex;


      const distance =
        targetIndex * 70;


      setTimeout(
        function() {


          element.style.transition =
            "transform 2.8s cubic-bezier(0.12, 0.72, 0.18, 1)";


          element.style.transform =
            `translateY(-${distance}px)`;


          setTimeout(
            function() {

              resolve(finalItem);

            },
            3000
          );


        },
        delay
      );

    }
  );

}


/* ==================================================
   整套抽取
================================================== */

async function startFullDraw() {


  const button =
    document.getElementById(
      "drawButton"
    );


  if (button.disabled) {
    return;
  }


  button.disabled = true;

  button.innerText =
    "🎰 正在抽取...";


  document
    .getElementById(
      "finalResult"
    )
    .style.display = "none";


  /*
    =================================
    ① 抽款式
    =================================
  */

  const style =
    randomItem(
      data.styles
    );


  /*
    如果没有款式
  */

  if (!style) {

    alert(
      "请先到设置页面添加款式。"
    );

    button.disabled = false;

    button.innerText =
      "🎰 开始抽取";

    return;

  }


  const styleRule =
    getStyleRule(
      style.id
    );


  /*
    =================================
    ② 根据款式抽主色
    =================================
  */

  const allowedMainColors =
    getAllowedItems(
      data.mainColors,
      styleRule.mainColors
    );


  const mainColor =
    randomItem(
      allowedMainColors
    );


  /*
    =================================
    ③ 根据主色抽配色
    =================================
  */

  let allowedSecondary =
    data.secondaryColors;


  if (
    mainColor &&
    data.colorRules[
      mainColor.id
    ] &&
    data.colorRules[
      mainColor.id
    ].length > 0
  ) {

    allowedSecondary =
      getAllowedItems(
        data.secondaryColors,
        data.colorRules[
          mainColor.id
        ]
      );

  }


  const secondaryColor =
    randomItem(
      allowedSecondary
    );


  /*
    =================================
    ④ 扣子①
    =================================
  */

  const allowedButton1 =
    getAllowedItems(
      data.buttons,
      styleRule.button1
    );


  const button1 =
    randomItem(
      allowedButton1
    );


  /*
    =================================
    ⑤ 扣子②
    =================================
  */

  const allowedButton2 =
    getAllowedItems(
      data.buttons,
      styleRule.button2
    );


  const button2 =
    randomItem(
      allowedButton2
    );


  /*
    =================================
    ⑥ 吊饰
    =================================
  */

  const allowedCharms =
    getAllowedItems(
      data.charms,
      styleRule.charms
    );


  const charm =
    randomItem(
      allowedCharms
    );


  /*
    =================================
    建立六个滚轮
    =================================
  */


  const reelStyle =
    document.getElementById(
      "reel-style"
    );


  const reelMain =
    document.getElementById(
      "reel-mainColor"
    );


  const reelSecondary =
    document.getElementById(
      "reel-secondaryColor"
    );


  const reelButton1 =
    document.getElementById(
      "reel-button1"
    );


  const reelButton2 =
    document.getElementById(
      "reel-button2"
    );


  const reelCharm =
    document.getElementById(
      "reel-charm"
    );


  /*
    建立滚轮
  */

  buildReel(
    reelStyle,
    data.styles
  );


  buildReel(
    reelMain,
    allowedMainColors
  );


  buildReel(
    reelSecondary,
    allowedSecondary
  );


  buildReel(
    reelButton1,
    allowedButton1
  );


  buildReel(
    reelButton2,
    allowedButton2
  );


  buildReel(
    reelCharm,
    allowedCharms
  );


  /*
    =================================
    开始依次滚动
    =================================
  */

  await animateReel(
    reelStyle,
    data.styles,
    style,
    0
  );


  await animateReel(
    reelMain,
    allowedMainColors,
    mainColor,
    0
  );


  await animateReel(
    reelSecondary,
    allowedSecondary,
    secondaryColor,
    0
  );


  await animateReel(
    reelButton1,
    allowedButton1,
    button1,
    0
  );


  await animateReel(
    reelButton2,
    allowedButton2,
    button2,
    0
  );


  await animateReel(
    reelCharm,
    allowedCharms,
    charm,
    0
  );


  /*
    =================================
    最终结果
    =================================
  */

  showFinalResult([

    {
      title: "款式",
      item: style
    },

    {
      title: "主色",
      item: mainColor
    },

    {
      title: "配色",
      item: secondaryColor
    },

    {
      title: "扣子①",
      item: button1
    },

    {
      title: "扣子②",
      item: button2
    },

    {
      title: "小吊饰",
      item: charm
    }

  ]);


  button.disabled = false;

  button.innerText =
    "🎀 再抽一次";

}


/* ==================================================
   显示最终组合
================================================== */

function showFinalResult(
  results
) {

  const box =
    document.getElementById(
      "resultGrid"
    );


  box.innerHTML = "";


  results.forEach(
    function(result) {

      if (!result.item) {

        return;

      }


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "result-item";


      let imageHTML = "";


      if (result.item.image) {

        imageHTML = `

          <img
            src="${result.item.image}"
          >

        `;

      }


      div.innerHTML = `

        ${imageHTML}

        <div>
          ${result.title}
        </div>

        <strong>
          ${result.item.name}
        </strong>

      `;


      box.appendChild(div);

    }
  );


  document
    .getElementById(
      "finalResult"
    )
    .style.display = "block";

}


/* ==================================================
   抽取页面初始化
================================================== */

function refreshDrawPage() {

  buildReel(
    document.getElementById(
      "reel-style"
    ),
    data.styles
  );


  buildReel(

  );

    ),

  );

}
