<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Krystal 的毛线老虎机</title>

  <style>

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff5fa;
    }

    h1 {
      color: #d96b9b;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 30px;
    }

    /* ====== 彩票机外框 ====== */

    .machine {
      width: 330px;
      margin: 0 auto;
      padding: 25px 20px 30px;
      background: #ffffff;
      border: 5px solid #f3a3c0;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(217, 107, 155, 0.2);
    }

    .machine-title {
      color: #d96b9b;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* ====== 滚轮区域 ====== */

    .slot-window {
      width: 100%;
      height: 90px;
      background: #fff0f6;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid #f5b3cc;
      position: relative;
    }

    .reels {
      display: flex;
      justify-content: space-around;
      height: 100%;
    }

    .reel {
      width: 30%;
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      color: #d96b9b;
    }

    /* 中间选中线 */

    .slot-window::before,
    .slot-window::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: #f3a3c0;
      z-index: 5;
    }

    .slot-window::before {
      top: 28px;
    }

    .slot-window::after {
      bottom: 28px;
    }

    /* ====== 按钮 ====== */

    .draw-button {
      margin-top: 30px;
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      background: #f39abb;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(217, 107, 155, 0.25);
    }

    .draw-button:hover {
      background: #e47fa5;
    }

    .draw-button:active {
      transform: scale(0.96);
    }

    /* ====== 结果 ====== */

    #result {
      margin-top: 25px;
      min-height: 32px;
      font-size: 22px;
      font-weight: bold;
      color: #d96b9b;
    }

    .hint {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
    }

  </style>
</head>


<body>

  <h1>🎰 Krystal 的毛线老虎机</h1>

  <div class="subtitle">
    今天会抽到什么颜色呢？
  </div>


  <div class="machine">

    <div class="machine-title">
      🧶 毛线研究室 · COLOR MACHINE
    </div>


    <div class="slot-window">

      <div class="reels">

        <div class="reel" id="reel1">
          🌸
        </div>

        <div class="reel" id="reel2">
          🧶
        </div>

        <div class="reel" id="reel3">
          🌷
        </div>

      </div>

    </div>


    <button class="draw-button" onclick="startDraw()">
      开始抽取
    </button>


    <div id="result"></div>

  </div>


  <div class="hint">
    ✨ 好运正在加载中……
  </div>


  <script>

    const colors = [
      "酒红色",
      "米白色",
      "牛油果绿",
      "浅灰色",
      "金黄色",
      "大红色",
      "橘黄色",
      "玫红色",
      "深粉色",
      "浅粉色",
      "浅紫色",
      "米黄色"
    ];


    let isDrawing = false;


    function startDraw() {

      if (isDrawing) {
        return;
      }

      isDrawing = true;

      document.getElementById("result").innerText = "";

      const reel1 = document.getElementById("reel1");
      const reel2 = document.getElementById("reel2");
      const reel3 = document.getElementById("reel3");

      const button = document.querySelector(".draw-button");

      button.innerText = "🎰 抽取中...";


      /*
        第一阶段：
        快速改变三个滚轮的文字
      */

      let count = 0;

      const rolling = setInterval(function() {

        reel1.innerText =
          colors[Math.floor(Math.random() * colors.length)];

        reel2.innerText =
          colors[Math.floor(Math.random() * colors.length)];

        reel3.innerText =
          colors[Math.floor(Math.random() * colors.length)];

        count++;

        /*
          滚动约 2 秒后停止
        */

        if (count >= 20) {

          clearInterval(rolling);

          finishDraw();

        }

      }, 100);

    }


    function finishDraw() {

      const finalColor =
        colors[Math.floor(Math.random() * colors.length)];


      /*
        三个滚轮最后停在同一个颜色
      */

      document.getElementById("reel1").innerText = finalColor;

      document.getElementById("reel2").innerText = finalColor;

      document.getElementById("reel3").innerText = finalColor;


      /*
        显示最终结果
      */

      document.getElementById("result").innerText =
        "🎉 抽到了：" + finalColor + "！";


      document.querySelector(".draw-button").innerText =
        "再抽一次";


      isDrawing = false;

    }

  </script>

</body>
</html>
