<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krystal 的毛线研究室｜老虎机</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

:root{
  --pink:#f5a5c0;
  --pink-light:#ffe7f0;
  --pink-bg:#fff6fa;
  --cream:#fffaf3;
  --brown:#6b4c4c;
  --deep:#d96d96;
  --line:#f2c8d8;
  --shadow:0 8px 22px rgba(190,120,145,.15);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#fff7fa 0%,#fffaf3 100%);
  color:var(--brown);
  font-family:
    "ZCOOL KuaiLe",
    "STYuanti-SC",
    "Yuanti SC",
    "Hannotate SC",
    "Hiragino Maru Gothic ProN",
    "Arial Rounded MT Bold",
    "PingFang SC",
    sans-serif;
}

button,input{font-family:inherit}
button{cursor:pointer}

/* ================= HEADER ================= */

header{
  text-align:center;
  padding:58px 15px 14px;
  position:relative;
}

.logo{
  font-size:30px;
  color:#d96d96;
  margin-bottom:5px;
}

.subtitle{
  font-size:14px;
  color:#a98691;
}

/* ================= NAV ================= */

.nav{
  position:absolute;
  top:18px;
  right:18px;
  display:flex;
  gap:5px;
  margin:0;
  padding:0;
  z-index:50;
}

.nav button{
  border:1px solid #f2d1dd;
  background:rgba(255,255,255,.92);
  color:#a56d7e;
  padding:6px 10px;
  border-radius:18px;
  box-shadow:0 3px 10px rgba(190,120,145,.10);
  font-size:12px;
  line-height:1;
}

.nav button.active{
  background:#f5a5c0;
  color:white;
  border-color:#f5a5c0;
}

/* ================= PAGE ================= */

.page{display:none}
.page.active{display:block}

.container{
  width:min(1400px,96%);
  margin:auto;
}

/* ================= ORDER ================= */

.order-box{
  background:#fff;
  border:2px solid #f6d5e1;
  border-radius:22px;
  padding:14px 18px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.order-title{
  font-size:16px;
  color:#d96d96;
  white-space:nowrap;
}

.order-input{
  width:min(300px,60vw);
  border:2px solid #f0c7d6;
  border-radius:30px;
  padding:9px 15px;
  outline:none;
  font-size:14px;
  text-align:center;
  background:#fffafc;
}

.order-input:focus{
  border-color:#ed9fbb;
  box-shadow:0 0 0 4px #ffeaf2;
}

.history-small-btn{
  border:none;
  background:#fff0f5;
  color:#c96789;
  border:1px solid #f3ccd9;
  border-radius:18px;
  padding:8px 12px;
  font-size:12px;
  white-space:nowrap;
  box-shadow:0 3px 8px rgba(190,120,145,.08);
}

.history-small-btn:hover{
  background:#ffe3ed;
}

/* ================= BUTTONS ================= */

.draw-controls{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.main-btn,
.stop-all-btn{
  border:none;
  border-radius:30px;
  padding:13px 26px;
  font-size:17px;
  box-shadow:var(--shadow);
}

.main-btn{
  background:#f39abb;
  color:white;
}

.main-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.stop-all-btn{
  background:#fff;
  color:#d96d96;
  border:2px solid #f2bfd0;
}

/* ================= SIX MACHINES ================= */

.machine-scroll{
  width:100%;
  overflow:hidden;
}

.machine-grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:clamp(4px,1vw,14px);
  align-items:start;
}

.machine{
  min-width:0;
  background:#fff;
  border:2px solid #f5d5e1;
  border-radius:20px;
  padding:clamp(5px,1vw,12px);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.machine-title{
  text-align:center;
  color:#d96d96;
  font-size:clamp(11px,1.35vw,18px);
  margin-bottom:8px;
  white-space:nowrap;
}

/* ================= REEL ================= */

.reel-window{
  position:relative;
  height:clamp(105px,11vw,145px);
  overflow:hidden;
  border-radius:14px;
  background:#fff8fb;
  border:2px solid #f4d5e0;
}

.reel-window::before,
.reel-window::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:25%;
  z-index:5;
  pointer-events:none;
}

.reel-window::before{
  top:0;
  background:linear-gradient(to bottom,rgba(255,248,251,.98),rgba(255,248,251,0));
}

.reel-window::after{
  bottom:0;
  background:linear-gradient(to top,rgba(255,248,251,.98),rgba(255,248,251,0));
}

.reel-track{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  will-change:transform;
}

.reel-item{
  width:100%;
  height:clamp(105px,11vw,145px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:5px;
  text-align:center;
}

.reel-item-inner{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:12px;
}

.reel-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:11px;
}

.reel-text{
  font-size:clamp(11px,1.2vw,17px);
  line-height:1.2;
  padding:5px;
  word-break:break-all;
}

.reel-middle{
  position:absolute;
  left:3px;
  right:3px;
  top:50%;
  height:clamp(105px,11vw,145px);
  transform:translateY(-50%);
  border:3px solid #f19bb9;
  border-radius:12px;
  z-index:10;
  pointer-events:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.65);
}

.machine-stop{
  width:100%;
  border:none;
  margin-top:8px;
  padding:8px 4px;
  border-radius:20px;
  background:#ffe5ee;
  color:#c96789;
  font-size:clamp(9px,1.1vw,15px);
}

.machine-stop:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* ================= SETTINGS ================= */

.settings-container{
  width:min(1100px,95%);
  margin:auto;
}

.settings-card{
  background:#fff;
  border:2px solid #f4d4e0;
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.settings-card h2{
  margin:0 0 15px;
  color:#d96d96;
  font-size:20px;
}

.setting-item{
  border:1px solid #f0d8e1;
  border-radius:16px;
  padding:13px;
  margin-bottom:10px;
  background:#fffafc;
}

.setting-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.item-preview{
  width:62px;
  height:62px;
  flex:none;
  border-radius:12px;
  background:#fff;
  border:1px solid #efd2dd;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.item-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.item-name{
  flex:1;
  min-width:0;
  font-size:16px;
}

.delete-btn,
.photo-btn{
  border:none;
  border-radius:18px;
  padding:7px 10px;
  font-size:12px;
}

.photo-btn{
  background:#ffe5ef;
  color:#c96789;
}

.delete-btn{
  background:#fff;
  color:#d87d99;
  border:1px solid #f2c5d5;
}

.stock-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.stock-row button{
  width:32px;
  height:32px;
  border:none;
  border-radius:50%;
  background:#ffdce9;
  color:#c86687;
  font-size:18px;
}

.stock-input{
  width:65px;
  height:32px;
  border:1px solid #edc9d6;
  border-radius:10px;
  text-align:center;
  background:white;
}

.stock-status{
  font-size:13px;
  padding:5px 10px;
  border-radius:20px;
}

.stock-status.in{
  color:#6b9b75;
  background:#e9f7eb;
}

.stock-status.out{
  color:#d7788d;
  background:#ffe9ed;
}

.photo-check{
  font-size:12px;
  color:#9b7d88;
  display:flex;
  align-items:center;
  gap:5px;
}

.add-area{
  display:flex;
  gap:8px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.add-input{
  flex:1;
  min-width:150px;
  border:1px solid #ebcbd7;
  border-radius:20px;
  padding:10px 14px;
  outline:none;
}

.add-btn{
  border:none;
  border-radius:20px;
  padding:10px 18px;
  background:#f4a3bd;
  color:white;
}

/* ================= RULES ================= */

.rules-box{
  background:#fff8fb;
  border:1px solid #f2d2df;
  border-radius:15px;
  padding:12px;
}

.rule-row{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:10px;
  align-items:start;
  padding:10px 0;
  border-bottom:1px dashed #efd6df;
}

.rule-row:last-child{
  border-bottom:none;
}

.rule-title{
  color:#c86b88;
}

.rule-options{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.rule-option{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:13px;
  background:white;
  padding:5px 8px;
  border-radius:12px;
  border:1px solid #f0d9e2;
}

/* ================= HISTORY ================= */

.history-card{
  background:#fff;
  border:2px solid #f4d4e0;
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.history-title{
  color:#d96d96;
  font-size:20px;
}

.history-item{
  background:#fff9fc;
  border:1px solid #f0d7e1;
  border-radius:16px;
  padding:13px;
  margin-bottom:10px;
}

.history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.history-order{
  color:#c96789;
  font-size:16px;
}

.history-time{
  font-size:12px;
  color:#a98a94;
}

.history-results{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.history-result{
  background:white;
  border-radius:10px;
  padding:7px;
  font-size:12px;
}

.history-label{
  color:#c78399;
  font-size:10px;
  margin-bottom:3px;
}

.history-delete{
  margin-top:10px;
  border:none;
  background:#ffe8ef;
  color:#c96789;
  border-radius:18px;
  padding:6px 12px;
}

.clear-history{
  border:none;
  border-radius:20px;
  padding:9px 16px;
  background:#fff;
  color:#d96d96;
  border:1px solid #f2bfd0;
}

/* ================= RESULT ================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(92,56,67,.42);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.result-box{
  width:min(560px,94vw);
  max-height:90vh;
  overflow:auto;
  background:#fffafc;
  border-radius:28px;
  padding:22px;
  box-shadow:0 20px 50px rgba(80,40,50,.25);
}

.result-title{
  text-align:center;
  color:#d96d96;
  font-size:25px;
  margin-bottom:5px;
}

.result-order{
  text-align:center;
  color:#9f7c87;
  font-size:14px;
  margin-bottom:16px;
}

.result-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.result-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  border:1px solid #f0d7e1;
  border-radius:16px;
  padding:9px;
}

.result-label{
  width:75px;
  flex:none;
  color:#bd758d;
  font-size:14px;
}

.result-visual{
  width:62px;
  height:62px;
  border-radius:12px;
  overflow:hidden;
  background:#fff7fa;
  display:flex;
  align-items:center;
  justify-content:center;
}

.result-visual img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.result-name{
  flex:1;
  font-size:16px;
}

.confirm-btn{
  display:block;
  width:100%;
  margin-top:18px;
  border:none;
  border-radius:30px;
  background:#f29cba;
  color:white;
  padding:13px;
  font-size:18px;
}

.empty{
  text-align:center;
  padding:15px;
  color:#b997a2;
  font-size:13px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  header{
    padding-top:52px;
  }

  .logo{
    font-size:24px;
  }

  .subtitle{
    font-size:12px;
  }

  .nav{
    top:10px;
    right:10px;
    gap:4px;
  }

  .nav button{
    padding:5px 7px;
    font-size:10px;
  }

  .order-box{
    padding:12px;
    gap:7px;
  }

  .order-title{
    width:100%;
    font-size:14px;
  }

  .order-input{
    width:min(230px,65vw);
    font-size:13px;
    padding:8px 12px;
  }

  .history-small-btn{
    padding:7px 9px;
    font-size:10px;
  }

  .machine-grid{
    gap:3px;
  }

  .machine{
    border-radius:12px;
    padding:4px;
  }

  .machine-title{
    font-size:9px;
  }

  .machine-stop{
    font-size:8px;
    padding:6px 1px;
  }

  .reel-item{
    padding:3px;
  }

  .reel-text{
    font-size:9px;
  }

  .history-results{
    grid-template-columns:repeat(2,1fr);
  }

  .history-head{
    align-items:flex-start;
  }

  .history-time{
    font-size:10px;
  }
}

@media(max-width:430px){

  .nav{
    gap:3px;
  }

  .nav button{
    padding:5px 6px;
    font-size:9px;
  }

  .logo{
    font-size:21px;
  }

  .order-title{
    font-size:13px;
  }

  .order-input{
    width:180px;
  }

  .history-small-btn{
    font-size:10px;
    padding:6px 7px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🧶 Krystal 的毛线研究室</div>
  <div class="subtitle">甜甜配色 · 今天抽到什么呢？</div>
</header>

<!-- ================= TOP RIGHT NAV ================= -->

<div class="nav">

  <button id="navDraw"
    class="active"
    onclick="showPage('draw')">
    🎰 抽取
  </button>

  <button id="navHistory"
    onclick="showPage('history')">
    📖 历史
  </button>

  <button id="navSettings"
    onclick="showPage('settings')">
    ⚙️ 设置
  </button>

</div>

<!-- ================= DRAW PAGE ================= -->

<section id="drawPage" class="page active">

<div class="container">

  <div class="order-box">

    <div class="order-title">
      💗 订单号
    </div>

    <input
      id="orderInput"
      class="order-input"
      type="text"
      placeholder="请输入订单号"
      autocomplete="off"
    >

    <button
      class="history-small-btn"
      onclick="showPage('history')">
      📖 历史
    </button>

  </div>

  <div class="draw-controls">

    <button
      id="startAllBtn"
      class="main-btn"
      onclick="startAll()">
      🎰 全部开始
    </button>

    <button
      id="stopAllBtn"
      class="stop-all-btn"
      onclick="stopAll()">
      🛑 全部停止
    </button>

  </div>

  <div class="machine-scroll">
    <div id="machineGrid" class="machine-grid"></div>
  </div>

</div>

</section>

<!-- ================= HISTORY PAGE ================= -->

<section id="historyPage" class="page">

  <div class="settings-container">

    <div id="historyContent"></div>

  </div>

</section>

<!-- ================= SETTINGS PAGE ================= -->

<section id="settingsPage" class="page">

  <div class="settings-container">

    <div id="settingsContent"></div>

  </div>

</section>

<!-- ================= RESULT ================= -->

<div id="resultModal" class="modal">

  <div class="result-box">

    <div class="result-title">
      🎀 抽取结果
    </div>

    <div id="resultOrder" class="result-order"></div>

    <div id="resultList" class="result-list"></div>

    <button
      class="confirm-btn"
      onclick="confirmResult()">
      💗 确认
    </button>

  </div>

</div>

<script>

/* =====================================================
DEFAULT DATA
===================================================== */

const DEFAULT_DATA={

  styles:[
    {id:"style_basic",name:"基础款",image:"",photoOnly:false,stock:999},
    {id:"style_bag",name:"小花包",image:"",photoOnly:false,stock:999},
    {id:"style_cloud",name:"云朵包",image:"",photoOnly:false,stock:999}
  ],

  mainColors:[
    {id:"main_red",name:"大红色",image:"",photoOnly:false,stock:5},
    {id:"main_wine",name:"酒红色",image:"",photoOnly:false,stock:5},
    {id:"main_cream",name:"米白色",image:"",photoOnly:false,stock:5},
    {id:"main_green",name:"牛油果绿",image:"",photoOnly:false,stock:5},
    {id:"main_gray",name:"浅灰色",image:"",photoOnly:false,stock:5},
    {id:"main_gold",name:"金黄色",image:"",photoOnly:false,stock:5},
    {id:"main_orange",name:"橘黄色",image:"",photoOnly:false,stock:5},
    {id:"main_rose",name:"玫红色",image:"",photoOnly:false,stock:5},
    {id:"main_pinkdark",name:"深粉色",image:"",photoOnly:false,stock:5},
    {id:"main_pink",name:"浅粉色",image:"",photoOnly:false,stock:5},
    {id:"main_purple",name:"浅紫色",image:"",photoOnly:false,stock:5},
    {id:"main_beige",name:"米黄色",image:"",photoOnly:false,stock:5}
  ],

  secondaryColors:[
    {id:"sub_white",name:"白色",image:"",photoOnly:false,stock:5},
    {id:"sub_pink",name:"粉色",image:"",photoOnly:false,stock:5},
    {id:"sub_red",name:"红色",image:"",photoOnly:false,stock:5},
    {id:"sub_purple",name:"紫色",image:"",photoOnly:false,stock:5},
    {id:"sub_yellow",name:"黄色",image:"",photoOnly:false,stock:5},
    {id:"sub_orange",name:"橘色",image:"",photoOnly:false,stock:5},
    {id:"sub_brown",name:"棕色",image:"",photoOnly:false,stock:5}
  ],

  mainButtons:[
    {id:"button_red",name:"红色主扣",image:"",photoOnly:false,stock:5},
    {id:"button_white",name:"白色主扣",image:"",photoOnly:false,stock:5},
    {id:"button_purple",name:"紫色主扣",image:"",photoOnly:false,stock:5},
    {id:"button_yellow",name:"黄色主扣",image:"",photoOnly:false,stock:5},
    {id:"button_orange",name:"橘色主扣",image:"",photoOnly:false,stock:5},
    {id:"button_brown",name:"棕色主扣",image:"",photoOnly:false,stock:5}
  ],

  charms:[
    {id:"charm_star",name:"星星",image:"",photoOnly:false,stock:5},
    {id:"charm_flower",name:"小花",image:"",photoOnly:false,stock:5},
    {id:"charm_heart",name:"爱心",image:"",photoOnly:false,stock:5},
    {id:"charm_bear",name:"小熊",image:"",photoOnly:false,stock:5},
    {id:"charm_pearl",name:"珍珠",image:"",photoOnly:false,stock:5}
  ],

  rules:{
    styleMain:{},
    styleButtons:{},
    styleCharms:{},
    mainSecondary:{}
  }

};

/* =====================================================
DATA
===================================================== */

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function createId(){
  return "id_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

function loadData(){

  const saved=localStorage.getItem("krystal_slot_machine");

  if(!saved){

    const fresh=clone(DEFAULT_DATA);
    fresh.history=[];
    return fresh;

  }

  try{

    const data=JSON.parse(saved);

    [
      "styles",
      "mainColors",
      "secondaryColors",
      "mainButtons",
      "charms"
    ].forEach(category=>{

      if(!Array.isArray(data[category])){
        data[category]=clone(DEFAULT_DATA[category]);
      }

      data[category].forEach(item=>{

        if(item.stock===undefined) item.stock=5;
        if(item.image===undefined) item.image="";
        if(item.photoOnly===undefined) item.photoOnly=false;

      });

    });

    if(!data.rules){
      data.rules=clone(DEFAULT_DATA.rules);
    }

    if(!Array.isArray(data.history)){
      data.history=[];
    }

    return data;

  }catch(e){

    const fresh=clone(DEFAULT_DATA);
    fresh.history=[];
    return fresh;

  }
}

let data=loadData();

function saveData(){

  localStorage.setItem(
    "krystal_slot_machine",

  );

}

/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(text){

  return String(text??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =====================================================
VISUAL
===================================================== */

function visualHTML(item){

  if(item.image){

    return `
      <div class="reel-item-inner">
        <img src="${item.image}" alt="">
      </div>
    `;

  }

  return `
    <div class="reel-item-inner">
      <div class="reel-text">
        ${escapeHTML(item.name)}
      </div>
    </div>
  `;

}

function resultVisualHTML(item){

  if(item.image){

    return `
      <div class="result-visual">
        <img src="${item.image}" alt="">
      </div>
    `;

  }

  return `
    <div class="result-visual">
      <div class="reel-text">
        ${escapeHTML(item.name)}
      </div>
    </div>
  `;

}

/* =====================================================
RULES
===================================================== */

function getRule(ruleObj,key){

  if(
    ruleObj &&
    Array.isArray(ruleObj[key]) &&
    ruleObj[key].length>0
  ){
    return ruleObj[key];
  }

  return null;
}

function getVisualPool(slot,context={}){

  let list=[];

  if(slot==="style"){
    list=data.styles;
  }

  if(slot==="mainColor"){

    list=data.mainColors;

    const allowed=getRule(
      data.rules.styleMain,
      context.style
    );

    if(allowed){
      list=list.filter(x=>allowed.includes(x.id));
    }

  }

  if(slot==="secondaryColor"){

    list=data.secondaryColors;

    const allowed=getRule(
      data.rules.mainSecondary,
      context.mainColor
    );

    if(allowed){
      list=list.filter(x=>allowed.includes(x.id));
    }

  }

  if(slot==="mainButton" || slot==="subButton"){

    list=data.mainButtons;

    const allowed=getRule(
      data.rules.styleButtons,
      context.style
    );

    if(allowed){
      list=list.filter(x=>allowed.includes(x.id));
    }

  }

  if(slot==="charm"){

    list=data.charms;

    const allowed=getRule(
      data.rules.styleCharms,
      context.style
    );

    if(allowed){
      list=list.filter(x=>allowed.includes(x.id));
    }

  }

  return list;
}

function getAvailablePool(slot,context={}){

  return getVisualPool(slot,context)
    .filter(item=>Number(item.stock)>0);

}

/* =====================================================
SLOTS
===================================================== */

const SLOTS=[

  {key:"style",title:"款式"},
  {key:"mainColor",title:"线材主色"},
  {key:"secondaryColor",title:"线材配色"},
  {key:"mainButton",title:"主扣"},
  {key:"subButton",title:"副扣"},
  {key:"charm",title:"小吊饰"}

];

const machineState={};

let finalResult=null;
let isRunning=false;
let currentOrder="";

/* =====================================================
RENDER REELS
===================================================== */

function renderReels(){

  const grid=document.getElementById("machineGrid");

  if(!grid) return;

  grid.innerHTML="";

  SLOTS.forEach(slot=>{

    const machine=document.createElement("div");

    machine.className="machine";

    machine.innerHTML=`

      <div class="machine-title">
        ${slot.title}
      </div>

      <div class="reel-window">

        <div
          class="reel-track"
          id="track_${slot.key}">
        </div>

        <div class="reel-middle"></div>

      </div>

      </button>

    `;

    grid.appendChild(machine);

    setupMachine(slot.key);

  });

/* =====================================================
SETUP
===================================================== */

function setupMachine(key){

  const track=document.getElementById("track_"+key);

  const pool=getVisualPool(key,{});

  if(!pool.length){

    track.innerHTML=`
      <div class="reel-item">
        <div class="reel-item-inner">
          <div class="reel-text">暂无内容</div>
        </div>
      </div>
    `;

    machineState[key]={
      running:false,
      offset:0,
      timer:null
    };

    return;
  }

  let html="";

  for(let i=0;i<100;i++){

    const item=pool[i%pool.length];

    html+=`
      <div class="reel-item">
        ${visualHTML(item)}
      </div>
    `;

  }

  track.innerHTML=html;

  track.style.transform="translateY(0px)";

  machineState[key]={
    running:false,
    offset:0,
    timer:null
  };

}

/* =====================================================
RANDOM
===================================================== */

function randomItem(list){

  if(!list || !list.length){
    return null;
  }

  return list[
    Math.floor(Math.random()*list.length)
  ];

}

/* =====================================================
FINAL RESULT
===================================================== */

function generateFinalResult(){

  const style=randomItem(
    getAvailablePool("style")
  );

  if(!style){

    alert("目前没有可抽取的款式库存。");
    return null;

  }

  const mainColor=randomItem(
    getAvailablePool(
      "mainColor",
      {style:style.id}
    )
  );

  if(!mainColor){

    alert("目前没有符合条件的主色库存。");
    return null;

  }

  const secondaryColor=randomItem(
    getAvailablePool(
      "secondaryColor",
      {mainColor:mainColor.id}
    )
  );

  if(!secondaryColor){

    alert("目前没有符合条件的配色库存。");
    return null;

  }

  const buttonPool=getAvailablePool(
    "mainButton",
    {style:style.id}
  );

  if(buttonPool.length===0){

    alert("目前没有主扣库存。");
    return null;

  }

  const mainButton=randomItem(buttonPool);
  const subButton=randomItem(buttonPool);

  const charm=randomItem(
    getAvailablePool(
      "charm",
      {style:style.id}
    )
  );

  if(!charm){

    alert("目前没有小吊饰库存。");
    return null;

  }

  return{
    style,
    mainColor,
    secondaryColor,
    mainButton,
    subButton,
    charm
  };

}

/* =====================================================
START
===================================================== */

function startAll(){

  const orderInput=document.getElementById("orderInput");

  const order=orderInput.value.trim();

  if(!order){

    alert("💗 请先输入订单号");

    orderInput.focus();

    return;

  }

  if(isRunning){
    return;
  }

  const result=generateFinalResult();

  if(!result){
    return;
  }

  currentOrder=order;
  finalResult=result;
  isRunning=true;

  document.getElementById("startAllBtn").disabled=true;

  document.querySelectorAll(".machine-stop")
    .forEach(btn=>{
      btn.disabled=false;
    });

  SLOTS.forEach(slot=>{

    startSlot(
      slot.key,
      {
        style:result.style.id,
        mainColor:result.mainColor.id
      }
    );

  });

}

/* =====================================================
INFINITE SPIN
===================================================== */

function startSlot(key,context){

  const track=document.getElementById("track_"+key);

  const pool=getVisualPool(key,context);

  if(!pool.length){
    return;
  }

  const state=machineState[key];

  state.running=true;

  let position=state.offset||0;

  track.style.transition="none";

  function animate(){

    if(!state.running){
      return;
    }

    position-=10;

    track.style.transform=
      `translateY(${position}px)`;

    state.offset=position;

    state.timer=requestAnimationFrame(animate);

  }

  animate();

}

/* =====================================================
STOP SINGLE
===================================================== */

function stopSingle(key){

  const state=machineState[key];

  if(!state || !state.running){
    return;
  }

  const resultItem=finalResult[key];

  if(!resultItem){
    return;
  }

  state.running=false;

  cancelAnimationFrame(state.timer);

  const track=document.getElementById("track_"+key);

  const item=track.parentElement.querySelector(".reel-item");

  const itemHeight=item.offsetHeight;

  const pool=getVisualPool(
    key,
    {
      style:finalResult.style.id,
      mainColor:finalResult.mainColor.id
    }
  );

  let targetIndex=pool.findIndex(
    x=>x.id===resultItem.id
  );

  if(targetIndex<0){
    targetIndex=0;
  }

  const reelWindow=track.parentElement;

  const windowCenter=reelWindow.clientHeight/2;

  const itemCenter=itemHeight/2;

  const targetY=
    windowCenter-
    itemCenter-
    targetIndex*itemHeight;

  const extraLoops=
    itemHeight*pool.length*3;

  const finalY=targetY-extraLoops;

  track.style.transition=
    "transform 1.3s cubic-bezier(.15,.75,.25,1)";

  track.style.transform=
    `translateY(${finalY}px)`;

  state.offset=finalY;

  const stopBtn=document.getElementById("stop_"+key);

  if(stopBtn){
    stopBtn.disabled=true;
  }

  setTimeout(()=>{
    checkAllStopped();
  },1350);

}

/* =====================================================
STOP ALL
===================================================== */

function stopAll(){

  if(!isRunning){
    return;
  }

  SLOTS.forEach(slot=>{

    if(
      machineState[slot.key] &&
      machineState[slot.key].running
    ){

      stopSingle(slot.key);

    }

  });

}

/* =====================================================
CHECK
===================================================== */

function checkAllStopped(){

  const stillRunning=SLOTS.some(slot=>
    machineState[slot.key] &&
    machineState[slot.key].running
  );

  if(stillRunning){
    return;
  }

  isRunning=false;

  document.getElementById("startAllBtn").disabled=false;

  document.querySelectorAll(".machine-stop")
    .forEach(btn=>{
      btn.disabled=true;
    });

  showResult();

}

RESULT

/* =====================================================
CONFIRM
===================================================== */

function confirmResult(){

  if(!finalResult){
    return;
  }

  decreaseStock("styles",finalResult.style.id);

  decreaseStock("mainColors",finalResult.mainColor.id);

  decreaseStock(
    "secondaryColors",
    finalResult.secondaryColor.id
  );

  decreaseStock(
    "mainButtons",
    finalResult.mainButton.id
  );

  decreaseStock(
    "mainButtons",
    finalResult.subButton.id
  );

  decreaseStock(
    "charms",
    finalResult.charm.id
  );

  if(!Array.isArray(data.history)){
    data.history=[];
  }

  data.history.unshift({

    id:createId(),

    order:currentOrder,

    time:new Date().toLocaleString(
      "zh-CN",
      {
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    ),

    result:{

      style:{
        id:finalResult.style.id,
        name:finalResult.style.name,
        image:finalResult.style.image
      },

      mainColor:{
        id:finalResult.mainColor.id,
        name:finalResult.mainColor.name,
        image:finalResult.mainColor.image
      },

      secondaryColor:{
        id:finalResult.secondaryColor.id,
        name:finalResult.secondaryColor.name,
        image:finalResult.secondaryColor.image
      },

      mainButton:{
        id:finalResult.mainButton.id,
        name:finalResult.mainButton.name,
        image:finalResult.mainButton.image
      },

      subButton:{
        id:finalResult.subButton.id,
        name:finalResult.subButton.name,
        image:finalResult.subButton.image
      },

      charm:{
        id:finalResult.charm.id,
        name:finalResult.charm.name,
        image:finalResult.charm.image
      }

    }

  });

  saveData();

  document.getElementById("resultModal")
    .classList.remove("show");

  finalResult=null;

  renderReels();

}

function decreaseStock(category,id){

  if(!item){

  }

  item.stock=Math.max(
    0,
    Number(item.stock)-1
  );

}

/* =====================================================
ADD
===================================================== */

function addItem(category){

  const input=document.getElementById(
    "add_"+category
  );

  const name=input.value.trim();

  if(!name){

    alert("请输入名称");
    return;

  }

  data[category].push({

    id:createId(),
    name:name,
    image:"",
    photoOnly:false,
    stock:5

  });

  input.value="";

  saveData();

  renderSettings();

}

/* =====================================================
DELETE
===================================================== */

function deleteItem(category,id){

  const item=data[category].find(x=>x.id===id);

  if(!item){
    return;
  }

  if(!confirm(
    `确定要删除「${item.name}」吗？`
  )){
    return;
  }

  data[category]=data[category].filter(
    x=>x.id!==id
  );

  Object.keys(data.rules).forEach(ruleGroup=>{

    Object.keys(data.rules[ruleGroup]).forEach(key=>{

      data.rules[ruleGroup][key]=
        data.rules[ruleGroup][key].filter(
          x=>x!==id
        );

    });

  });

  saveData();

  renderSettings();

}

/* =====================================================
PHOTO
===================================================== */

function uploadPhoto(category,id){

  const input=document.createElement("input");

  input.type="file";
  input.accept="image/*";

  input.onchange=function(){

    const file=input.files[0];

    if(!file){
      return;
    }

    const reader=new FileReader();

    reader.onload=function(e){

      const item=data[category].find(
        x=>x.id===id
      );

      if(!item){
        return;
      }

      item.image=e.target.result;

      saveData();

      renderSettings();

    };

    reader.readAsDataURL(file);

  };

  input.click();

}

function removePhoto(category,id){

  const item=data[category].find(
    x=>x.id===id
  );

  if(!item){
    return;
  }

  item.image="";
  item.photoOnly=false;

  saveData();

  renderSettings();

}

function togglePhotoOnly(category,id,checked){

  const item=data[category].find(
    x=>x.id===id
  );

  if(!item){
    return;
  }

  item.photoOnly=checked;

  saveData();

}

/* =====================================================
STOCK
===================================================== */

function changeStock(category,id,amount){

  const item=data[category].find(
    x=>x.id===id
  );

  if(!item){
    return;
  }

  item.stock=Math.max(
    0,
    Number(item.stock||0)+amount
  );

  saveData();

  renderSettings();

}

function setStock(category,id,value){

  const item=data[category].find(
    x=>x.id===id
  );

  if(!item){
    return;
  }

  item.stock=Math.max(
    0,
    parseInt(value)||0
  );

  saveData();

  renderSettings();

}

function renderRuleGroup(
  elementId,
  parents,
  children,
  ruleObject
){

  const box=document.getElementById(elementId);

  box.innerHTML="";

  parents.forEach(parent=>{

    const group=document.createElement("div");

    group.style.width="100%";
    group.style.marginBottom="8px";

    const current=ruleObject[parent.id]||[];

    let html=`

      <div style="
        font-size:12px;
        color:#a56d7e;
        margin-bottom:5px;
      ">
        ${escapeHTML(parent.name)}
      </div>

      <div style="
        display:flex;
        flex-wrap:wrap;
        gap:5px;
      ">

    `;

    children.forEach(child=>{

      const checked=current.includes(child.id);

      html+=`

        <label class="rule-option">

          <input
            type="checkbox"
            ${checked?"checked":""}
            onchange="
              toggleRule(
                '${elementId}',
                '${parent.id}',
                '${child.id}',
                this.checked
              )
            ">

          ${escapeHTML(child.name)}

        </label>

      `;

    });

    html+=`</div>`;

    group.innerHTML=html;

    box.appendChild(group);

  });

}

function toggleRule(
  elementId,
  parentId,
  childId,
  checked
){

  let ruleName="";

  if(elementId==="rule_styleMain"){
    ruleName="styleMain";
  }

  if(elementId==="rule_styleButtons"){
    ruleName="styleButtons";
  }

  if(elementId==="rule_styleCharms"){
    ruleName="styleCharms";
  }

  if(elementId==="rule_mainSecondary"){
    ruleName="mainSecondary";
  }

  if(!ruleName){
    return;
  }

  if(!data.rules[ruleName][parentId]){
    data.rules[ruleName][parentId]=[];
  }

  let arr=data.rules[ruleName][parentId];

  if(checked){

    if(!arr.includes(childId)){
      arr.push(childId);
    }

  }else{

    arr=arr.filter(x=>x!==childId);

    data.rules[ruleName][parentId]=arr;

  }

  saveData();

}

/* =====================================================
HISTORY PAGE
===================================================== */

function renderHistory(){

  const container=
    document.getElementById("historyContent");

  if(!container){
    return;
  }

  container.innerHTML="";

  const card=document.createElement("div");

  card.className="history-card";

  card.innerHTML=`

    <div class="history-head">

      <div class="history-title">
        📖 抽取历史记录
      </div>

      ${
        data.history.length
        ?
        `
        <button
          class="clear-history"
          onclick="clearHistory()">
          清空记录
        </button>
        `
        :
        ""
      }

    </div>

    <div id="historyList"></div>

  `;

  container.appendChild(card);

  const list=document.getElementById("historyList");

  if(!data.history.length){

    list.innerHTML=`

      <div class="empty">
        还没有抽取记录 💗
      </div>

    `;

    return;

  }

  data.history.forEach(record=>{

    const item=document.createElement("div");

    item.className="history-item";

    const result=record.result;

    item.innerHTML=`

      <div class="history-head">

        <div class="history-order">
          📦 ${escapeHTML(record.order)}
        </div>

        <div class="history-time">
          ${escapeHTML(record.time)}
        </div>

      </div>

      <div class="history-results">

        ${historyResult("款式",result.style)}

        ${historyResult("主色",result.mainColor)}

        ${historyResult("配色",result.secondaryColor)}

        ${historyResult("主扣",result.mainButton)}

        ${historyResult("副扣",result.subButton)}

        ${historyResult("吊饰",result.charm)}

      </div>

      <button
        class="history-delete"
        onclick="deleteHistory('${record.id}')">
        删除这条记录
      </button>

    `;

    list.appendChild(item);

  });

}

function historyResult(label,item){

  return `

    <div class="history-result">

      <div class="history-label">
        ${label}
      </div>

      ${
        item.image
        ?
        `
        <img
          src="${item.image}"
          style="
            width:42px;
            height:42px;
            object-fit:cover;
            border-radius:8px;
            display:block;
            margin-bottom:3px;
          ">
        `
        :
        ""
      }

      ${escapeHTML(item.name)}

    </div>

  `;

}

function deleteHistory(id){

  data.history=data.history.filter(
    x=>x.id!==id
  );

  saveData();

  renderHistory();

}

function clearHistory(){

  if(!data.history.length){
    return;
  }

  if(!confirm(
    "确定要清空全部历史记录吗？"
  )){
    return;
  }

  data.history=[];

  saveData();

  renderHistory();

}
