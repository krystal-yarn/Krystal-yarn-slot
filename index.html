<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krystal 的毛线研究室｜老虎机</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

:root{
  --pink:#ff9fbd;
  --deep-pink:#ed789e;
  --light-pink:#fff0f5;
  --cream:#fffaf5;
  --text:#705b64;
  --muted:#aa8d97;
  --border:#f1d2dc;
  --white:#fff;
  --shadow:0 8px 28px rgba(225,145,170,.16);
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(circle at 10% 10%,#fff0f5 0 7%,transparent 8%),
    radial-gradient(circle at 90% 20%,#fff4dc 0 6%,transparent 7%),
    linear-gradient(180deg,#fff9fb,#fffaf5);

  color:var(--text);

  font-family:
    "ZCOOL KuaiLe",
    "STYuanti-SC",
    "Yuanti SC",
    "Hannotate SC",
    "Hiragino Maru Gothic ProN",
    "Arial Rounded MT Bold",
    "PingFang SC",
    sans-serif;
}

/* ==============================
HEADER
============================== */

header{
  position:sticky;
  top:0;
  z-index:100;

  background:rgba(255,250,252,.96);
  backdrop-filter:blur(12px);

  border-bottom:1px solid #f5dce4;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  color:#df7899;
  font-size:24px;
  white-space:nowrap;
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.nav button{
  border:1px solid var(--border);
  background:white;
  color:var(--text);

  border-radius:999px;
  padding:9px 15px;

  font:inherit;
  cursor:pointer;

  transition:.2s;
}

.nav button:hover{
  transform:translateY(-2px);
  background:#fff0f5;
}

.nav button.active{
  background:var(--pink);
  color:white;
  border-color:var(--pink);
}

/* ==============================
MAIN
============================== */

main{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 80px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  text-align:center;
  margin-bottom:28px;
}

.page-title h1{
  margin:0;
  color:#df7899;
  font-size:36px;
}

.page-title p{
  margin:8px 0 0;
  color:var(--muted);
}

/* ==============================
DRAW
============================== */

.draw-panel{
  background:rgba(255,255,255,.92);
  border:2px solid #f5d9e2;
  border-radius:28px;
  padding:24px;
  box-shadow:var(--shadow);
}

.machine-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.machine{
  background:#fffafb;
  border:2px solid #f4dce4;
  border-radius:23px;
  padding:15px;
  text-align:center;
}

.machine-title{
  color:#d97898;
  font-size:20px;
  margin-bottom:12px;
}

.reel-window{
  position:relative;
  height:270px;
  overflow:hidden;

  background:#fff;
  border:2px solid #efd0db;
  border-radius:18px;
}

.reel-window::after{
  content:"";

  position:absolute;
  z-index:20;

  left:0;
  right:0;
  top:90px;

  height:90px;

  border-top:3px solid #ff9fbd;
  border-bottom:3px solid #ff9fbd;

  background:rgba(255,170,195,.08);

  pointer-events:none;
}

.reel{
  position:absolute;
  left:0;
  top:0;

  width:100%;

  will-change:transform;
}

.reel-item{
  height:90px;
  width:100%;

  display:flex;
  justify-content:center;
  align-items:center;
}

.reel-visual{
  width:72px;
  height:72px;

  border-radius:16px;
  border:2px solid #efd2dc;

  background:#fff4f7;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  color:#d67b98;
  font-size:15px;
  line-height:1.2;

  text-align:center;
  padding:6px;
}

.reel-visual img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.machine-buttons{
  margin-top:11px;
}

.stop-one{
  width:100%;

  border:none;
  border-radius:999px;

  padding:9px;

  background:#ffe3ec;
  color:#cb6e8d;

  font:inherit;
  cursor:pointer;
}

.stop-one:hover{
  background:#ffd2df;
}

.main-controls{
  margin-top:26px;

  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.main-controls button{
  border:none;
  border-radius:999px;

  padding:14px 30px;

  font:inherit;
  font-size:18px;

  cursor:pointer;
}

.start-btn{
  background:#ff9fbd;
  color:white;
  box-shadow:0 6px 15px rgba(235,130,160,.2);
}

.stop-all-btn{
  background:#ffe2eb;
  color:#c76b89;
}

/* ==============================
RESULT MODAL
============================== */

.modal-overlay{
  position:fixed;
  inset:0;

  z-index:500;

  background:rgba(93,62,73,.35);
  backdrop-filter:blur(5px);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal-overlay.show{
  display:flex;
}

.result-modal{
  width:min(680px,100%);
  max-height:90vh;
  overflow:auto;

  background:#fffafb;

  border:3px solid #f4ccd9;
  border-radius:28px;

  padding:25px;

  box-shadow:0 20px 60px rgba(120,70,90,.22);

  animation:popIn .25s ease;
}

@keyframes popIn{
  from{
    opacity:0;
    transform:scale(.92) translateY(15px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.result-modal-title{
  text-align:center;
  color:#df7899;
  font-size:29px;
  margin-bottom:20px;
}

.order-input-box{
  background:#fff0f5;
  border-radius:18px;
  padding:15px;
  margin-bottom:18px;
}

.order-input-box label{
  display:block;
  color:#b5798b;
  margin-bottom:7px;
}

.order-input{
  width:100%;

  border:2px solid #f0c8d5;
  border-radius:13px;

  padding:11px 13px;

  background:white;

  font:inherit;
  color:var(--text);

  font-size:18px;
}

.result-list{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.result-row{
  min-height:88px;

  background:white;

  border:1px solid #efd6df;
  border-radius:18px;

  padding:9px 13px;

  display:flex;
  align-items:center;
  gap:14px;
}

.result-row-visual{
  width:68px;
  height:68px;
  min-width:68px;

  border-radius:14px;

  background:#fff2f6;
  border:2px solid #efd2dc;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;

  text-align:center;
  color:#d27a96;

  padding:5px;
}

.result-row-visual img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.result-row-info{
  flex:1;
}

.result-row-title{
  font-size:14px;
  color:#b08491;
  margin-bottom:4px;
}

.result-row-name{
  font-size:19px;
  color:#715962;
}

.modal-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:22px;
}

.confirm-btn{
  border:none;
  border-radius:999px;

  background:#f58cab;
  color:white;

  padding:13px 35px;

  font:inherit;
  font-size:18px;

  cursor:pointer;
}

.cancel-btn{
  border:none;
  border-radius:999px;

  background:#ffe5ed;
  color:#c86f8b;

  padding:13px 25px;

  font:inherit;

  cursor:pointer;
}

/* ==============================
SETTINGS
============================== */

.settings-section{
  background:rgba(255,255,255,.94);

  border:2px solid #f4d9e2;
  border-radius:25px;

  padding:22px;
  margin-bottom:24px;

  box-shadow:var(--shadow);
}

.settings-section h2{
  margin-top:0;
  color:#dc7898;
}

.add-box{
  background:#fff6fa;

  border:1px dashed #efbdce;
  border-radius:18px;

  padding:17px;
  margin-bottom:18px;
}

.add-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

input[type=text],
input[type=number]{
  border:1px solid #e3c5d0;
  border-radius:12px;

  padding:10px 12px;

  background:white;

  font:inherit;
  color:var(--text);
}

input[type=text]{
  min-width:190px;
}

input[type=number]{
  width:70px;
  text-align:center;
}

input[type=file]{
  max-width:240px;
  font-family:inherit;
}

.add-button{
  border:none;
  border-radius:999px;

  background:#ffabc5;
  color:white;

  padding:10px 17px;

  font:inherit;
  cursor:pointer;
}

.photo-only-label{
  display:inline-flex;
  align-items:center;
  gap:5px;

  font-size:14px;
  cursor:pointer;
}

.items-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.manage-card{
  background:#fffafb;

  border:1px solid #efd5de;
  border-radius:19px;

  padding:14px;
}

.manage-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.manage-visual{
  width:80px;
  height:80px;
  min-width:80px;

  border-radius:15px;
  border:2px solid #efd2dc;

  background:#fff2f6;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  color:#d27a96;
  font-size:15px;
  line-height:1.2;

  padding:5px;
}

.manage-visual img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.manage-info{
  flex:1;
}

.manage-name{
  color:#765d66;
  font-size:18px;
  margin-bottom:5px;
}

.delete-btn{
  border:none;
  border-radius:999px;

  background:#ffe7ee;
  color:#d06e8d;

  padding:7px 11px;

  font:inherit;
  cursor:pointer;
}

/* ==============================
PHOTO CHANGE
============================== */

.photo-tools{
  margin-top:12px;

  padding-top:11px;

  border-top:1px dashed #efd6df;

  display:flex;
  flex-wrap:wrap;
  gap:7px;
  align-items:center;
}

.photo-change-btn,
.photo-delete-btn{
  border:none;
  border-radius:999px;

  padding:7px 12px;

  font:inherit;
  font-size:13px;

  cursor:pointer;
}

.photo-change-btn{
  background:#ffe1eb;
  color:#c96987;
}

.photo-delete-btn{
  background:#f4edf0;
  color:#997d86;
}

/* ==============================
STOCK
============================== */

.stock-box{
  margin-top:12px;

  background:white;

  border:1px solid #eed3dc;
  border-radius:15px;

  padding:10px 12px;
}

.stock-title{
  color:#9d7480;
  font-size:14px;
  margin-bottom:6px;
}

.stock-control{
  display:flex;
  align-items:center;
  gap:7px;
}

.stock-control button{
  width:32px;
  height:32px;

  border:none;
  border-radius:50%;

  background:#ffe0e9;
  color:#c96685;

  font-size:20px;
  cursor:pointer;
}

.stock-control input{
  width:65px;
  height:32px;

  padding:2px;

  font-size:16px;
}

.stock-status{
  font-size:13px;
  margin-left:5px;
}

.stock-ok{
  color:#68a780;
}

.stock-zero{
  color:#d27d7d;
}

/* ==============================
RULES
============================== */

.rules-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.rule-box{
  border:1px solid #efd5de;
  border-radius:17px;

  padding:15px;

  background:#fffafb;
}

.rule-box h3{
  margin-top:0;
  color:#bd7c8e;
}

.checkbox-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.checkbox-item{
  background:white;

  border:1px solid #ecd1da;
  border-radius:999px;

  padding:6px 9px;

  font-size:13px;
}

.save-rules{
  margin-top:20px;

  border:none;
  border-radius:999px;

  background:#ff9fbd;
  color:white;

  padding:12px 25px;

  font:inherit;
  cursor:pointer;
}

/* ==============================
HISTORY
============================== */

.history-empty{
  padding:25px;
  text-align:center;
  color:#ae929b;
}

.history-list{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.history-card{
  background:#fffafb;

  border:1px solid #efd5de;
  border-radius:20px;

  padding:17px;
}

.history-header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:10px;

  margin-bottom:13px;
}

.history-order{
  color:#dc7898;
  font-size:22px;
}

.history-time{
  color:#ad919a;
  font-size:12px;
}

.history-items{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.history-item{
  background:white;

  border:1px solid #f0d9e1;
  border-radius:15px;

  padding:8px;

  text-align:center;
}

.history-item-visual{
  width:65px;
  height:65px;

  margin:auto;

  border-radius:12px;

  overflow:hidden;

  border:1px solid #eed3dc;

  background:#fff3f7;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#d17b96;

  font-size:13px;

  padding:4px;
}

.history-item-visual img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.history-item-title{
  color:#a9828d;
  font-size:12px;
  margin-top:5px;
}

.history-item-name{
  color:#715b64;
  font-size:14px;
  margin-top:2px;
}

/* ==============================
RESPONSIVE
============================== */

@media(max-width:900px){

  .machine-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .items-list{
    grid-template-columns:1fr;
  }

  .history-items{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  .header-inner{
    flex-direction:column;
  }

  .machine-grid{
    grid-template-columns:1fr;
  }

  .rules-grid{
    grid-template-columns:1fr;
  }

  .history-items{
    grid-template-columns:repeat(2,1fr);
  }

  .page-title h1{
    font-size:29px;
  }

}

</style>
</head>


<body>

<header>

  <div class="header-inner">

    <div class="logo">
      🧶 Krystal 的毛线研究室
    </div>

    <div class="nav">

      <button
        id="navDraw"
        class="active"
        onclick="showPage('draw')">
        🎰 开始抽取
      </button>

      <button
        id="navSettings"
        onclick="showPage('settings')">
        ⚙️ 页面设置
      </button>

      <button
        id="navHistory"
        onclick="showPage('history')">
        📖 历史记录
      </button>

    </div>

  </div>

</header>


<main>


<!-- ==================================================
DRAW PAGE
================================================== -->

<section
  id="drawPage"
  class="page active">

  <div class="page-title">

    <h1>
      🎰 毛线研究室老虎机
    </h1>

    <p>
      今天的组合，会是什么呢？
    </p>

  </div>


  <div class="draw-panel">

    <div class="machine-grid">


      <!-- 款式 -->

      <div class="machine">

        <div class="machine-title">
          👜 款式
        </div>

        <div class="reel-window">

          <div
            id="reel-style"
            class="reel">
          </div>

        </div>

        <div class="machine-buttons">

          <button
            class="stop-one"
            onclick="stopSingle('style')">
            单独停止
          </button>

        </div>

      </div>


      <!-- 主色 -->

      <div class="machine">

        <div class="machine-title">
          🎨 线材主色
        </div>

        <div class="reel-window">

          <div
            id="reel-mainColor"
            class="reel">
          </div>

        </div>

        <div class="machine-buttons">

          <button
            class="stop-one"
            onclick="stopSingle('mainColor')">
            单独停止
          </button>

        </div>

      </div>


      <!-- 配色 -->

      <div class="machine">

        <div class="machine-title">
          🌈 线材配色
        </div>

        <div class="reel-window">

          <div
            id="reel-secondaryColor"
            class="reel">
          </div>

        </div>

        <div class="machine-buttons">

          <button
            class="stop-one"
            onclick="stopSingle('secondaryColor')">
            单独停止
          </button>

        </div>

      </div>


      <!-- 主扣 -->

      <div class="machine">

        <div class="machine-title">
          🎀 主扣
        </div>

        <div class="reel-window">

          <div
            id="reel-mainButton"
            class="reel">
          </div>

        </div>

        <div class="machine-buttons">

          <button
            class="stop-one"
            onclick="stopSingle('mainButton')">
            单独停止
          </button>

        </div>

      </div>


      <!-- 副扣 -->

      <div class="machine">

        <div class="machine-title">
          🎀 副扣
        </div>

        <div class="reel-window">

          <div
            id="reel-subButton"
            class="reel">
          </div>

        </div>

        <div class="machine-buttons">

          <button
            class="stop-one"
            onclick="stopSingle('subButton')">
            单独停止
          </button>

        </div>

      </div>


      <!-- 吊饰 -->

      <div class="machine">

        <div class="machine-title">
          ✨ 小吊饰
        </div>

        <div class="reel-window">

          <div
            id="reel-charm"
            class="reel">
          </div>

        </div>

        <div class="machine-buttons">

          <button
            class="stop-one"
            onclick="stopSingle('charm')">
            单独停止
          </button>

        </div>

      </div>

    </div>


    <div class="main-controls">

      <button
        class="start-btn"
        onclick="startAll()">
        🎰 全部开始
      </button>

      <button
        class="stop-all-btn"
        onclick="stopAll()">
        🛑 全部停止
      </button>

    </div>

  </div>

</section>


<!-- ==================================================
SETTINGS PAGE
================================================== -->

<section
  id="settingsPage"
  class="page">

  <div class="page-title">

    <h1>
      ⚙️ 页面设置
    </h1>

    <p>
      管理照片、库存和抽取规则
    </p>

  </div>


  <!-- STYLES -->

  <div class="settings-section">

    <h2>
      👜 款式管理
    </h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="styleName"
          type="text"
          placeholder="例如：蝴蝶结包">

        <input
          id="styleImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">

          <input
            id="stylePhotoOnly"
            type="checkbox">

          只显示照片

        </label>

        <button
          class="add-button"
          onclick="addItem('styles')">
          ＋ 添加款式
        </button>

      </div>

    </div>

    <div
      id="stylesList"
      class="items-list">
    </div>

  </div>


  <!-- MAIN COLORS -->

  <div class="settings-section">

    <h2>
      🎨 线材主色
    </h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="mainColorName"
          type="text"
          placeholder="例如：黄色">

        <input
          id="mainColorImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">

          <input
            id="mainColorPhotoOnly"
            type="checkbox">

          只显示照片

        </label>

        <button
          class="add-button"
          onclick="addItem('mainColors')">
          ＋ 添加主色
        </button>

      </div>

    </div>

    <div
      id="mainColorsList"
      class="items-list">
    </div>

  </div>


  <!-- SECONDARY -->

  <div class="settings-section">

    <h2>
      🌈 线材配色
    </h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="secondaryColorName"
          type="text"
          placeholder="例如：红色">

        <input
          id="secondaryColorImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">

          <input
            id="secondaryColorPhotoOnly"
            type="checkbox">

          只显示照片

        </label>

        <button

let data = loadData();

/* =====================================================
LOAD / SAVE
===================================================== */

function loadData(){

  const saved =
    localStorage.getItem(
      "krystalSlotMachine"
    );

  if(!saved){

    return structuredClone(
      DEFAULT_DATA
    );

  }

  try{

    const parsed =
      JSON.parse(saved);

    const result = {

      ...structuredClone(DEFAULT_DATA),

      ...parsed

    };

    [
      "styles",
      "mainColors",
      "secondaryColors",
      "buttons",
      "charms"
    ].forEach(category=>{

      if(!Array.isArray(result[category])){
        result[category]=[];
      }

      result[category].forEach(item=>{

        if(!item.id){
          item.id=createId();
        }

        if(typeof item.stock!=="number"){
          item.stock=10;
        }

        if(typeof item.photoOnly!=="boolean"){
          item.photoOnly=false;
        }

        if(typeof item.image!=="string"){
          item.image="";
        }

      });

    });

    if(!result.history){
      result.history=[];
    }

    if(!result.styleRules){
      result.styleRules={};
    }

    if(!result.mainColorRules){
      result.mainColorRules={};
    }

    return result;

  }catch(error){

    console.error(error);

    return structuredClone(
      DEFAULT_DATA
    );

  }

}


function saveData(){

  localStorage.setItem(
    "krystalSlotMachine",
    JSON.stringify(data)
  );

}


function createId(){

  return "id_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);

}


function getItems(category){

  return data[category] || [];

}


function getItem(category,id){

  return getItems(category)
    .find(item=>item.id===id);

}


function escapeHtml(text){

  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =====================================================
VISUAL
===================================================== */

/*
  现在老虎机只显示：

  有照片 → 照片
  没照片 → 文字

  永远不会同时显示照片 + 名称。
*/

function reelVisual(item){

  if(!item){

    return `
      <div class="reel-visual">
        🧶
      </div>
    `;

  }


  if(item.image){

    return `
      <div class="reel-visual">

        <img
          src="${item.image}"
          alt="">

      </div>
    `;

  }


  return `
    <div class="reel-visual">

      ${escapeHtml(item.name || "🧶")}

    </div>
  `;

}


/*
  设置页面的预览
*/

function manageVisual(item){

    `;

  return `

/* =====================================================
SETTINGS
===================================================== */

function renderSettings(){

  renderManageList("styles");

  renderManageList("mainColors");

  renderManageList("secondaryColors");

  renderManageList("buttons");

  renderManageList("charms");

}


function renderManageList(category){

  const container =
    document.getElementById(
      category+"List"
    );

  if(!container) return;

  const items =
    getItems(category);


  if(!items.length){

    container.innerHTML=`
      <div class="history-empty">
        还没有添加项目
      </div>
    `;

    return;

  }


  container.innerHTML =
    items.map(item=>{

      const stock =
        Number(item.stock)||0;

      const stockClass =
        stock>0
        ?"stock-ok"
        :"stock-zero";

      const stockText =
        stock>0
        ?"有货"
        :"缺货";


      return `

        <div class="manage-card">

          <div class="manage-top">

            ${manageVisual(item)}

            <div class="manage-info">

              <div class="manage-name">

                ${escapeHtml(
                  item.name || "未命名"
                )}

                class="photo-only-label">

                <input
                  type="checkbox"
                  ${item.photoOnly?"checked":""}
                  onchange="
                    togglePhotoOnly(
                      '${category}',
                      '${item.id}',
                      this.checked
                    )
                  ">

                只显示照片

              </label>

            </div>

            <button
              class="delete-btn"
              onclick="
                deleteItem(
                  '${category}',
                  '${item.id}'
                )
              ">

              删除

            </button>

          </div>

          <div class="photo-tools">

            <label
              class="photo-change-btn">

              📷
              ${item.image
                ?"更换照片"
                :"添加照片"}

              <input
                type="file"
                accept="image/*"
                hidden
                onchange="
                  replaceImage(
                    '${category}',
                    '${item.id}',
                    this.files[0]
                  )
                ">

            </label>


            ${
              item.image
              ?
              `
                <button
                  class="photo-delete-btn"
                  onclick="
                    removeImage(
                      '${category}',
                      '${item.id}'
                    )
                  ">

                  删除照片

                </button>
              `
              :
              ""
            }

          </div>


          <!-- 库存 -->

          <div class="stock-box">

            <div class="stock-title">
              📦 库存
            </div>

            <div class="stock-control">

              <button
                onclick="
                  changeStock(
                    '${category}',
                    '${item.id}',
                    -1
                  )
                ">
                −
              </button>

              <input
                type="number"
                min="0"
                value="${stock}"
                onchange="
                  setStock(
                    '${category}',
                    '${item.id}',
                    this.value
                  )
                ">

              <button
                onclick="
                  changeStock(
                    '${category}',
                    '${item.id}',

          </div>

}


/* =====================================================
ADD
===================================================== */

async function addItem(category){

  const config={

    styles:{
      name:"styleName",
      image:"styleImage",
      photoOnly:"stylePhotoOnly"
    },

    mainColors:{
      name:"mainColorName",
      image:"mainColorImage",
      photoOnly:"mainColorPhotoOnly"
    },

    secondaryColors:{
      name:"secondaryColorName",
      image:"secondaryColorImage",
      photoOnly:"secondaryColorPhotoOnly"
    },

    buttons:{
      name:"buttonName",
      image:"buttonImage",
      photoOnly:"buttonPhotoOnly"
    },

    charms:{
      name:"charmName",
      image:"charmImage",
      photoOnly:"charmPhotoOnly"
    }

  }[category];


  const name =
    document
      .getElementById(config.name)
      .value
      .trim();


  const file =
    document
      .getElementById(config.image)
      .files[0];


  const photoOnly =
    document
      .getElementById(config.photoOnly)
      .checked;


  if(!name && !file){

    alert(
      "请输入名称，或者上传照片。"
    );

    return;

  }


  let image="";


  if(file){

    image =
      await readImage(file);

  }


  data[category].push({

    id:createId(),

    name:name || "照片项目",

    image,

    stock:10,

    photoOnly

  });


  saveData();


  document
    .getElementById(config.name)
    .value="";

  document
    .getElementById(config.image)
    .value="";

  document
    .getElementById(config.photoOnly)
    .checked=false;


  renderSettings();

}


function readImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}


/* =====================================================
CHANGE EXISTING PHOTO
===================================================== */

async function replaceImage(
  category,
  id,
  file
){

  if(!file) return;

  const item =
    getItem(category,id);

  if(!item) return;


  item.image =
    await readImage(file);


  saveData();

  renderSettings();

}


function removeImage(
  category,
  id
){

  const item =
    getItem(category,id);

  if(!item) return;


  if(
    !confirm(
      "确定删除这张照片吗？删除后会恢复成文字显示。"
    )
  ){

    return;

  }


  item.image="";

  saveData();

  renderSettings();

}


function togglePhotoOnly(
  category,
  id,
  checked
){

  const item =
    getItem(category,id);

  if(!item) return;

  item.photoOnly=checked;

  saveData();

}


/* =====================================================
DELETE
===================================================== */

function deleteItem(
  category,
  id
){

  const item =
    getItem(category,id);

  if(!item) return;


  if(
    !confirm(
      `确定删除「${item.name}」吗？`
    )
  ){

    return;

  }


  data[category] =
    data[category]
      .filter(item=>item.id!==id);


  saveData();

  renderSettings();

}


/* =====================================================
STOCK
===================================================== */

function setStock(
  category,
  id,
  value
){

  const item =
    getItem(category,id);

  if(!item) return;


  let stock =
    parseInt(value,10);


  if(
    isNaN(stock) ||
    stock<0
  ){

    stock=0;

  }


  item.stock=stock;

  saveData();

  renderManageList(category);

}


function changeStock(
  category,
  id,
  amount
){

  const item =
    getItem(category,id);

  if(!item) return;


  item.stock =
    Math.max(
      0,
      Number(item.stock||0)+amount
    );


  saveData();

  renderManageList(category);

}


/* =====================================================
RULES
===================================================== */

function renderRules(){

  const container =
    document.getElementById(
      "rulesContainer"
    );

  let html="";


  /*
    款式规则
  */

  html+=`

    <div class="rule-box">

      <h3>
        👜 款式 → 主色 / 扣子 / 吊饰
      </h3>

      <p
        style="
          color:#a48791;
          font-size:13px;
        ">

        不勾选任何项目 = 全部允许。

      </p>

  `;


  data.styles.forEach(style=>{

    const rule =
      data.styleRules[style.id] || {};


    html+=`

      <div
        style="
          border-top:1px dashed #efd4dd;
          padding-top:12px;
          margin-top:12px;
        ">

        <strong>

        )}

        ${renderStyleRule(

          rule.buttons||[]
        )}

        ${renderStyleRule(
          style.id,
          "charms",
          "吊饰",
          rule.charms||[]
        )}

      </div>

    `;

  });


  html+=`</div>`;


  /*
    主色 → 配色
  */

  html+=`

    <div class="rule-box">

      <h3>
        🎨 主色 → 配色
      </h3>

      <p
        style="
          color:#a48791;
          font-size:13px;
        ">

        不勾选 = 全部配色都允许。

      </p>

  `;


  data.mainColors.forEach(color=>{

    const allowed =
      data.mainColorRules[color.id] || [];


    html+=`

      <div
        style="
          border-top:1px dashed #efd4dd;
          padding-top:12px;
          margin-top:12px;
        ">

        <strong>
          ${escapeHtml(color.name)}
        </strong>

        <div
          class="checkbox-list"
          style="margin-top:8px;">

          ${
            data.secondaryColors
              .map(sec=>`

                <label
                  class="checkbox-item">

                  <input
                    type="checkbox"
                    class="main-color-rule"
                    data-main="${color.id}"
                    value="${sec.id}"
                    ${
                      allowed.includes(sec.id)
                      ?"checked"
                      :""
                    }>

                  ${escapeHtml(sec.name)}

                </label>

              `)
              .join("")
          }

        </div>

      </div>

    `;

  });


  html+=`</div>`;


  container.innerHTML=html;

}


function renderStyleRule(
  styleId,
  category,
  label,
  allowed
){

  return `

    <div style="margin-top:8px;">

      <div
        style="
          color:#a48791;
          font-size:13px;
          margin-bottom:5px;
        ">

        ${label}

      </div>

      <div class="checkbox-list">

        ${
          data[category]
            .map(item=>`

              <label
                class="checkbox-item">

                <input
                  type="checkbox"
                  class="style-rule"
                  data-style="${styleId}"
                  data-category="${category}"
                  value="${item.id}"
                  ${
                    allowed.includes(item.id)
                    ?"checked"
                    :""
                  }>

                ${escapeHtml(item.name)}

              </label>

            `)
            .join("")
        }

      </div>

    </div>

  `;

}


function saveRules(){

  data.styleRules={};

  document
    .querySelectorAll(".style-rule")
    .forEach(input=>{

      const styleId =
        input.dataset.style;

      const category =
        input.dataset.category;


      if(!data.styleRules[styleId]){

        data.styleRules[styleId]={};

      }


      if(
        !data.styleRules[styleId][category]
      ){

        data.styleRules[styleId][category]=[];

      }


      if(input.checked){

        data.styleRules[styleId][category]
          .push(input.value);

      }

    });


  data.mainColorRules={};


  document
    .querySelectorAll(".main-color-rule")
    .forEach(input=>{

      const mainId =
        input.dataset.main;


      if(!data.mainColorRules[mainId]){

        data.mainColorRules[mainId]=[];

      }


      if(input.checked){

        data.mainColorRules[mainId]
          .push(input.value);

      }

    });


  saveData();

  alert(
    "💗 抽取规则已经保存！"
  );

}


/* =====================================================
POOL
===================================================== */

/*
  滚动：
  可以看到库存为 0 的项目。

  最终：
  只允许库存 > 0。
*/

function getVisualPool(
  slot,
  context
){

  const category =
    categoryMap[slot];

  let items =
    [...getItems(category)];


  /*
    主色受到款式限制
  */

  if(
    slot==="mainColor" &&
    context.style
  ){

    const rule =
      data.styleRules[
        context.style
      ];


    if(
      rule &&
      Array.isArray(rule.mainColors) &&
      rule.mainColors.length
    ){

      items =
        items.filter(item=>
          rule.mainColors.includes(
            item.id
          )
        );

    }

  }


  /*
    配色受到主色限制
  */

  if(
    slot==="secondaryColor" &&
    context.mainColor
  ){

    const rule =
      data.mainColorRules[
        context.mainColor
      ];


    if(
      Array.isArray(rule) &&
      rule.length
    ){

      items =
        items.filter(item=>
          rule.includes(item.id)
        );

    }

  }


  /*
    扣子 / 吊饰受到款式限制
  */

  if(
    (
      slot==="mainButton" ||
      slot==="subButton" ||
      slot==="charm"
    ) &&
    context.style
  ){

    const rule =
      data.styleRules[
        context.style
      ];


    const categoryRule =
      rule &&
      rule[category];


    if(
      Array.isArray(categoryRule) &&
      categoryRule.length
    ){

      items =
        items.filter(item=>
          categoryRule.includes(
            item.id
          )
        );

    }

  }


  return items;

}


function getAvailablePool(
  slot,
  context
){

  return getVisualPool(
    slot,
    context
  )
  .filter(
    item=>Number(item.stock)>0
  );

}


/* =====================================================
FINAL RESULT
===================================================== */

function pickRandom(array){

  if(!array.length){
    return null;
  }

  return array[
    Math.floor(
      Math.random()*array.length
    )
  ];

}


function generateFinalResult(){

  const result={};


  /*
    1. 款式
  */

  const styles =
    getAvailablePool(
      "style",
      result
    );


  if(!styles.length){

    throw new Error(
      "没有可用的款式库存。"
    );

  }


  result.style =
    pickRandom(styles).id;


  /*
    2. 主色
  */

  const mainColors =
    getAvailablePool(
      "mainColor",
      result
    );


  if(!mainColors.length){

    throw new Error(
      "当前款式没有可用的主色库存。"
    );

  }


  result.mainColor =
    pickRandom(mainColors).id;


  /*
    3. 配色
  */

  const secondaryColors =
    getAvailablePool(
      "secondaryColor",
      result
    );


  if(!secondaryColors.length){

    throw new Error(
      "当前主色没有可用的配色库存。"
    );

  }


  result.secondaryColor =
    pickRandom(secondaryColors).id;


  /*
    4. 主扣
  */

  const mainButtons =
    getAvailablePool(
      "mainButton",
      result
    );


  if(!mainButtons.length){

    throw new Error(
      "没有可用的主扣库存。"
    );

  }


  result.mainButton =
    pickRandom(mainButtons).id;


  /*
    5. 副扣
  */

  const subButtons =
    getAvailablePool(
      "subButton",
      result
    );


  if(!subButtons.length){

    throw new Error(
      "没有可用的副扣库存。"
    );

  }


  result.subButton =
    pickRandom(subButtons).id;


  /*
    6. 吊饰
  */

  const charms =
    getAvailablePool(
      "charm",
      result
    );


  if(!charms.length){

    throw new Error(
      "没有可用的小吊饰库存。"
    );

  }


  result.charm =
    pickRandom(charms).id;


  return result;

}


/* =====================================================
REEL
===================================================== */

function createReel(
  pool
){

  if(!pool.length){

    return `
      <div class="reel-item">
        <div class="reel-visual">
          暂无
        </div>
      </div>
    `;

  }


  const itemHeight=90;


  const rounds =
    Math.max(
      35,
      Math.ceil(
        9000 /
        (pool.length*itemHeight)
      )+5
    );


  let html="";


  for(
    let r=0;
    r<rounds;
    r++
  ){

    pool.forEach(item=>{

      html+=`

        <div class="reel-item">

          ${reelVisual(item)}

        </div>

      `;

    });

  }


  return html;

}


/* =====================================================
RENDER REELS
===================================================== */

function renderReels(){

  slotKeys.forEach(slot=>{

    const reel =
      document.getElementById(
        "reel-"+slot
      );


    if(!reel) return;


    const pool =
      getVisualPool(
        slot,
        {}
      );


    reel.innerHTML =
      createReel(pool);

    reel.style.transition="none";

    reel.style.transform=
      "translateY(0px)";

  });

}


/* =====================================================
START
===================================================== */

function startAll(){

  if(isDrawing){
    return;
  }


  try{

    currentResult =
      generateFinalResult();

  }catch(error){

    alert(error.message);

    return;

  }


  isDrawing=true;


  /*
    让每个老虎机根据最终组合
    重新生成符合规则的视觉池
  */

  const context={};


  context.style =
    currentResult.style;

  context.mainColor =
    currentResult.mainColor;


  slotKeys.forEach(slot=>{

    const reel =
      document.getElementById(
        "reel-"+slot
      );


    const pool =
      getVisualPool(
        slot,
        context
      );


    reel.innerHTML =
      createReel(pool);

    reel.style.transition="none";

    reel.style.transform=
      "translateY(0px)";


    startSlot(
      slot,
      currentResult
    );

  });


  /*
    先滚 3 秒
    然后每隔 1 秒停一个
  */

  setTimeout(()=>{

    slotKeys.forEach(
      (slot,index)=>{

        setTimeout(()=>{

          if(
            slotState[slot] &&
            slotState[slot].running
          ){

            stopSingle(slot);

          }

        },index*1000);

      }
    );

  },3000);

}


/* =====================================================
START SLOT
===================================================== */

function startSlot(
  slot,
  finalResult
){

  const reel =
    document.getElementById(
      "reel-"+slot
    );


  const context={

    style:finalResult.style,

    mainColor:
      finalResult.mainColor

  };


  const pool =
    getVisualPool(
      slot,
      context
    );


  if(!pool.length){
    return;
  }


  const targetId =
    finalResult[slot];


  const targetIndex =
    Math.max(
      0,
      pool.findIndex(
        item=>item.id===targetId
      )
    );


  const itemHeight=90;


  slotState[slot]={

    running:true,

    startTime:performance.now(),

    speed:720,

    pool,

    targetId,

    targetIndex,

    animationFrame:null

  };


  function animate(now){

    const state =
      slotState[slot];


    if(
      !state ||
      !state.running
    ){

      return;

    }


    const elapsed =
      (now-state.startTime)/1000;


    const distance =
      elapsed*state.speed;


    reel.style.transform=
      `translateY(-${distance}px)`;


    state.animationFrame =
      requestAnimationFrame(
        animate
      );

  }


  slotState[slot].animationFrame =
    requestAnimationFrame(
      animate
    );

}


/* =====================================================
STOP SINGLE
===================================================== */

function stopSingle(slot){

  const state =
    slotState[slot];


  if(
    !state ||
    !state.running
  ){

    return;

  }


  state.running=false;


  if(state.animationFrame){

    cancelAnimationFrame(
      state.animationFrame
    );

  }


  const reel =
    document.getElementById(
      "reel-"+slot
    );


  const elapsed =
    (
      performance.now() -
      state.startTime
    )/1000;


  const currentDistance =
    elapsed*state.speed;


  const itemHeight=90;


  const currentIndex =
    Math.floor(
      currentDistance/itemHeight
    );


  /*
    再向前滚 8 格
  */

  let finalIndex =
    currentIndex+8;


  const poolLength =
    state.pool.length;


  const remainder =
    finalIndex%poolLength;


  finalIndex +=
    (
      state.targetIndex-
      remainder+
      poolLength
    )%poolLength;


  /*
    中间格：
    top = 90px

    所以：

    -(index*90 - 90)
  */

  const finalTranslate =
    -(
      finalIndex*itemHeight-
      itemHeight
    );


  reel.style.transition=
    "transform 1.5s cubic-bezier(.12,.7,.15,1)";


  reel.style.transform=
    `translateY(${finalTranslate}px)`;


  setTimeout(
    checkAllStopped,
    1600
  );

}


/* =====================================================
STOP ALL
===================================================== */

function stopAll(){

  slotKeys.forEach(slot=>{

    if(
      slotState[slot] &&
      slotState[slot].running
    ){

      stopSingle(slot);

    }

  });

}


function checkAllStopped(){

  const stillRunning =
    slotKeys.some(slot=>
      slotState[slot] &&
      slotState[slot].running
    );


  if(stillRunning){
    return;
  }


  isDrawing=false;

  showResultModal();

}


/* =====================================================
RESULT MODAL
===================================================== */

function showResultModal(){

  if(!currentResult){
    return;
  }


  const list =
    document.getElementById(
      "resultList"
    );


  const resultItems=[

    {
      slot:"style",
      title:"款式"
    },

    {
      slot:"mainColor",
      title:"线材主色"
    },

    {
      slot:"secondaryColor",
      title:"线材配色"
    },

    {
      slot:"mainButton",
      title:"主扣"
    },

    {
      slot:"subButton",
      title:"副扣"
    },

    {
      slot:"charm",
      title:"小吊饰"
    }

  ];


  list.innerHTML =
    resultItems.map(item=>{

      const category =
        categoryMap[item.slot];


      const selected =
        getItem(
          category,
          currentResult[item.slot]
        );


      return `

        <div class="result-row">

          ${resultVisual(selected)}

          <div class="result-row-info">

            <div class="result-row-title">
              ${item.title}
            </div>

            <div class="result-row-name">
              ${escapeHtml(
                selected
                ?selected.name
                :"暂无"
              )}
            </div>

          </div>

        </div>

      `;

    }).join("");


  document
    .getElementById(
      "resultModal"
    )
    .classList.add("show");


  /*
    自动聚焦订单号
  */

  setTimeout(()=>{

    document
      .getElementById(
        "orderNumber"
      )
      .focus();

  },100);

}


function closeResultModal(){

  document
    .getElementById(
      "resultModal"
    )
    .classList.remove("show");


  currentResult=null;

}


/* =====================================================
CONFIRM ORDER
===================================================== */

function confirmResult(){

  if(!currentResult){
    return;
  }


  const orderNumber =
    document
      .getElementById(
        "orderNumber"
      )
      .value
      .trim();


  if(!orderNumber){

    alert(
      "请先输入订单号。"
    );

    document
      .getElementById(
        "orderNumber"
      )
      .focus();

    return;

  }


  /*
    检查订单号是否重复
  */

  const duplicate =
    data.history.some(
      order=>
        String(order.orderNumber)===
        String(orderNumber)
    );


  if(duplicate){

    alert(
      "这个订单号已经存在，请换一个订单号。"
    );

    return;

  }


  /*
    最终再次检查库存。

    防止在抽取过程中，
    数据已经被其他操作改变。
  */

  const used=[

    ["styles",currentResult.style],

    [
      "mainColors",
      currentResult.mainColor
    ],

    [
      "secondaryColors",
      currentResult.secondaryColor
    ],

    [
      "buttons",
      currentResult.mainButton
    ],

    [
      "buttons",
      currentResult.subButton
    ],

    [
      "charms",
      currentResult.charm
    ]

  ];


  const countMap={};


  used.forEach(
    ([category,id])=>{

      const key=
        category+"_"+id;

      countMap[key]=
        (countMap[key]||0)+1;

    }
  );


  for(
    const key in countMap
  ){

    const parts =
      key.split("_");

    const category =
      parts.shift();

    const id =
      parts.join("_");


    const item =
      getItem(
        category,
        id
      );


    if(
      !item ||
      Number(item.stock)<
      countMap[key]
    ){

      alert(
        `「${item?item.name:"项目"}」库存不足，无法确认订单。`
      );

      return;

    }

  }


  /*
    扣库存
  */

  used.forEach(
    ([category,id])=>{

      const item =
        getItem(
          category,
          id
        );


      if(item){

        item.stock=
          Math.max(
            0,
            Number(item.stock)-1
          );

      }

    }
  );


  /*
    保存历史订单。

    注意：
    这里把当时的名字和照片一起复制进去。

    所以以后即使你更换商品照片，
    历史订单仍然可以看到当时的照片。
  */

  const historyOrder={

    orderNumber,

    createdAt:
      new Date().toISOString(),

    result:{

      style:
        snapshotItem(
          "styles",
          currentResult.style
        ),

      mainColor:
        snapshotItem(
          "mainColors",
          currentResult.mainColor
        ),

      secondaryColor:
        snapshotItem(
          "secondaryColors",
          currentResult.secondaryColor
        ),

      mainButton:
        snapshotItem(
          "buttons",
          currentResult.mainButton
        ),

      subButton:
        snapshotItem(
          "buttons",
          currentResult.subButton
        ),

      charm:
        snapshotItem(
          "charms",
          currentResult.charm
        )

    }

  };


  data.history.unshift(
    historyOrder
  );


  saveData();


  /*
    关闭结果
  */

  document
    .getElementById(
      "resultModal"
    )
    .classList.remove("show");


  document
    .getElementById(
      "orderNumber"
    )
    .value="";


  currentResult=null;


  alert(
    `💗 订单 ${orderNumber} 已记录！`
  );


  renderReels();

}


/* =====================================================
SNAPSHOT
===================================================== */

function snapshotItem(
  category,
  id
){

  const item =
    getItem(
      category,
      id
    );


  if(!item){

    return {
      id:"",
      name:"暂无",
      image:""
    };

  }


  return {

    id:item.id,

    name:item.name,

    image:item.image || ""

  };

}


/* =====================================================
HISTORY
===================================================== */

function renderHistory(){

  const container =
    document.getElementById(
      "historyList"
    );


  const history =
    data.history || [];


  if(!history.length){

    container.innerHTML=`

      <div class="history-empty">

        📖 还没有历史订单

      </div>

    `;

    return;

  }


  container.innerHTML =
    history.map(order=>{

      const result =
        order.result;


      const time =
        formatDate(
          order.createdAt
        );


      const items=[

        {
          title:"款式",
          item:result.style
        },

        {
          title:"线材主色",
          item:result.mainColor
        },

        {
          title:"线材配色",
          item:result.secondaryColor
        },

        {
          title:"主扣",
          item:result.mainButton
        },

        {
          title:"副扣",
          item:result.subButton
        },

        {
          title:"小吊饰",
          item:result.charm
        }

      ];


      return `

        <div class="history-card">

          <div class="history-header">

            <div class="history-order">

              订单 ${escapeHtml(
                order.orderNumber
              )}

            </div>

            <div class="history-time">

              ${time}

            </div>

          </div>


          <div class="history-items">

            ${
              items.map(entry=>`

                <div class="history-item">

                  ${
                    historyVisual(
                      entry.item
                    )
                  }

                  <div
                    class="history-item-title">

                    ${entry.title}

                  </div>

                  <div
                    class="history-item-name">

                    ${escapeHtml(
                      entry.item.name
                    )}

                  </div>

                </div>

              `).join("")
            }

          </div>

        </div>

      `;

    }).join("");

}


function historyVisual(item){

  if(
    item &&
    item.image
  ){

    return `

      <div class="history-item-visual">

        <img
          src="${item.image}"
          alt="">

      </div>

    `;

  }


  return `

    <div class="history-item-visual">

      ${escapeHtml(
        item
        ?item.name
        :"暂无"
      )}

    </div>

  `;

}


function formatDate(date){

  const d =
    new Date(date);


  if(isNaN(d.getTime())){
    return "";
  }


  return d.toLocaleString(
    "zh-CN",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =====================================================
INITIAL
===================================================== */

renderReels();

</script>
