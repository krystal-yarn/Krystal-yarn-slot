<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krystal 的毛线老虎机</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, #ffe4ef 0, transparent 25%),
    radial-gradient(circle at 80% 10%, #fff0c9 0, transparent 25%),
    #fff8fb;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;
  color: #8f6075;
}


/* =========================
   整个页面
========================= */

.page {
  width: 100%;
  max-width: 520px;
  padding: 30px 20px;
  text-align: center;
}


/* =========================
   标题
========================= */

.logo {
  font-size: 15px;
  color: #d894ad;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

h1 {
  margin: 0;
  color: #d56f98;
  font-size: 32px;
  font-weight: 800;
}

.subtitle {
  margin-top: 10px;
  color: #b58b9c;
  font-size: 14px;
}


/* =========================
   糖果机器
========================= */

.machine {
  position: relative;

  margin: 30px auto 0;

  width: 100%;
  max-width: 390px;

  padding: 25px 22px 30px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #fff5f9
    );

  border: 4px solid #f4b2c9;

  border-radius: 38px;

  box-shadow:
    0 15px 35px rgba(213,111,152,0.18),
    inset 0 0 0 4px #fff;

}


/* 顶部装饰 */

.machine-top {
  display: flex;
  justify-content: center;
  align-items: center;

  gap: 8px;

  margin-bottom: 18px;

  color: #d7799d;
  font-size: 16px;
  font-weight: 700;
}

.machine-top span {
  font-size: 20px;
}


/* =========================
   真正的老虎机窗口
========================= */

.slot-frame {

  position: relative;

  padding: 10px;

  background: #f4b1c8;

  border-radius: 25px;

  box-shadow:
    inset 0 3px 5px rgba(255,255,255,0.8),
    0 5px 10px rgba(213,111,152,0.12);

}


/* 白色窗口 */

.slot-window {

  position: relative;

  height: 130px;

  overflow: hidden;

  background: #fffdfd;

  border-radius: 18px;

  border: 3px solid #f9d4e0;

}


/* 中间中奖区域 */

.slot-window::before {

  content: "";

  position: absolute;

  left: 0;
  right: 0;

  top: 50%;

  transform: translateY(-50%);

  height: 76px;

  border-top: 2px solid #f3b1c8;
  border-bottom: 2px solid #f3b1c8;

  background: rgba(255,236,244,0.35);

  z-index: 10;

  pointer-events: none;

}


/* 两边的小箭头 */

.slot-window::after {

  content: "♡";

  position: absolute;

  right: 8px;

  top: 50%;

  transform: translateY(-50%);

  color: #ef9fba;

  font-size: 25px;

  z-index: 20;

}


/* =========================
   滚轮
========================= */

.reel-window {

  height: 130px;

  overflow: hidden;

  position: relative;

}


.reel {

  width: 100%;

  position: absolute;

  top: 0;
  left: 0;

  transition:
    transform 2.8s cubic-bezier(0.12, 0.72, 0.18, 1);

}


/* 每一个滚轮项目 */

.item {

  height: 76px;

  display: flex;

  justify-content: center;

  align-items: center;

  flex-shrink: 0;

}


/* 中间文字 */

.item-inner {

  width: 90%;

  height: 62px;

  display: flex;

  justify-content: center;

  align-items: center;

  border-radius: 18px;

  background: linear-gradient(
    135deg,
    #fff7fa,
    #fff
  );

  color: #d87599;

  font-size: 22px;

  font-weight: 800;

  border: 2px solid #f7d5e1;

}


/* =========================
   按钮
========================= */

.draw-button {

  margin-top: 25px;

  width: 85%;

  padding: 16px 20px;

  border: none;

  border-radius: 50px;

  background:
    linear-gradient(
      135deg,
      #f6a9c3,
      #e889ad
    );

  color: white;

  font-size: 19px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 7px 15px rgba(216,115,153,0.25);

  transition:
    transform 0.15s,
    box-shadow 0.15s;

}


.draw-button:hover {

  transform: translateY(-2px);

  box-shadow:
    0 10px 18px rgba(216,115,153,0.3);

}


.draw-button:active {

  transform: scale(0.96);

}


.draw-button:disabled {

  opacity: 0.7;

  cursor: not-allowed;

}


/* =========================
   结果
========================= */

.result {

  min-height: 32px;

  margin-top: 18px;

  color: #d36f96;

  font-size: 18px;

  font-weight: 800;

}


/* =========================
   底部小字
========================= */

.tip {

  margin-top: 20px;

  color: #c6a6b3;

  font-size: 12px;

  letter-spacing: 1px;

}


/* 小装饰 */

.decor {

  margin-top: 18px;

  font-size: 20px;

  letter-spacing: 8px;

}

</style>
</head>


<body>


<div class="page">

  <div class="logo">
    KRYSTAL'S YARN LAB
  </div>

  <h1>
    🎀 毛线老虎机
  </h1>

  <div class="subtitle">
    今天的幸运配色是什么？
  </div>


  <div class="machine">


    <div class="machine-top">
      <span>🧶</span>
      COLOR MACHINE
      <span>🌷</span>
    </div>


    <!-- 真正的老虎机 -->

    <div class="slot-frame">

      <div class="slot-window">

        <div class="reel-window">

          <div class="reel" id="reel">

            <!-- JavaScript 会自动生成内容 -->

          </div>

        </div>

      </div>

    </div>


    <button
      class="draw-button"
      id="drawButton"
      onclick="startDraw()"
    >
      🎰 开始抽取
    </button>


    <div
      class="result"
      id="result"
    ></div>


    <div class="decor">
      ✿ ♡ ✿
    </div>

  </div>


  <div class="tip">
    每一次抽取，都是今天的小幸运 ✨
  </div>

</div>



<script>


/* =========================
   你的 12 种主色
========================= */

const colors = [

  "酒红色",
  "米白色",
  "牛油果绿",
  "浅灰色",
  "金黄色",
  "大红色",
  "橘黄色",
  "玫红色",
  "深粉色",
  "浅粉色",
  "浅紫色",
  "米黄色"

];


/* 每个项目高度 */

const ITEM_HEIGHT = 76;


/* 滚轮 */

const reel = document.getElementById("reel");

const result =
  document.getElementById("result");

const button =
  document.getElementById("drawButton");


/* =========================
   创建滚轮内容
========================= */

function createReel() {

  reel.innerHTML = "";

  /*
    重复很多次颜色，
    让滚轮看起来可以一直滚
  */

  for (let round = 0; round < 8; round++) {

    colors.forEach(function(color) {

      const item =
        document.createElement("div");

      item.className = "item";

      item.innerHTML = `
        <div class="item-inner">
          ${color}
        </div>
      `;

      reel.appendChild(item);

    });

  }

}


/* 页面打开时先建立滚轮 */

createReel();


/* =========================
   开始抽取
========================= */

function startDraw() {


  if (button.disabled) {
    return;
  }


  button.disabled = true;

  button.innerText = "🎰 好运滚动中...";

  result.innerText = "";


  /*
    随机决定最后停在哪个颜色
  */

  const finalIndex =
    Math.floor(
      Math.random() * colors.length
    );


  /*
    让它滚很多圈之后，
    最后停在中奖颜色
  */

  const rounds = 5;


  const targetIndex =
    rounds * colors.length
    + finalIndex;


  const distance =
    targetIndex * ITEM_HEIGHT;


  /*
    开始真正的滚动
  */

  reel.style.transform =
    `translateY(-${distance}px)`;


  /*
    等动画完成
  */

  setTimeout(function() {


    const finalColor =
      colors[finalIndex];


    result.innerText =
      "✨ 今日幸运色：" + finalColor;


    button.disabled = false;

    button.innerText =
      "🎀 再抽一次";


  }, 3000);

}


</script>

</body>
</html>
