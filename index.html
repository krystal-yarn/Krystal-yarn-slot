<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krystal 的毛线研究室｜老虎机</title>

<!-- 更圆、更可爱的中文字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --pink: #ff9fbd;
  --deep-pink: #f47fa4;
  --light-pink: #fff0f5;
  --cream: #fffaf5;
  --text: #6f5962;
  --white: #ffffff;
  --border: #f3ccd8;
  --shadow: 0 8px 25px rgba(230, 150, 175, .18);
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 10% 10%, #fff0f5 0 8%, transparent 9%),
    radial-gradient(circle at 90% 20%, #fff4dc 0 7%, transparent 8%),
    linear-gradient(180deg, #fff8fb, #fffaf5);
  color: var(--text);

  font-family:
    "ZCOOL KuaiLe",
    "STYuanti-SC",
    "Yuanti SC",
    "Hannotate SC",
    "Hiragino Maru Gothic ProN",
    "Arial Rounded MT Bold",
    "PingFang SC",
    sans-serif;

  min-height: 100vh;
}

/* =========================
   HEADER
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 250, 252, .95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #f7dce5;
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 15px 20px;

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 24px;
  color: #e77c9d;
  white-space: nowrap;
}

.nav {
  display: flex;
  gap: 10px;
}

.nav button {
  border: none;
  background: #fff;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 16px;
  border-radius: 999px;
  cursor: pointer;
  font: inherit;
  font-size: 15px;
  transition: .2s;
}

.nav button:hover {
  background: var(--light-pink);
  transform: translateY(-2px);
}

.nav button.active {
  background: var(--pink);
  color: white;
  border-color: var(--pink);
}

/* =========================
   MAIN
========================= */

main {
  max-width: 1200px;
  margin: auto;
  padding: 30px 20px 70px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.page-title {
  text-align: center;
  margin-bottom: 30px;
}

.page-title h1 {
  margin: 0;
  font-size: 36px;
  color: #df7899;
}

.page-title p {
  margin-top: 8px;
  color: #aa8994;
}

/* =========================
   DRAW PAGE
========================= */

.draw-panel {
  background: rgba(255,255,255,.9);
  border: 2px solid #f7d9e3;
  border-radius: 28px;
  padding: 25px;
  box-shadow: var(--shadow);
}

.machine-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.machine {
  background: #fffafb;
  border: 2px solid #f5d9e2;
  border-radius: 24px;
  padding: 16px;
  text-align: center;
  box-shadow: 0 5px 16px rgba(230,150,175,.10);
}

.machine-title {
  font-size: 20px;
  color: #dd7898;
  margin-bottom: 12px;
}

.reel-window {
  height: 270px;
  overflow: hidden;
  position: relative;

  background: #fff;
  border-radius: 18px;
  border: 2px solid #f1ccd8;
}

/* 中间格 */
.reel-window::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 90px;
  height: 90px;

  border-top: 3px solid #ff9fbd;
  border-bottom: 3px solid #ff9fbd;

  background: rgba(255, 180, 205, .07);
  pointer-events: none;
  z-index: 10;
}

.reel {
  position: absolute;
  width: 100%;
  left: 0;
  top: 0;
  will-change: transform;
}

.reel-item {
  height: 90px;
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;

  padding: 7px;
}

.visual-tile {
  width: 70px;
  height: 70px;
  min-width: 70px;

  border-radius: 15px;
  overflow: hidden;

  border: 2px solid #f1d5de;
  background: #fff4f7;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 15px;
  color: #d97b98;
  text-align: center;

  padding: 5px;
}

.visual-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.item-name {
  max-width: 95px;
  font-size: 14px;
  line-height: 1.2;
  color: #80656e;
}

.machine-buttons {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}

.machine-buttons button {
  flex: 1;
  border: none;
  border-radius: 999px;
  padding: 9px 6px;
  font: inherit;
  cursor: pointer;
  font-size: 14px;
}

.stop-one {
  background: #ffe4ed;
  color: #d66e91;
}

.stop-one:hover {
  background: #ffd2e0;
}

.all-stop {
  background: #f5d6df;
  color: #ad657e;
}

.all-stop:hover {
  background: #edc1cf;
}

/* =========================
   CONTROL BUTTONS
========================= */

.main-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 28px;
  flex-wrap: wrap;
}

.main-controls button {
  border: none;
  border-radius: 999px;
  padding: 14px 28px;
  font: inherit;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(230,130,160,.18);
}

.start-btn {
  background: #ff9fbd;
  color: white;
}

.start-btn:hover {
  background: #f58bab;
  transform: translateY(-2px);
}

.stop-all-btn {
  background: #ffe1ea;
  color: #c86f8d;
}

.result-area {
  margin-top: 30px;
  padding: 24px;
  border-radius: 25px;
  background: #fff7fa;
  border: 2px dashed #f2bdce;
  display: none;
}

.result-area.show {
  display: block;
}

.result-title {
  text-align: center;
  font-size: 24px;
  color: #dd7898;
  margin-bottom: 20px;
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
}

.result-card {
  background: white;
  border-radius: 18px;
  border: 1px solid #f2d4de;
  padding: 10px;
  text-align: center;
}

.result-card-title {
  font-size: 14px;
  color: #b57c8d;
  margin-bottom: 8px;
}

.result-card .visual-tile {
  margin: auto;
  width: 90px;
  height: 90px;
}

.result-card .item-name {
  margin: 8px auto 0;
  max-width: 120px;
}

.confirm-result {
  display: block;
  margin: 20px auto 0;
  border: none;
  border-radius: 999px;
  padding: 13px 25px;
  background: #f58cab;
  color: white;
  font: inherit;
  font-size: 17px;
  cursor: pointer;
}

.confirm-result:hover {
  background: #ec769a;
}

.result-note {
  text-align: center;
  color: #a98a94;
  font-size: 13px;
  margin-top: 10px;
}

/* =========================
   SETTINGS
========================= */

.settings-section {
  background: rgba(255,255,255,.94);
  border: 2px solid #f5d9e2;
  border-radius: 25px;
  padding: 22px;
  margin-bottom: 25px;
  box-shadow: var(--shadow);
}

.settings-section h2 {
  margin-top: 0;
  color: #dc7898;
}

.add-box {
  background: #fff7fa;
  border-radius: 18px;
  padding: 18px;
  border: 1px dashed #efbdce;
  margin-bottom: 20px;
}

.add-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

input[type="text"],
input[type="number"] {
  border: 1px solid #e6c7d1;
  background: white;
  border-radius: 12px;
  padding: 10px 12px;
  font: inherit;
  color: var(--text);
}

input[type="text"] {
  min-width: 200px;
}

input[type="number"] {
  width: 75px;
  text-align: center;
}

input[type="file"] {
  max-width: 230px;
  font-family: inherit;
}

.add-button {
  border: none;
  border-radius: 999px;
  background: #ffabc5;
  color: white;
  padding: 10px 18px;
  font: inherit;
  cursor: pointer;
}

.photo-only-label,
.rule-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  font-size: 14px;
}

.items-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.manage-card {
  background: #fffafb;
  border: 1px solid #f0d6df;
  border-radius: 18px;
  padding: 14px;
}

.manage-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.manage-card .visual-tile {
  width: 80px;
  height: 80px;
  min-width: 80px;
}

.manage-info {
  flex: 1;
}

.manage-name {
  font-size: 17px;
  color: #765d66;
  margin-bottom: 6px;
}

.delete-btn {
  border: none;
  background: #ffe8ee;
  color: #d46e8e;
  border-radius: 999px;
  padding: 7px 12px;
  cursor: pointer;
  font: inherit;
}

/* =========================
   INVENTORY
========================= */

.stock-box {
  margin-top: 12px;
  padding: 11px 12px;
  background: #fff;
  border-radius: 14px;
  border: 1px solid #f0d2dc;
}

.stock-title {
  font-size: 14px;
  color: #9e7481;
  margin-bottom: 7px;
}

.stock-control {
  display: flex;
  align-items: center;
  gap: 7px;
}

.stock-control button {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: #ffe0e9;
  color: #c96685;
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
}

.stock-control button:hover {
  background: #ffcbd9;
}

.stock-control input {
  width: 65px;
  height: 32px;
  padding: 3px;
  font-size: 16px;
}

.stock-status {
  margin-left: 8px;
  font-size: 13px;
}

.stock-ok {
  color: #6daa87;
}

.stock-zero {
  color: #d98282;
}

/* =========================
   RULES
========================= */

.rules-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.rule-box {
  border: 1px solid #f0d5de;
  border-radius: 17px;
  padding: 15px;
  background: #fffafb;
}

.rule-box h3 {
  margin-top: 0;
  color: #bd7c8e;
  font-size: 17px;
}

.checkbox-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.checkbox-item {
  background: white;
  border: 1px solid #edd1da;
  border-radius: 999px;
  padding: 7px 10px;
  font-size: 13px;
}

.save-rules {
  margin-top: 20px;
  border: none;
  background: #ff9fbd;
  color: white;
  padding: 12px 25px;
  border-radius: 999px;
  font: inherit;
  cursor: pointer;
}

.empty {
  padding: 20px;
  text-align: center;
  color: #ad929b;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 900px) {
  .machine-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .result-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media(max-width: 600px) {
  .header-inner {
    flex-direction: column;
  }

  .machine-grid {
    grid-template-columns: 1fr;
  }

  .items-list,
  .rules-grid {
    grid-template-columns: 1fr;
  }

  .result-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .page-title h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      🧶 Krystal 的毛线研究室
    </div>

    <div class="nav">
      <button id="navDraw" class="active" onclick="showPage('draw')">
        🎰 开始抽取
      </button>

      <button id="navSettings" onclick="showPage('settings')">
        ⚙️ 页面设置
      </button>
    </div>

  </div>
</header>

<main>

<!-- =========================
     DRAW PAGE
========================= -->

<section id="drawPage" class="page active">

  <div class="page-title">
    <h1>🎰 毛线研究室老虎机</h1>
    <p>今天的组合，会是什么呢？</p>
  </div>

  <div class="draw-panel">

    <div class="machine-grid">

      <div class="machine">
        <div class="machine-title">👜 款式</div>

        <div class="reel-window">
          <div class="reel" id="reel-style"></div>
        </div>

        <div class="machine-buttons">
          <button class="stop-one" onclick="stopSingle('style')">
            单独停止
          </button>
        </div>
      </div>


      <div class="machine">
        <div class="machine-title">🎨 线材主色</div>

        <div class="reel-window">
          <div class="reel" id="reel-mainColor"></div>
        </div>

        <div class="machine-buttons">
          <button class="stop-one" onclick="stopSingle('mainColor')">
            单独停止
          </button>
        </div>
      </div>


      <div class="machine">
        <div class="machine-title">🌈 线材配色</div>

        <div class="reel-window">
          <div class="reel" id="reel-secondaryColor"></div>
        </div>

        <div class="machine-buttons">
          <button class="stop-one" onclick="stopSingle('secondaryColor')">
            单独停止
          </button>
        </div>
      </div>


      <div class="machine">
        <div class="machine-title">🎀 主扣</div>

        <div class="reel-window">
          <div class="reel" id="reel-mainButton"></div>
        </div>

        <div class="machine-buttons">
          <button class="stop-one" onclick="stopSingle('mainButton')">
            单独停止
          </button>
        </div>
      </div>


      <div class="machine">
        <div class="machine-title">🎀 副扣</div>

        <div class="reel-window">
          <div class="reel" id="reel-subButton"></div>
        </div>

        <div class="machine-buttons">
          <button class="stop-one" onclick="stopSingle('subButton')">
            单独停止
          </button>
        </div>
      </div>


      <div class="machine">
        <div class="machine-title">✨ 小吊饰</div>

        <div class="reel-window">
          <div class="reel" id="reel-charm"></div>
        </div>

        <div class="machine-buttons">
          <button class="stop-one" onclick="stopSingle('charm')">
            单独停止
          </button>
        </div>
      </div>

    </div>


    <div class="main-controls">

      <button class="start-btn" onclick="startAll()">
        🎰 全部开始
      </button>

      <button class="stop-all-btn" onclick="stopAll()">
        🛑 全部停止
      </button>

    </div>


    <div id="resultArea" class="result-area">

      <div class="result-title">
        💗 本次抽到的组合
      </div>

      <div id="resultGrid" class="result-grid"></div>

      <button
        class="confirm-result"
        onclick="confirmResult()">
        💗 确认这组结果并扣库存
      </button>

      <div class="result-note">
        确认后才会真正扣除库存
      </div>

    </div>

  </div>

</section>


<!-- =========================
     SETTINGS PAGE
========================= -->

<section id="settingsPage" class="page">

  <div class="page-title">
    <h1>⚙️ 页面设置</h1>
    <p>在这里直接管理照片、库存和抽取规则</p>
  </div>


  <!-- 款式 -->

  <div class="settings-section">

    <h2>👜 款式管理</h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="styleName"
          type="text"
          placeholder="例如：云朵包">

        <input
          id="styleImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">
          <input id="stylePhotoOnly" type="checkbox">
          只显示照片
        </label>

        <button
          class="add-button"
          onclick="addItem('styles')">
          ＋ 添加款式
        </button>

      </div>

    </div>

    <div id="stylesList" class="items-list"></div>

  </div>


  <!-- 主色 -->

  <div class="settings-section">

    <h2>🎨 线材主色</h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="mainColorName"
          type="text"
          placeholder="例如：浅粉色">

        <input
          id="mainColorImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">
          <input id="mainColorPhotoOnly" type="checkbox">
          只显示照片
        </label>

        <button
          class="add-button"
          onclick="addItem('mainColors')">
          ＋ 添加主色
        </button>

      </div>

    </div>

    <div id="mainColorsList" class="items-list"></div>

  </div>


  <!-- 配色 -->

  <div class="settings-section">

    <h2>🌈 线材配色</h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="secondaryColorName"
          type="text"
          placeholder="例如：奶油白">

        <input
          id="secondaryColorImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">
          <input id="secondaryColorPhotoOnly" type="checkbox">
          只显示照片
        </label>

        <button
          class="add-button"
          onclick="addItem('secondaryColors')">
          ＋ 添加配色
        </button>

      </div>

    </div>

    <div id="secondaryColorsList" class="items-list"></div>

  </div>


  <!-- 扣子 -->

  <div class="settings-section">

    <h2>🎀 主扣 / 副扣</h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="buttonName"
          type="text"
          placeholder="例如：爱心扣">

        <input
          id="buttonImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">
          <input id="buttonPhotoOnly" type="checkbox">
          只显示照片
        </label>

        <button
          class="add-button"
          onclick="addItem('buttons')">
          ＋ 添加扣子
        </button>

      </div>

    </div>

    <div id="buttonsList" class="items-list"></div>

  </div>


  <!-- 吊饰 -->

  <div class="settings-section">

    <h2>✨ 小吊饰</h2>

    <div class="add-box">

      <div class="add-row">

        <input
          id="charmName"
          type="text"
          placeholder="例如：小草莓">

        <input
          id="charmImage"
          type="file"
          accept="image/*">

        <label class="photo-only-label">
          <input id="charmPhotoOnly" type="checkbox">
          只显示照片
        </label>

        <button
          class="add-button"
          onclick="addItem('charms')">
          ＋ 添加吊饰
        </button>

      </div>

    </div>

    <div id="charmsList" class="items-list"></div>

  </div>


  <!-- 规则 -->

  <div class="settings-section">

    <h2>🔮 抽取限制</h2>

    <p>
      不勾选任何选项 = 全部允许。
    </p>

    <div id="rulesContainer"></div>

    <button
      class="save-rules"
      onclick="saveRules()">
      💗 保存抽取规则
    </button>

  </div>

</section>

</main>


<script>

/* =====================================================
   DATA
===================================================== */

const DEFAULT_DATA = {

  styles: [
    {
      id: "style_cloud",
      name: "云朵包",
      image: "",
      stock: 10,
      photoOnly: false
    }
  ],

  mainColors: [
    { id:"mc_red", name:"大红色", image:"", stock:10, photoOnly:false },
    { id:"mc_pink", name:"深粉色", image:"", stock:10, photoOnly:false },
    { id:"mc_lightpink", name:"浅粉色", image:"", stock:10, photoOnly:false },
    { id:"mc_yellow", name:"金黄色", image:"", stock:10, photoOnly:false },
    { id:"mc_orange", name:"橘黄色", image:"", stock:10, photoOnly:false },
    { id:"mc_cream", name:"米白色", image:"", stock:10, photoOnly:false },
    { id:"mc_green", name:"牛油果绿", image:"", stock:10, photoOnly:false },
    { id:"mc_purple", name:"浅紫色", image:"", stock:10, photoOnly:false }
  ],

  secondaryColors: [
    { id:"sc_white", name:"奶油白", image:"", stock:10, photoOnly:false },
    { id:"sc_pink", name:"樱花粉", image:"", stock:10, photoOnly:false },
    { id:"sc_yellow", name:"奶油黄", image:"", stock:10, photoOnly:false },
    { id:"sc_green", name:"薄荷绿", image:"", stock:10, photoOnly:false }
  ],

  buttons: [
    { id:"bt_heart", name:"爱心扣", image:"", stock:10, photoOnly:false },
    { id:"bt_pearl", name:"珍珠扣", image:"", stock:10, photoOnly:false }
  ],

  charms: [
    { id:"ch_star", name:"小星星", image:"", stock:10, photoOnly:false },
    { id:"ch_heart", name:"小爱心", image:"", stock:10, photoOnly:false }
  ],

  styleRules: {},
  mainColorRules: {}
};


let data = loadData();

let currentResult = null;

const slotKeys = [
  "style",
  "mainColor",
  "secondaryColor",
  "mainButton",
  "subButton",
  "charm"
];

const categoryMap = {
  style: "styles",
  mainColor: "mainColors",
  secondaryColor: "secondaryColors",
  mainButton: "buttons",
  subButton: "buttons",
  charm: "charms"
};

const slotState = {};


/* =====================================================
   LOCAL STORAGE
===================================================== */

function loadData() {

  const saved = localStorage.getItem("krystalSlotMachine");

  if (!saved) {
    return structuredClone(DEFAULT_DATA);
  }

  try {

    const parsed = JSON.parse(saved);

    const merged = {
      ...structuredClone(DEFAULT_DATA),
      ...parsed
    };

    [
      "styles",
      "mainColors",
      "secondaryColors",
      "buttons",
      "charms"
    ].forEach(key => {

      if (!Array.isArray(merged[key])) {
        merged[key] = [];
      }

      merged[key].forEach(item => {

        if (typeof item.stock !== "number") {
          item.stock = 10;
        }

        if (typeof item.photoOnly !== "boolean") {
          item.photoOnly = false;
        }

        if (!item.id) {
          item.id = createId();
        }

      });

    });

    if (!merged.styleRules) {
      merged.styleRules = {};
    }

    if (!merged.mainColorRules) {
      merged.mainColorRules = {};
    }

    return merged;

  } catch(e) {

    console.error(e);

    return structuredClone(DEFAULT_DATA);
  }
}


function saveData() {

  localStorage.setItem(
    "krystalSlotMachine",
    JSON.stringify(data)
  );
}


/* =====================================================
   BASIC UTILITIES
===================================================== */

function createId() {

  return "id_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2,8);
}


function getItems(category) {

  return data[category] || [];
}


function getItem(category, id) {

  return getItems(category)
    .find(item => item.id === id);
}


function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   PAGE
===================================================== */

function showPage(page) {

  document
    .querySelectorAll(".page")
    .forEach(el => el.classList.remove("active"));

  document
    .querySelectorAll(".nav button")
    .forEach(el => el.classList.remove("active"));

  if (page === "draw") {

    document
      .getElementById("drawPage")
      .classList.add("active");

    document
      .getElementById("navDraw")
      .classList.add("active");

    renderReels();

  } else {

    document
      .getElementById("settingsPage")
      .classList.add("active");

    document
      .getElementById("navSettings")
      .classList.add("active");

    renderSettings();

  }

}


/* =====================================================
   VISUAL TILE
===================================================== */

function createVisualTile(item, category) {

  if (!item) {

    return `
      <div class="visual-tile">
        🧶
      </div>
    `;
  }

  let content = "";

  /*
    有照片：
    - photoOnly = true → 只显示照片
    - false → 照片 + 名称
  */

  if (item.image) {

    content = `
      <img
        src="${item.image}"
        alt="${escapeHtml(item.name)}">
    `;

  } else {

    /*
      没有照片：
      名称直接当成“照片”
    */

    content = escapeHtml(item.name || "🧶");

  }

  return `
    <div class="visual-tile">
      ${content}
    </div>
  `;
}


function createItemVisual(item, category) {

  if (!item) {

    return `
      <div class="visual-tile">
        🧶
      </div>
    `;
  }

  let tile = createVisualTile(item, category);

  /*
    如果有照片，而且选择了“只显示照片”
    → 不显示名称
  */

  if (item.image && item.photoOnly) {

    return tile;

  }

  /*
    没照片时：
    名称已经在照片格里面
    不再重复显示
  */

  if (!item.image) {

    return tile;

  }

  return `
    <div>
      ${tile}
      <div class="item-name">
        ${escapeHtml(item.name)}
      </div>
    </div>
  `;
}


/* =====================================================
   SETTINGS RENDER
===================================================== */

function renderSettings() {

  renderManageList("styles");
  renderManageList("mainColors");
  renderManageList("secondaryColors");
  renderManageList("buttons");
  renderManageList("charms");

  renderRules();
}


function renderManageList(category) {

  const container =
    document.getElementById(category + "List");

  if (!container) return;

  const items = getItems(category);

  if (!items.length) {

    container.innerHTML =
      `<div class="empty">还没有添加项目</div>`;

    return;
  }

  container.innerHTML = items.map(item => {

    const stockClass =
      Number(item.stock) > 0
        ? "stock-ok"
        : "stock-zero";

    const stockText =
      Number(item.stock) > 0
        ? "有货"
        : "缺货";

    return `

      <div class="manage-card">

        <div class="manage-top">

          ${createVisualTile(item, category)}

          <div class="manage-info">

            <div class="manage-name">
              ${escapeHtml(item.name || "未命名")}
            </div>

            <label class="photo-only-label">

              <input
                type="checkbox"
                ${item.photoOnly ? "checked" : ""}
                onchange="
                  togglePhotoOnly(
                    '${category}',
                    '${item.id}',
                    this.checked
                  )
                ">

              只显示照片

            </label>

          </div>

          <button
            class="delete-btn"
            onclick="
              deleteItem(
                '${category}',
                '${item.id}'
              )
            ">
            删除
          </button>

        </div>


        <!-- 库存区域 -->

        <div class="stock-box">

          <div class="stock-title">
            📦 库存
          </div>

          <div class="stock-control">

            <button
              onclick="
                changeStock(
                  '${category}',
                  '${item.id}',
                  -1
                )
              ">
              −
            </button>

            <input
              type="number"
              min="0"
              value="${Number(item.stock) || 0}"
              onchange="
                setStock(
                  '${category}',
                  '${item.id}',
                  this.value
                )
              ">

            <button
              onclick="
                changeStock(
                  '${category}',
                  '${item.id}',
                  1
                )
              ">
              ＋
            </button>

            <span class="stock-status ${stockClass}">
              ${stockText}
            </span>

          </div>

        </div>

      </div>

    `;

  }).join("");
}


/* =====================================================
   ADD ITEM
===================================================== */

async function addItem(category) {

  const config = {

    styles: {
      nameId: "styleName",
      imageId: "styleImage",
      photoOnlyId: "stylePhotoOnly"
    },

    mainColors: {
      nameId: "mainColorName",
      imageId: "mainColorImage",
      photoOnlyId: "mainColorPhotoOnly"
    },

    secondaryColors: {
      nameId: "secondaryColorName",
      imageId: "secondaryColorImage",
      photoOnlyId: "secondaryColorPhotoOnly"
    },

    buttons: {
      nameId: "buttonName",
      imageId: "buttonImage",
      photoOnlyId: "buttonPhotoOnly"
    },

    charms: {
      nameId: "charmName",
      imageId: "charmImage",
      photoOnlyId: "charmPhotoOnly"
    }

  }[category];

  const name =
    document.getElementById(config.nameId).value.trim();

  const fileInput =
    document.getElementById(config.imageId);

  const photoOnly =
    document.getElementById(config.photoOnlyId).checked;

  if (!name && !fileInput.files.length) {

    alert("请至少输入名称，或者上传一张照片。");

    return;
  }

  let image = "";

  if (fileInput.files.length) {

    image = await readImage(fileInput.files[0]);

  }

  data[category].push({

    id: createId(),

    name: name || "照片项目",

    image,

    stock: 10,

    photoOnly

  });

  saveData();

  document.getElementById(config.nameId).value = "";
  document.getElementById(config.imageId).value = "";
  document.getElementById(config.photoOnlyId).checked = false;

  renderSettings();

  alert("添加成功！默认库存为 10。");
}


function readImage(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


/* =====================================================
   DELETE
===================================================== */

function deleteItem(category, id) {

  const item = getItem(category, id);

  if (!item) return;

  if (!confirm(`确定删除「${item.name}」吗？`)) {
    return;
  }

  data[category] =
    data[category].filter(item => item.id !== id);

  saveData();

  renderSettings();
}


/* =====================================================
   PHOTO ONLY
===================================================== */

function togglePhotoOnly(category, id, checked) {

  const item = getItem(category, id);

  if (!item) return;

  item.photoOnly = checked;

  saveData();

  renderSettings();
}


/* =====================================================
   STOCK
===================================================== */

function setStock(category, id, value) {

  const item = getItem(category, id);

  if (!item) return;

  let stock = parseInt(value, 10);

  if (isNaN(stock) || stock < 0) {
    stock = 0;
  }

  item.stock = stock;

  saveData();

  renderManageList(category);
}


function changeStock(category, id, amount) {

  const item = getItem(category, id);

  if (!item) return;

  item.stock =
    Math.max(
      0,
      Number(item.stock || 0) + amount
    );

  saveData();

  renderManageList(category);
}

          .push(input.value);

/* =====================================================
   ALLOWED ITEMS
===================================================== */

/*
  重要：

  visualPool：
  所有项目都可以出现于滚动画面
  包括库存 0 的项目。

  availablePool：
  最终结果只能从库存 > 0 的项目里选。
*/

function getVisualPool(slot, context) {

  const category =
    categoryMap[slot];

  let items =
    [...getItems(category)];

  if (!items.length) {
    return [];
  }

  if (slot === "mainColor" && context.style) {

    const rule =
      data.styleRules[context.style];

    if (
      rule &&
      Array.isArray(rule.mainColors) &&
      rule.mainColors.length > 0
    ) {

      items =
        items.filter(item =>
          rule.mainColors.includes(item.id)
        );

    }

  }


  if (
    slot === "secondaryColor" &&
    context.mainColor
  ) {

    const rule =
      data.mainColorRules[
        context.mainColor
      ];

    if (
      Array.isArray(rule) &&
      rule.length > 0
    ) {

      items =
        items.filter(item =>
          rule.includes(item.id)
        );

    }

  }


  if (
    (slot === "mainButton" ||
     slot === "subButton" ||
     slot === "charm") &&
    context.style
  ) {

    const rule =
      data.styleRules[context.style];

    if (
      rule &&
      Array.isArray(rule[categoryMap[slot]]) &&
      rule[categoryMap[slot]].length > 0
    ) {

      items =
        items.filter(item =>
          rule[categoryMap[slot]].includes(item.id)
        );

    }

  }

  return items;
}


function getAvailablePool(slot, context) {

  return getVisualPool(slot, context)
    .filter(item => Number(item.stock) > 0);
}


/* =====================================================
   FINAL RESULT GENERATION
===================================================== */

function pickRandom(arr) {

  if (!arr.length) return null;

  return arr[
    Math.floor(
      Math.random() * arr.length
    )
  ];
}


function generateFinalResults() {

  const result = {};

  /* 款式 */

  const styles =
    getAvailablePool("style", result);

  if (!styles.length) {
    throw new Error("没有可用的款式库存");
  }

  result.style =
    pickRandom(styles).id;


  /* 主色 */

  const mainColors =
    getAvailablePool("mainColor", result);

  if (!mainColors.length) {
    throw new Error("当前款式没有可用的主色库存");
  }

  result.mainColor =
    pickRandom(mainColors).id;


  /* 配色 */

  const secondaryColors =
    getAvailablePool(
      "secondaryColor",
      result
    );

  if (!secondaryColors.length) {
    throw new Error("当前主色没有可用的配色库存");
  }

  result.secondaryColor =
    pickRandom(secondaryColors).id;


  /* 主扣 */

  const mainButtons =
    getAvailablePool(
      "mainButton",
      result
    );

  if (!mainButtons.length) {
    throw new Error("没有可用的主扣库存");
  }

  result.mainButton =
    pickRandom(mainButtons).id;


  /* 副扣 */

  const subButtons =
    getAvailablePool(
      "subButton",
      result
    );

  if (!subButtons.length) {
    throw new Error("没有可用的副扣库存");
  }

  result.subButton =
    pickRandom(subButtons).id;


  /* 吊饰 */

  const charms =
    getAvailablePool(
      "charm",
      result
    );

  if (!charms.length) {
    throw new Error("没有可用的小吊饰库存");
  }

  result.charm =
    pickRandom(charms).id;


  return result;
}


/* =====================================================
   REEL RENDER
===================================================== */

function renderReels() {

  slotKeys.forEach(slot => {

    const reel =
      document.getElementById(
        "reel-" + slot
      );

    if (!reel) return;

    const pool =
      getVisualPool(slot, {});

    if (!pool.length) {

      reel.innerHTML = `
        <div class="reel-item">
          <div class="visual-tile">
            暂无项目
          </div>
        </div>
      `;

      return;
    }

    reel.innerHTML =
      createRepeatedReel(
        pool,
        slot
      );

  });

}


function createRepeatedReel(pool, slot) {

  /*
    确保滚动足够久，
    同时保证最终目标一定在内容范围内。
  */

  const itemHeight = 90;

  const rounds = Math.max(
    35,
    Math.ceil(
      9000 /
      (pool.length * itemHeight)
    ) + 5
  );

  let html = "";

  for (let r = 0; r < rounds; r++) {

    pool.forEach(item => {

      html += `
        <div class="reel-item">

          ${createItemVisual(
            item,
            categoryMap[slot]
          )}

        </div>
      `;

    });

  }

  return html;
}


/* =====================================================
   START ALL
===================================================== */

function startAll() {

  if (
    Object.values(slotState)
      .some(state => state && state.running)
  ) {

    return;

  }

  try {

    currentResult =
      generateFinalResults();

  } catch(e) {

    alert(e.message);

    return;
  }


  document
    .getElementById("resultArea")
    .classList.remove("show");


  /*
    根据最终结果重新生成每个 reel，
    确保限制条件正确。
  */

  const context = {};

  context.style =
    currentResult.style;


  context.mainColor =
    currentResult.mainColor;


  slotKeys.forEach(slot => {

    const reel =
      document.getElementById(
        "reel-" + slot
      );

    const pool =
      getVisualPool(slot, context);

    if (!pool.length) return;

    reel.innerHTML =
      createRepeatedReel(pool, slot);

  });


  /*
    六个一起开始
  */

  slotKeys.forEach(slot => {

    startSlot(
      slot,
      currentResult
    );

  });


  /*
    慢慢一个一个自动停止

    先滚 3 秒
    然后每 1 秒停一个
  */

  setTimeout(() => {

    slotKeys.forEach((slot, index) => {

      setTimeout(() => {

        if (
          slotState[slot] &&
          slotState[slot].running
        ) {

          stopSingle(slot);

        }

      }, index * 1000);

    });

  }, 3000);

}


/* =====================================================
   START SLOT
===================================================== */

function startSlot(slot, finalResult) {

  const reel =
    document.getElementById(
      "reel-" + slot
    );

  if (!reel) return;


  const context = {

    style: finalResult.style,

    mainColor:
      finalResult.mainColor

  };


  const pool =
    getVisualPool(
      slot,
      context
    );


  if (!pool.length) return;


  const targetId =
    finalResult[slot];


  let targetIndex =
    pool.findIndex(
      item => item.id === targetId
    );


  if (targetIndex < 0) {
    targetIndex = 0;
  }


  const itemHeight = 90;


  /*
    找到足够靠后的目标位置，
    防止一开始就停。
  */

  const currentTarget =
    Math.floor(
      18 + Math.random() * 10
    );


  const rounds =
    Math.floor(
      currentTarget / pool.length
    );


  const finalIndex =
    rounds * pool.length +
    targetIndex;


  /*
    中间格的位置是 90px。
    所以目标 item 的顶部要到：
    90px

    translateY:
    -(index * 90 - 90)
  */

  const finalTranslate =
    -(
      finalIndex * itemHeight -
      itemHeight
    );


  /*
    初始位置
  */

  reel.style.transition = "none";
  reel.style.transform = "translateY(0px)";


  /*
    开始无限滚动动画
  */

  let startTime = performance.now();

  const speed = 720;

  const state = {

    running: true,

    startTime,

    speed,

    pool,

    targetId,

    finalTranslate,

    animationFrame: null

  };

  slotState[slot] = state;


  function animate(now) {

    if (!slotState[slot] ||
        !slotState[slot].running) {

      return;

    }

    const elapsed =
      (now - startTime) / 1000;

    const distance =
      elapsed * speed;

    reel.style.transform =
      `translateY(-${distance}px)`;

    state.animationFrame =
      requestAnimationFrame(animate);

  }


  state.animationFrame =
    requestAnimationFrame(animate);

}


/* =====================================================
   STOP SINGLE
===================================================== */

function stopSingle(slot) {

  const state =
    slotState[slot];

  if (!state || !state.running) {
    return;
  }


  state.running = false;


  if (state.animationFrame) {

    cancelAnimationFrame(
      state.animationFrame
    );

  }


  const reel =
    document.getElementById(
      "reel-" + slot
    );


  /*
    先取得当前已经滚动到哪里
  */

  const elapsed =
    (performance.now() -
     state.startTime) / 1000;


  const currentDistance =
    elapsed * state.speed;


  /*
    目标必须落在中间格。

    当前已经滚到的位置，
    往后再推进几格，
    找到最终结果。
  */

  const itemHeight = 90;

  const currentIndex =
    Math.floor(
      currentDistance / itemHeight
    );


  const pool =
    state.pool;


  const targetIndex =
    pool.findIndex(
      item =>
        item.id === state.targetId
    );


  let finalIndex =
    currentIndex + 8;


  /*
    调整 finalIndex，
    让它的余数正好等于目标项目
  */

  const remainder =
    finalIndex % pool.length;


  finalIndex +=
    (
      targetIndex -
      remainder +
      pool.length
    ) % pool.length;


  /*
    最终位置：

    item 顶部 = 90px
    → 正好进入中间格
  */

  const finalTranslate =
    -(
      finalIndex * itemHeight -
      itemHeight
    );


  reel.style.transition =
    "transform 1.4s cubic-bezier(.12,.7,.15,1)";

  reel.style.transform =
    `translateY(${finalTranslate}px)`;


  /*
    检查是否全部停下
  */

  setTimeout(() => {

    checkAllStopped();

  }, 1500);

}


/* =====================================================
   ALL STOP
===================================================== */

function stopAll() {

  /*
    如果没有正在抽，
    不做任何事情
  */

  const running =
    slotKeys.filter(slot =>
      slotState[slot] &&
      slotState[slot].running
    );

  if (!running.length) {
    return;
  }


  running.forEach(slot => {

    stopSingle(slot);

  });

}


function checkAllStopped() {

  const stillRunning =
    slotKeys.some(slot =>
      slotState[slot] &&
      slotState[slot].running
    );

  if (stillRunning) {
    return;
  }


  showResult();

}


/* =====================================================
   SHOW RESULT
===================================================== */

function showResult() {

  if (!currentResult) return;


  const resultArea =
    document.getElementById(
      "resultArea"
    );

  const resultGrid =
    document.getElementById(
      "resultGrid"
    );


  const display = [

    {
      slot: "style",
      title: "款式"
    },

    {
      slot: "mainColor",
      title: "线材主色"
    },

    {
      slot: "secondaryColor",
      title: "线材配色"
    },

    {
      slot: "mainButton",
      title: "主扣"
    },

    {
      slot: "subButton",
      title: "副扣"
    },

    {
      slot: "charm",
      title: "小吊饰"
    }

  ];


  resultGrid.innerHTML =
    display.map(item => {

      const category =
        categoryMap[item.slot];

      const selected =
        getItem(
          category,
          currentResult[item.slot]
        );


      return `

        <div class="result-card">

          <div class="result-card-title">
            ${item.title}
          </div>

          ${createItemVisual(
            selected,
            category
          )}

        </div>

      `;

    }).join("");


  resultArea.classList.add("show");


  resultArea.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}


/* =====================================================
   CONFIRM RESULT
===================================================== */

function confirmResult() {

  if (!currentResult) {
    return;
  }


  if (
    !confirm(
      "确定要确认这组结果并扣库存吗？"
    )
  ) {

    return;

  }


  const used = [

    ["styles", currentResult.style],

    ["mainColors", currentResult.mainColor],

    [
      "secondaryColors",
      currentResult.secondaryColor
    ],

    ["buttons", currentResult.mainButton],

    ["buttons", currentResult.subButton],

    ["charms", currentResult.charm]

  ];


  /*
    注意：

    主扣和副扣如果抽到同一个，
    会扣两次。

    正是你之前要求的逻辑。
  */

  used.forEach(([category, id]) => {

    const item =
      getItem(category, id);

    if (item) {

      item.stock =
        Math.max(
          0,
          Number(item.stock || 0) - 1
        );

    }

  });


  saveData();


  alert(
    "💗 已确认！库存已经扣除。"
  );


  currentResult = null;

  document
    .getElementById("resultArea")
    .classList.remove("show");


  /*
    更新设置页面库存显示
  */

  renderSettings();

}


/* =====================================================
   INITIALIZE
===================================================== */

renderReels();

</script>
