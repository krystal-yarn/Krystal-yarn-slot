<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Krystal 的毛线研究室｜老虎机</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#f5a5c0;
  --primary-light:#ffe7f0;
  --primary-bg:#fff6fa;
  --deep:#d96d96;
  --line:#f2c8d8;
  --cream:#fffaf3;
  --brown:#6b4c4c;
  --text:#5d4a4a;
  --white:#fff;
  --shadow:0 8px 22px rgba(120,80,100,.12);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--primary-bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
  transition:background .3s ease;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

.app{
  min-height:100vh;
}

/* =========================
   Header
========================= */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,250,243,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1400px;
  margin:auto;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo-wrap{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  font-family:"ZCOOL KuaiLe",cursive;
  font-size:27px;
  color:var(--deep);
  white-space:nowrap;
}

.subtitle{
  font-size:13px;
  color:#a88383;
}

.nav{
  display:flex;
  gap:7px;
}

.nav button{
  border:0;
  background:transparent;
  color:#9b7777;
  padding:9px 15px;
  border-radius:20px;
  transition:.2s;
}

.nav button:hover{
  background:var(--primary-light);
}

.nav button.active{
  background:var(--primary);
  color:#fff;
}

/* =========================
   Main
========================= */

.main{
  max-width:1400px;
  margin:auto;
  padding:25px 24px 60px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* =========================
   Product Selector
========================= */

.product-selector{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:22px;
}

.product-btn{
  flex:1;
  min-width:180px;
  border:2px solid var(--line);
  background:#fff;
  color:var(--brown);
  border-radius:20px;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-weight:700;
  transition:.25s;
}

.product-btn:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.product-btn.active{
  background:var(--primary-light);
  border-color:var(--primary);
  color:var(--deep);
  box-shadow:var(--shadow);
}

.product-btn .emoji{
  font-size:23px;
}

.product-btn .small{
  display:block;
  font-size:11px;
  font-weight:400;
  opacity:.65;
  margin-top:2px;
}

/* =========================
   Cards
========================= */

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.card-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:15px;
}

.card-title h2,
.card-title h3{
  margin:0;
  font-family:"ZCOOL KuaiLe",cursive;
  color:var(--deep);
  font-weight:400;
}

.card-title h2{
  font-size:24px;
}

.card-title h3{
  font-size:20px;
}

.muted{
  color:#a58d8d;
  font-size:13px;
}

/* =========================
   Order
========================= */

.order-card{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
}

.order-card label{
  font-weight:700;
}

.order-input{
  flex:1;
  min-width:200px;
  border:1px solid var(--line);
  background:#fffafc;
  border-radius:14px;
  padding:12px 14px;
  outline:none;
}

.order-input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-light);
}

/* =========================
   Buttons
========================= */

.btn{
  border:0;
  border-radius:14px;
  padding:11px 16px;
  transition:.2s;
  font-weight:700;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--deep);
}

.btn-secondary{
  background:var(--primary-light);
  color:var(--deep);
}

.btn-danger{
  background:#ffe1e1;
  color:#c25b5b;
}

.btn-neutral{
  background:#f3eeee;
  color:#715f5f;
}

.btn-small{
  padding:7px 11px;
  border-radius:10px;
  font-size:12px;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

/* =========================
   Machine
========================= */

.machine-area{
  margin-top:20px;
}

.machine-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;
}

.machine{
  background:#fff;
  border:2px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  min-width:0;
}

.machine-title{
  background:var(--primary-light);
  color:var(--deep);
  text-align:center;
  padding:10px 7px;
  font-weight:700;
  font-size:14px;
}

.machine-window{
  height:160px;
  overflow:hidden;
  position:relative;
  background:#fffdfd;
}

.machine-window::before,
.machine-window::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:28px;
  z-index:3;
  pointer-events:none;
}

.machine-window::before{
  top:0;
  background:linear-gradient(to bottom,#fffdfd,transparent);
}

.machine-window::after{
  bottom:0;
  background:linear-gradient(to top,#fffdfd,transparent);
}

.machine-track{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  will-change:transform;
}

.reel-item{
  height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.visual{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px;
}

.visual img{
  max-width:100px;
  max-height:100px;
  object-fit:contain;
  border-radius:13px;
}

.visual-text{
  text-align:center;
  font-weight:700;
  color:var(--brown);
  line-height:1.3;
  word-break:break-word;
}

.machine-controls{
  display:flex;
  gap:7px;
  padding:9px;
  border-top:1px solid var(--line);
}

.machine-controls button{
  flex:1;
}

/* =========================
   Empty
========================= */

.empty{
  text-align:center;
  padding:35px 15px;
  color:#b49b9b;
}

.empty-icon{
  font-size:38px;
  margin-bottom:10px;
}

/* =========================
   Settings
========================= */

.settings-product{
  margin-bottom:20px;
}

.settings-style{
  margin-top:18px;
  border-top:1px dashed var(--line);
  padding-top:18px;
}

.style-config{
  display:grid;
  gap:12px;
}

.style-item{
  border:1px solid var(--line);
  background:#fffafa;
  border-radius:16px;
  padding:14px;
}

.style-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.style-name{
  font-weight:700;
  color:var(--brown);
}

.slot-check-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.slot-check{
  border:1px solid var(--line);
  background:#fff;
  padding:8px 11px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:6px;
}

.slot-check:has(input:checked){
  background:var(--primary-light);
  border-color:var(--primary);
  color:var(--deep);
}

.slot-check input{
  accent-color:var(--primary);
}

/* =========================
   Category
========================= */

.category{
  margin-top:18px;
}

.category-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}

.category-header h3{
  margin:0;
  font-size:18px;
  color:var(--deep);
}

.item-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:10px;
}

.item-card{
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  background:#fffdfd;
}

.item-main{
  display:flex;
  gap:10px;
  align-items:center;
}

.item-preview{
  width:65px;
  height:65px;
  flex:none;
  border-radius:12px;
  background:var(--primary-light);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.item-preview img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.item-preview span{
  font-size:11px;
  text-align:center;
  padding:5px;
  color:var(--deep);
}

.item-info{
  flex:1;
  min-width:0;
}

.item-name-input{
  width:100%;
  border:1px solid #eadede;
  border-radius:9px;
  padding:7px 8px;
  margin-bottom:6px;
  background:#fff;
}

.item-meta{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  font-size:12px;
  color:#9b8585;
}

.stock-input{
  width:70px;
  border:1px solid #eadede;
  border-radius:8px;
  padding:5px;
}

.item-actions{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.file-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--primary-light);
  color:var(--deep);
  border-radius:9px;
  padding:6px 9px;
  font-size:12px;
  cursor:pointer;
}

.file-label input{
  display:none;
}

/* =========================
   Rules
========================= */

.rule-section{
  margin-top:20px;
}

.rule-box{
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  background:#fffdfd;
  margin-bottom:12px;
}

.rule-title{
  font-weight:700;
  color:var(--brown);
  margin-bottom:10px;
}

.rule-note{
  font-size:12px;
  color:#a48e8e;
  margin-bottom:10px;
}

.rule-source{
  padding:10px 0;
  border-top:1px dashed #eadada;
}

.rule-source:first-child{
  border-top:0;
}

.rule-source-name{
  font-weight:700;
  margin-bottom:7px;
}

.check-grid{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.check-option{
  font-size:12px;
  background:#fff;
  border:1px solid #eadada;
  border-radius:9px;
  padding:6px 8px;
}

.check-option input{
  accent-color:var(--primary);
}

/* =========================
   History
========================= */

.history-list{
  display:grid;
  gap:12px;
}

.history-card{
  border:1px solid var(--line);
  border-radius:17px;
  background:#fff;
  padding:15px;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.history-order{
  font-weight:700;
  color:var(--deep);
}

.history-time{
  color:#a18c8c;
  font-size:12px;
}

.product-tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 9px;
  border-radius:10px;
  background:var(--primary-light);
  color:var(--deep);
  font-size:12px;
}

.history-results{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:8px;
}

.history-result{
  background:#fffafa;
  border:1px solid #f1e2e2;
  border-radius:12px;
  padding:8px;
  text-align:center;
}

.history-result img{
  width:55px;
  height:55px;
  object-fit:contain;
  display:block;
  margin:auto;
}

.history-result-name{
  font-size:12px;
  margin-top:5px;
  font-weight:700;
}

.history-result-title{
  font-size:11px;
  color:#a28c8c;
}

/* =========================
   Modal
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(80,50,60,.35);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-card{
  background:#fff;
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:24px;
  padding:22px;
  box-shadow:0 20px 60px rgba(50,30,40,.25);
}

.modal-title{
  font-family:"ZCOOL KuaiLe",cursive;
  color:var(--deep);
  font-size:26px;
  margin-bottom:18px;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:10px;
}

.result-card{
  border:1px solid var(--line);
  border-radius:15px;
  padding:10px;
  text-align:center;
  background:#fffafa;
}

.result-card img{
  width:85px;
  height:85px;
  object-fit:contain;
}

.result-card-title{
  color:#a58b8b;
  font-size:12px;
  margin-bottom:5px;
}

.result-card-name{
  font-weight:700;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:18px;
  flex-wrap:wrap;
}

/* =========================
   Toast
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translate(-50%,20px);
  background:#5d4a4a;
  color:#fff;
  padding:11px 18px;
  border-radius:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:2000;
  font-size:14px;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   Responsive
========================= */

@media(max-width:800px){
  .header-inner{
    padding:13px 15px;
    align-items:flex-start;
  }

  .logo{
    font-size:22px;
  }

  .subtitle{
    display:none;
  }

  .nav button{
    padding:8px 10px;
    font-size:12px;
  }

  .main{
    padding:18px 13px 40px;
  }

  .product-btn{
    min-width:calc(33.333% - 9px);
    padding:12px 7px;
  }

  .product-btn .small{
    display:none;
  }

  .machine-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .machine-window{
    height:140px;
  }

  .reel-item{
    height:140px;
  }

  .item-list{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){
  .logo{
    font-size:19px;
  }

  .nav{
    gap:2px;
  }

  .nav button{
    padding:7px 8px;
  }

  .product-selector{
    gap:7px;
  }

  .product-btn{
    min-width:calc(33.333% - 5px);
    border-radius:14px;
    padding:10px 3px;
    font-size:12px;
  }

  .product-btn .emoji{
    font-size:19px;
  }

  .machine-grid{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .machine-title{
    font-size:12px;
  }

  .machine-window{
    height:125px;
  }

  .reel-item{
    height:125px;
  }

  .visual img{
    max-width:70px;
    max-height:70px;
  }

  .visual-text{
    font-size:12px;
  }

  .machine-controls{
    padding:6px;
  }

  .machine-controls button{
    font-size:11px;
    padding:6px 3px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">
    <div class="header-inner">

      <div class="logo-wrap">
        <div class="logo">🧶 Krystal 的毛线研究室</div>
        <div class="subtitle">甜甜配色 · 今天抽到什么呢？</div>
      </div>

      <nav class="nav">
        <button id="navDraw" class="active" onclick="showPage('draw')">🎰 抽取</button>
        <button id="navHistory" onclick="showPage('history')">📖 历史</button>
        <button id="navSettings" onclick="showPage('settings')">⚙️ 设置</button>
      </nav>

    </div>
  </header>


  <main class="main">

    <!-- =========================
         DRAW PAGE
    ========================== -->

    <section id="pageDraw" class="page active">

      <div class="product-selector" id="drawProductSelector"></div>

      <div class="card order-card">

        <label>订单编号</label>

        <input
          id="orderInput"
          class="order-input"
          placeholder="例如：KS20260919001"
          autocomplete="off"
        >

        <button class="btn btn-primary" onclick="startAll()">
          🎰 全部开始
        </button>

        <button class="btn btn-secondary" onclick="stopAll()">
          🛑 全部停止
        </button>

      </div>

      <div class="machine-area">
        <div id="machineGrid" class="machine-grid"></div>
      </div>

    </section>


    <!-- =========================
         HISTORY PAGE
    ========================== -->

    <section id="pageHistory" class="page">

      <div class="product-selector" id="historyProductSelector"></div>

      <div class="card">

        <div class="card-title">
          <div>
            <h2>📖 抽取历史</h2>
            <div class="muted">不同产品的抽取记录会分开保存</div>
          </div>

          <button class="btn btn-danger btn-small" onclick="clearCurrentProductHistory()">
            清除当前产品
          </button>
        </div>

        <div id="historyList" class="history-list"></div>

      </div>

    </section>


    <!-- =========================
         SETTINGS PAGE
    ========================== -->

    <section id="pageSettings" class="page">

      <div class="product-selector" id="settingsProductSelector"></div>

      <div class="card">

        <div class="card-title">
          <div>
            <h2>⚙️ 产品设置</h2>
            <div class="muted">
              每个产品都有自己的款式、材料、库存和抽取规则
            </div>
          </div>
        </div>

        <div id="settingsContent"></div>

      </div>

    </section>

  </main>
</div>


<!-- =========================
     RESULT MODAL
========================== -->

<div id="resultModal" class="modal">

  <div class="modal-card">

    <div class="modal-title">
      🎀 抽取结果
    </div>

    <div id="resultProduct"></div>

    <div id="resultGrid" class="result-grid"></div>

    <div class="modal-actions">

      <button class="btn btn-neutral" onclick="closeResult()">
        再看看
      </button>

      <button class="btn btn-primary" onclick="confirmResult()">
        ✨ 确认结果并扣库存
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>
/* ============================================================
   Krystal 的毛线研究室｜老虎机
   多产品版本
============================================================ */


/* ============================================================
   1. 产品定义
============================================================ */

const PRODUCT_DEFS = {

  phoneStrap:{
    id:"phoneStrap",
    name:"手机挂绳",
    emoji:"🩷",
    theme:{
      primary:"#f5a5c0",
      primaryLight:"#ffe7f0",
      primaryBg:"#fff6fa",
      deep:"#d96d96",
      line:"#f2c8d8"
    }
  },

  scrunchie:{
    id:"scrunchie",
    name:"发圈",
    emoji:"💙",
    theme:{
      primary:"#8ecae6",
      primaryLight:"#e5f6ff",
      primaryBg:"#f4fbff",
      deep:"#4d9fc2",
      line:"#c4e6f2"
    }
  },

  bag:{
    id:"bag",
    name:"包包",
    emoji:"💜",
    theme:{
      primary:"#b99ad9",
      primaryLight:"#f1e8fa",
      primaryBg:"#faf7ff",
      deep:"#8b68ae",
      line:"#ddcdec"
    }
  }

};


/* ============================================================
   2. 每个产品默认的格子模板
   style = 永远第一格
============================================================ */

const PRODUCT_SLOT_TEMPLATES = {

  phoneStrap:[
    {
      id:"mainColor",
      type:"mainColor",
      title:"线材主色"
    },
    {
      id:"secondaryColor1",
      type:"secondaryColor",
      title:"线材配色"
    },
    {

============================================================ */

const STORAGE_KEY = "krystal_slot_machine_v2";
const OLD_STORAGE_KEY = "krystal_slot_machine";


function migrateOldData(){

  try{

    const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);

    if(!oldRaw){
      return false;
    }

    const old = JSON.parse(oldRaw);

    if(!old || !old.styles){
      return false;
    }

    const product = createDefaultProduct("phoneStrap");

    product.styles = old.styles;

    product.categories.mainColor = old.mainColors || [];
    product.categories.secondaryColor = old.secondaryColors || [];
    product.categories.button = old.mainButtons || [];
    product.categories.charm = old.charms || [];

    /*
      老版本没有 style.slots
      所以给它恢复成旧版的六格。
    */

    product.styles.forEach(style=>{
      if(!Array.isArray(style.slots)){
        style.slots=[
          "mainColor",
          "secondaryColor1",
          "mainButton",
          "subButton",
          "charm"
        ];
      }
    });

    data.products.phoneStrap = product;

    if(Array.isArray(old.history)){
      data.history = old.history.map(record=>({
        ...record,
        productId:"phoneStrap"
      }));
    }

    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));

    return true;

  }catch(error){

    console.error("旧数据迁移失败",error);
    return false;

  }

}


function loadData(){

  try{

    const raw = localStorage.getItem(STORAGE_KEY);

    if(raw){

      const saved = JSON.parse(raw);

      if(saved.products){
        data.products = saved.products;
      }

      if(Array.isArray(saved.history)){
        data.history = saved.history;
      }

    }else{

      migrateOldData();

    }

  }catch(error){

    console.error("读取数据失败",error);

  }


  ensureDataStructure();
}


function saveData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    console.error("保存失败",error);

  }

}


function ensureDataStructure(){

  for(const productId of Object.keys(PRODUCT_DEFS)){

    if(!data.products[productId]){
      data.products[productId] =
        createDefaultProduct(productId);
    }

    const product = data.products[productId];

    if(!Array.isArray(product.styles)){
      product.styles=[];
    }

    if(!product.categories){
      product.categories={};
    }

    if(!product.rules){
      product.rules={
        styleToCategory:{},
        categoryToCategory:{}
      };
    }

    if(!product.rules.styleToCategory){
      product.rules.styleToCategory={};
    }

    if(!product.rules.categoryToCategory){
      product.rules.categoryToCategory={};
    }

    /*
      防止旧数据里的款式没有 slots
    */

    const defaultSlots =
      PRODUCT_SLOT_TEMPLATES[productId] || [];

    product.styles.forEach(style=>{

      if(!Array.isArray(style.slots)){

        style.slots =
          defaultSlots.map(x=>x.id);

      }

    });

  }

}

   10. Slot helpers
============================================================ */

function getSlotTemplate(productId,slotId){

  const templates =
    PRODUCT_SLOT_TEMPLATES[productId] || [];

  return templates.find(
    slot=>slot.id===slotId
  );

}


function getCurrentSlots(){

  const product =
    data.products[currentProduct];

  /*
    款式永远是第一格
  */

  const slots=[
    {
      id:"style",
      type:"style",
      title:"款式"
    }
  ];

  /*
    如果还没有抽款式，
    显示所有产品模板供老虎机准备。
  */

  if(!product.styles.length){
    return slots;
  }

  /*
    当前尚未抽款式时，
    使用第一个款式的 slots 作为机器预览。
  */

  let style = null;

  if(finalResult && finalResult.style){

    style =
      product.styles.find(
        item=>item.id===finalResult.style.id
      );

  }

  if(!style){
    style = product.styles[0];
  }

  const selected =
    Array.isArray(style.slots)
      ? style.slots
      : [];


  selected.forEach(slotId=>{

    const template =
      getSlotTemplate(currentProduct,slotId);

    if(template){

      slots.push({
        ...template
      });

    }

  });


  return slots;

}


/* ============================================================
   11. 根据已选款式得到实际格子
============================================================ */

function getSlotsForStyle(styleId){

  const product =
    data.products[currentProduct];

  const style =
    product.styles.find(
      item=>item.id===styleId
    );

  const slots=[
    {
      id:"style",
      type:"style",
      title:"款式"
    }
  ];

  if(!style){
    return slots;
  }

  (style.slots || []).forEach(slotId=>{

    const template =
      getSlotTemplate(currentProduct,slotId);

    if(template){
      slots.push({...template});
    }

  });

  return slots;

}

function visualHTML(item){

            ? ""

        ${escapeHTML(item.name)}
      </div>
    </div>
  `;

}


function resultVisualHTML(item){

  return visualHTML(item);

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   13. Pool
============================================================ */

function getVisualPool(slot,context={}){

  const product =
    data.products[currentProduct];

  if(slot.type==="style"){

    return product.styles;

  }


  const category =
    slot.type;

  let pool =
    product.categories[category] || [];


  /*
    style → category 限制
  */

  if(context.style){

    const styleId =
      context.style.id;

    const key =
      `${styleId}__${category}`;

    const allowed =
      product.rules.styleToCategory[key];

    if(Array.isArray(allowed) && allowed.length){

      pool =
        pool.filter(
          item=>allowed.includes(item.id)
        );

    }

  }


  /*
    category → category 限制
  */

  if(context.previous){

    const previous =
      context.previous;

    const key =
      `${previous.category}__${previous.item.id}__${category}`;

    const allowed =
      product.rules.categoryToCategory[key];

    if(Array.isArray(allowed) && allowed.length){

      pool =
        pool.filter(
          item=>allowed.includes(item.id)
        );

    }

  }


  return pool;

}


function getAvailablePool(slot,context={}){

  return getVisualPool(slot,context)
    .filter(item=>{

      /*
        款式库存也检查
      */

      return Number(item.stock ?? 0) > 0;

    });

}

/* ============================================================
   15. Setup machine
============================================================ */

function setupMachine(slot){

  const track =
    document.getElementById(
      `track_${slot.id}`
    );

  if(!track){
    return;
  }


  let pool=[];

  if(slot.type==="style"){

    pool =
      getAvailablePool(slot);

  }else{

    pool =
      getAvailablePool(slot,{

        style:
          data.products[currentProduct]
            .styles[0]

      });

  }


  if(!pool.length){

    track.innerHTML=`

      <div class="reel-item">

        <div class="visual">

          <div class="visual-text">
            暂无库存
          </div>

        </div>

      </div>

    `;

    return;

  }


  /*
    重复很多次，
    让老虎机看起来一直滚
  */

  const repeated=[];

  for(let i=0;i<40;i++){

    pool.forEach(item=>{
      repeated.push(item);
    });

  }


  track.innerHTML =
    repeated.map(item=>`

      <div class="reel-item">
        ${visualHTML(item)}
      </div>

    `)
    .join("");

}


/* ============================================================
   16. Generate final result
============================================================ */

function generateFinalResult(){

  const product =
    data.products[currentProduct];


  const result={};

  /*
    第一格：款式
  */

  const styleSlot={
    id:"style",
    type:"style",
    title:"款式"
  };

  const styles =
    getAvailablePool(styleSlot);

  if(!styles.length){

    throw new Error("没有可用的款式库存");

  }

  const style =
    randomItem(styles);

  result.style = style;


  /*
    根据这个款式决定后面到底有几格
  */

  const slots =
    getSlotsForStyle(style.id);


  let previous = null;


  for(let i=1;i<slots.length;i++){

    const slot =
      slots[i];

    let pool =
      getAvailablePool(
        slot,
        {
          style,
          previous
        }
      );


    /*
      如果存在规则但导致无库存，
      再尝试只按照 style 过滤。
      这样不会因为前一个条件导致老虎机完全无法抽。
    */

    if(!pool.length){

      pool =
        getAvailablePool(
          slot,
          {
            style
          }
        );

    }


    if(!pool.length){

      throw new Error(
        `「${slot.title}」没有可抽取的库存`
      );

    }


    const item =
      randomItem(pool);


    result[slot.id]=item;


    previous={
      category:slot.type,
      item
    };

  }


  result.slots=slots;

  return result;

}


function randomItem(arr){

  return arr[
    Math.floor(Math.random()*arr.length)
  ];

}

/* ============================================================
   19. Setup running machine
============================================================ */

function setupMachineWithContext(slot,context){

  const track =
    document.getElementById(
      `track_${slot.id}`
    );

  if(!track){
    return;
  }


  const product =
    data.products[currentProduct];


  let pool =
    getAvailablePool(
      slot,
      {
        style:context.style
      }
    );


  if(!pool.length){

    pool =
      getVisualPool(
        slot,
        {
          style:context.style
        }
      );

  }


  if(!pool.length){

    pool =
      data.products[currentProduct]
        .categories[slot.type] || [];

  }


  if(!pool.length){
    return;
  }


  const repeated=[];

  for(let i=0;i<60;i++){

    pool.forEach(item=>{
      repeated.push(item);
    });

  }


  track.innerHTML =
    repeated.map(item=>`

      <div class="reel-item">
        ${visualHTML(item)}
      </div>

    `)
    .join("");


  track.dataset.itemHeight =
    getReelItemHeight();

}


function getReelItemHeight(){

  return window.innerWidth<=500
    ? 125
    : window.innerWidth<=800
      ? 140
      : 160;

}


/* ============================================================
   20. Start single
============================================================ */

function startSingle(slotId){

  if(!finalResult){

    toast("请先点击全部开始");
    return;

  }


  if(!isDrawing){

    toast("现在没有正在进行的抽取");
    return;

  }


  if(running[slotId]){
    return;
  }


  running[slotId]=true;

  startSlot(slotId);

}


/* ============================================================
   21. Animation
============================================================ */

function startSlot(slotId){

  const track =
    document.getElementById(
      `track_${slotId}`
    );

  if(!track){
    return;
  }


  let position =
    Number(track.dataset.position || 0);


  function animate(){

    if(!running[slotId]){
      return;
    }


    position += 13;


    track.style.transform =
      `translateY(-${position}px)`;


    track.dataset.position =
      position;


    track._raf =
      requestAnimationFrame(animate);

  }


  animate();

}


/* ============================================================
   22. Stop single
============================================================ */

function stopSingle(slotId){

  if(!finalResult){
    return;
  }


  if(!running[slotId]){
    return;
  }


  running[slotId]=false;


  const track =
    document.getElementById(
      `track_${slotId}`
    );


  if(track && track._raf){

    cancelAnimationFrame(
      track._raf
    );

  }


  /*
    让指定结果移动到窗口中央
  */

  const item =
    finalResult[slotId];


  if(!item){
    checkAllStopped();
    return;
  }


  const pool =
    getPoolForSlotResult(
      slotId,
      item
    );


  const index =
    pool.findIndex(
      x=>x.id===item.id
    );


  const itemHeight =
    getReelItemHeight();


  /*
    找到比较靠后的位置，
    避免一停下来就看到最前面的结果。
  */

  const repeatCount=20;

  let targetIndex =
    repeatCount*pool.length + index;


  if(targetIndex<0){
    targetIndex=0;
  }


  const targetY =
    targetIndex*itemHeight;


  if(track){

    track.style.transition =
      "transform .7s cubic-bezier(.2,.8,.2,1)";

    track.style.transform =
      `translateY(-${targetY}px)`;

    track.dataset.position =
      targetY;

    setTimeout(()=>{

      track.style.transition="";

    },750);

  }


  checkAllStopped();

}


function getPoolForSlotResult(slotId,item){

  const slot =
    finalResult.slots.find(
      s=>s.id===slotId
    );


  if(!slot){
    return [item];
  }


  let pool =
    getVisualPool(
      slot,
      {
        style:finalResult.style
      }
    );


  if(!pool.some(x=>x.id===item.id)){

    pool =
      data.products[currentProduct]
        .categories[slot.type] || [];

  }


  return pool.length
    ? pool
    : [item];

}


/* ============================================================

============================================================ */

function stopAll(){

  if(!finalResult){

/* ============================================================
   26. Confirm result
============================================================ */

function confirmResult(){

  if(!finalResult){
    return;
  }


  const product =
    data.products[currentProduct];


  /*
    扣库存
  */

  finalResult.slots.forEach(slot=>{

    const item =
      finalResult[slot.id];

    if(!item){
      return;
    }


    let target=null;


    if(slot.type==="style"){

      target =
        product.styles.find(
          x=>x.id===item.id
        );

    }else{

      const list =
        product.categories[slot.type] || [];

      target =
        list.find(
          x=>x.id===item.id
        );

    }


    if(target){

      target.stock =
        Math.max(
          0,
          Number(target.stock || 0)-1
        );

    }

  });


  const order =
    document.getElementById(
      "orderInput"
    ).value.trim();


  const historyResult={};


  finalResult.slots.forEach(slot=>{

    historyResult[slot.id]=
      finalResult[slot.id];

  });


  data.history.unshift({

    id:
      Date.now().toString(36)
      +Math.random().toString(36).slice(2),

    productId:currentProduct,

    order,

    time:new Date().toISOString(),

    result:historyResult,

    slots:finalResult.slots

  });


  saveData();


  closeResult();


  finalResult=null;

  running={};

  document.getElementById(
    "orderInput"
  ).value="";


  renderReels();

  renderHistory();

  renderSettings();


  toast("已经确认，库存已扣除 ✨");

}

function addStyle(){

  const product =
    data.products[currentProduct];


  const id =
    "style_" +
    Date.now().toString(36);


  const name =
    prompt(
      "请输入新款式名称",
      "新款式"
    );


  if(!name){
    return;
  }


  product.styles.push({

    id,
    name:name.trim(),

    image:"",
    photoOnly:false,

    stock:999,

    slots:
      (
        PRODUCT_SLOT_TEMPLATES[currentProduct] || []
      )
      .slice(0,2)
      .map(slot=>slot.id)

  });


  saveData();

  renderSettings();

  toast("款式已添加");

}


function deleteStyle(styleId){

  const product =
    data.products[currentProduct];


  const style =
    product.styles.find(
      x=>x.id===styleId
    );


  if(!style){
    return;
  }


  if(!confirm(
    `确定删除「${style.name}」吗？`
  )){
    return;
  }


  product.styles =
    product.styles.filter(
      x=>x.id!==styleId
    );


  saveData();

  renderSettings();

  renderReels();

}


function updateStyleName(styleId,name){

  const product =
    data.products[currentProduct];


  const style =
    product.styles.find(
      x=>x.id===styleId
    );


  if(style){

    style.name =
      name.trim() || "未命名款式";

    saveData();

  }

}


function toggleStyleSlot(
  styleId,
  slotId,
  checked
){

  const product =
    data.products[currentProduct];


  const style =
    product.styles.find(
      x=>x.id===styleId
    );


  if(!style){
    return;
  }


  if(!Array.isArray(style.slots)){
    style.slots=[];
  }


  if(checked){

    if(!style.slots.includes(slotId)){
      style.slots.push(slotId);
    }

  }else{

    style.slots =
      style.slots.filter(
        id=>id!==slotId
      );

  }


  saveData();

  renderSettings();

}


function uploadStyleImage(styleId,input){

  const file =
    input.files?.[0];


  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload=e=>{

    const product =
      data.products[currentProduct];


    const style =
      product.styles.find(
        x=>x.id===styleId
      );


    if(style){

      style.image =
        e.target.result;

      saveData();

      renderSettings();

      toast("款式图片已保存");

    }

  };


  reader.readAsDataURL(file);

}


function removeStyleImage(styleId){

  const product =
    data.products[currentProduct];


  const style =
    product.styles.find(
      x=>x.id===styleId
    );


  if(style){

    style.image="";

    saveData();

    renderSettings();

  }

}


function updateStylePhotoOnly(
  styleId,
  checked
){

  const product =
    data.products[currentProduct];


  const style =
    product.styles.find(
      x=>x.id===styleId
    );


  if(style){

    style.photoOnly =
      checked;

    saveData();

  }

}

/* ============================================================
   33. Category operations
============================================================ */

function addCategoryItem(category){

  const product =
    data.products[currentProduct];


  const title =
    CATEGORY_TITLES[category]
    || category;


  const name =
    prompt(
      `请输入「${title}」名称`
    );


  if(!name){
    return;
  }


  const id =
    category + "_" +
    Date.now().toString(36);


  if(!product.categories[category]){
    product.categories[category]=[];
  }


  product.categories[category].push({

    id,
    name:name.trim(),

    image:"",
    photoOnly:false,

    stock:5

  });


  saveData();

  renderSettings();

}


function deleteCategoryItem(
  category,
  itemId
){

  const product =
    data.products[currentProduct];


  if(!product.categories[category]){
    return;
  }


  const item =
    product.categories[category]
      .find(x=>x.id===itemId);


  if(!item){
    return;
  }


  if(!confirm(
    `确定删除「${item.name}」吗？`
  )){
    return;
  }


  product.categories[category] =
    product.categories[category]
      .filter(x=>x.id!==itemId);


  /*
    同时清理所有规则中
    已经不存在的 item
  */

  cleanupRules();


  saveData();

  renderSettings();

}


function updateItemName(
  category,
  itemId,
  name
){

  const item =
    getCategoryItem(
      category,
      itemId
    );


  if(item){

    item.name =
      name.trim() || "未命名";

    saveData();

  }

}


function updateItemStock(
  category,
  itemId,
  stock
){

  const item =
    getCategoryItem(
      category,
      itemId
    );


  if(item){

    item.stock =
      Math.max(
        0,
        Number(stock || 0)
      );

    saveData();

  }

}


function updateItemPhotoOnly(
  category,
  itemId,
  checked
){

  const item =
    getCategoryItem(
      category,
      itemId
    );


  if(item){

    item.photoOnly =
      checked;

    saveData();

  }

}


function getCategoryItem(
  category,
  itemId
){

  const product =
    data.products[currentProduct];


  return (
    product.categories[category] || []
  )
  .find(
    x=>x.id===itemId
  );

}


function uploadCategoryImage(
  category,
  itemId,
  input
){

  const file =
    input.files?.[0];


  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload=e=>{

    const item =
      getCategoryItem(
        category,
        itemId
      );


    if(item){

      item.image =
        e.target.result;

      saveData();

      renderSettings();

    }

  };


  reader.readAsDataURL(file);

}


function removeCategoryImage(
  category,
  itemId
){

  const item =
    getCategoryItem(
      category,
      itemId
    );


  if(item){

    item.image="";

    saveData();

    renderSettings();

  }

}


/* ============================================================
   34. Rules
============================================================ */

function renderRules(product){

  return `

    <div class="rule-box">

      <div class="rule-title">
        ① 款式 → 材料限制
      </div>

      <div class="rule-note">
        例如：云朵包只能抽金黄色、橘黄色。
        如果某个材料没有勾选，就不会出现在这个款式里。
        不勾选任何材料 = 不限制。
      </div>

      ${renderStyleRules(product)}

    </div>


    <div class="rule-box">

      <div class="rule-title">
        ② 材料 → 材料搭配限制
      </div>

      <div class="rule-note">
        例如：金黄色主色只能搭米白、橘色。
        同样可以不设置限制，让它完全随机。
      </div>

      ${renderCategoryRules(product)}

    </div>

  `;

}


/* ============================================================
   35. Style rules
============================================================ */

function renderStyleRules(product){

  const categories =
    Object.keys(product.categories);


  return product.styles.map(style=>`

    <div class="rule-source">

      <div class="rule-source-name">

        ${escapeHTML(style.name)}

      </div>


      ${categories.map(category=>{

        const items =
          product.categories[category] || [];


        if(!items.length){
          return "";
        }


        const title =
          CATEGORY_TITLES[category]
          || category;


        const key =
          `${style.id}__${category}`;


        const allowed =
          product.rules.styleToCategory[key]
          || [];


        const hasRule =
          Array.isArray(allowed)
          && allowed.length>0;


        return `

          <div style="
            margin-top:9px;
          ">

            <div style="
              font-size:12px;
              color:#9b8585;
              margin-bottom:5px;
            ">

              ${escapeHTML(title)}

            </div>


            <div class="check-grid">

              ${items.map(item=>`

                <label class="check-option">

                  <input
                    type="checkbox"

                    ${
                      hasRule
                        ? (
                            allowed.includes(item.id)
                              ? "checked"
                              : ""
                          )
                        : ""
                    }

                    onchange="
                      toggleStyleRule(
                        '${style.id}',
                        '${category}',
                        '${item.id}',
                        this.checked
                      )
                    "
                  >

                  ${escapeHTML(item.name)}

                </label>

              `).join("")}

            </div>


            <div style="
              font-size:11px;
              color:#b19a9a;
              margin-top:4px;
            ">

              ${
                hasRule
                  ? "已设置限制"
                  : "目前不限制"

              }

            </div>

          </div>

        `;

      }).join("")}

    </div>

  `).join("");

}


/* ============================================================
   36. Category rules
============================================================ */

function renderCategoryRules(product){

  const categories =
    Object.keys(product.categories);


  let html="";


  categories.forEach(sourceCategory=>{

    const sourceItems =
      product.categories[sourceCategory] || [];


    sourceItems.forEach(sourceItem=>{

      categories.forEach(targetCategory=>{

        if(
          sourceCategory===targetCategory
        ){
          return;
        }


        const targetItems =
          product.categories[targetCategory] || [];


        if(!targetItems.length){
          return;
        }


        const key =
          `${sourceCategory}__${sourceItem.id}__${targetCategory}`;


        const allowed =
          product.rules.categoryToCategory[key]
          || [];


        const hasRule =
          Array.isArray(allowed)
          && allowed.length>0;


        html+=`

          <div class="rule-source">

            <div class="rule-source-name">

              ${escapeHTML(sourceItem.name)}

              <span style="
                color:#b29b9b;
                font-size:12px;
                font-weight:400;
              ">
                →
                ${escapeHTML(
                  CATEGORY_TITLES[targetCategory]
                  || targetCategory
                )}
              </span>

            </div>


            <div class="check-grid">

              ${targetItems.map(targetItem=>`

                <label class="check-option">

                  <input
                    type="checkbox"

                    ${
                      hasRule
                        ? (
                            allowed.includes(
                              targetItem.id
                            )
                              ? "checked"
                              : ""
                          )
                        : ""
                    }

                    onchange="
                      toggleCategoryRule(
                        '${sourceCategory}',
                        '${sourceItem.id}',
                        '${targetCategory}',
                        '${targetItem.id}',
                        this.checked
                      )
                    "
                  >

                  ${escapeHTML(targetItem.name)}

                </label>

              `).join("")}

            </div>


            <div style="
              font-size:11px;
              color:#b19a9a;
              margin-top:4px;
            ">

              ${
                hasRule
                  ? "已设置限制"
                  : "目前不限制"
              }

            </div>

          </div>

        `;

      });

    });

  });


  return html ||
    `<div class="empty">暂时没有可设置的搭配规则。</div>`;

}


/* ============================================================
   37. Toggle style rule
============================================================ */

function toggleStyleRule(
  styleId,
  category,
  itemId,
  checked
){

  const product =
    data.products[currentProduct];


  const key =
    `${styleId}__${category}`;


  if(!product.rules.styleToCategory[key]){
    product.rules.styleToCategory[key]=[];
  }


  const list =
    product.rules.styleToCategory[key];


  if(checked){

    if(!list.includes(itemId)){
      list.push(itemId);
    }

  }else{

    const index =
      list.indexOf(itemId);

    if(index>=0){
      list.splice(index,1);
    }

  }


  /*
    如果全部取消，
    就代表“不限制”
  */

  if(list.length===0){

    delete product.rules.styleToCategory[key];

  }


  saveData();

  renderSettings();

}


/* ============================================================
   38. Toggle category rule
============================================================ */

function toggleCategoryRule(
  sourceCategory,
  sourceItemId,
  targetCategory,
  targetItemId,
  checked
){

  const product =
    data.products[currentProduct];


  const key =
    `${sourceCategory}__${sourceItemId}__${targetCategory}`;


  if(!product.rules.categoryToCategory[key]){
    product.rules.categoryToCategory[key]=[];
  }


  const list =
    product.rules.categoryToCategory[key];


  if(checked){

    if(!list.includes(targetItemId)){
      list.push(targetItemId);
    }

  }else{

    const index =
      list.indexOf(targetItemId);

    if(index>=0){
      list.splice(index,1);
    }

  }


  if(list.length===0){

    delete product.rules.categoryToCategory[key];

  }


  saveData();

  renderSettings();

}


/* ============================================================
   39. Cleanup rules
============================================================ */

function cleanupRules(){

  const product =
    data.products[currentProduct];


  /*
    清理 style rules
  */

  Object.keys(
    product.rules.styleToCategory
  )
  .forEach(key=>{

    const [styleId,category] =
      key.split("__");


    const existingIds =
      new Set(
        (
          product.categories[category]
          || []
        )
        .map(item=>item.id)
      );


    product.rules.styleToCategory[key] =
      product.rules.styleToCategory[key]
        .filter(
          id=>existingIds.has(id)
        );


    if(
      !product.rules.styleToCategory[key].length
    ){

      delete product.rules.styleToCategory[key];

    }

  });


  /*
    清理 category rules
  */

  Object.keys(
    product.rules.categoryToCategory
  )
  .forEach(key=>{

    const parts =
      key.split("__");


    if(parts.length!==3){
      return;
    }


    const sourceCategory=parts[0];
    const sourceItemId=parts[1];
    const targetCategory=parts[2];


    const sourceExists =
      (
        product.categories[sourceCategory]
        || []
      )
      .some(
        item=>item.id===sourceItemId
      );


    const targetIds =
      new Set(
        (
          product.categories[targetCategory]
          || []
        )
        .map(item=>item.id)
      );


    if(!sourceExists){

      delete product.rules.categoryToCategory[key];
      return;

    }


    product.rules.categoryToCategory[key] =
      product.rules.categoryToCategory[key]
        .filter(
          id=>targetIds.has(id)
        );


    if(
      !product.rules.categoryToCategory[key].length
    ){

      delete product.rules.categoryToCategory[key];

    }

  });

}


/* ============================================================
   40. Toast
============================================================ */

let toastTimer=null;


function toast(message){

  const el =
    document.getElementById("toast");


  el.textContent =
    message;


  el.classList.add("show");


  clearTimeout(toastTimer);


  toastTimer =
    setTimeout(()=>{

      el.classList.remove("show");

    },2200);

}


/* ============================================================
   41. Escape attribute
============================================================ */

function escapeAttribute(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}
