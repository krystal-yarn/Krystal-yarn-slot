<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krystal 的毛线研究室</title>

<!-- 可爱圆体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>

/* =========================================================
   基础
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  font-family:
    "ZCOOL KuaiLe",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

  background:
    radial-gradient(circle at 10% 10%, #fff0f6 0 80px, transparent 81px),
    radial-gradient(circle at 90% 15%, #fff4d9 0 70px, transparent 71px),
    #fff9fb;

  color:#765764;
  min-height:100vh;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}


/* =========================================================
   顶部
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  background:rgba(255,249,251,.94);
  backdrop-filter:blur(12px);

  border-bottom:
    2px solid #f8e2ea;
}

.header-inner{
  max-width:1300px;
  margin:auto;

  min-height:72px;
  padding:10px 20px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  color:#d76f99;
  font-size:22px;
  white-space:nowrap;
}

.nav-buttons{
  display:flex;
  gap:8px;
}

.nav-buttons button{
  border:0;

  padding:10px 17px;

  border-radius:25px;

  background:#fff;

  color:#b06b86;

  box-shadow:
    0 4px 12px rgba(190,120,150,.10);

  transition:.2s;
}

.nav-buttons button:hover{
  transform:translateY(-2px);
}

.nav-buttons button.active{
  background:#f49abc;
  color:white;

  box-shadow:
    0 6px 15px rgba(230,130,165,.25);
}


/* =========================================================
   页面
========================================================= */

.page{
  display:none;

  max-width:1300px;
  margin:auto;

  padding:
    30px
    18px
    70px;
}

.page.active{
  display:block;
}


/* =========================================================
   标题
========================================================= */

.hero{
  text-align:center;
  margin:8px 0 25px;
}

.hero h1{
  margin:0 0 8px;

  color:#d86f99;

  font-size:
    clamp(28px,4vw,42px);
}

.hero p{
  margin:0;

  color:#b38b99;

  font-size:15px;
}


/* =========================================================
   抽取按钮
========================================================= */

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;

  gap:10px;

  margin:
    20px
    0
    28px;
}

.main-btn{
  border:0;

  border-radius:30px;

  padding:
    13px
    24px;

  font-size:16px;

  box-shadow:
    0 6px 16px rgba(190,120,150,.13);

  transition:.2s;
}

.main-btn:hover{
  transform:translateY(-2px);
}

.start-btn{
  background:#f391b7;
  color:white;
}

.stop-all-btn{
  background:#fff;
  color:#d56d91;

  border:
    2px solid
    #f4c6d5;
}

.reset-btn{
  background:#fff;
  color:#a37b89;

  border:
    2px solid
    #eadce2;
}


/* =========================================================
   六个老虎机
========================================================= */

.slots-grid{

  display:grid;

  grid-template-columns:
    repeat(6,minmax(0,1fr));

  gap:14px;

  width:100%;
}


/* =========================================================
   单个老虎机
========================================================= */

.slot-card{

  min-width:0;

  background:#fff;

  border:
    2px solid
    #f3dce5;

  border-radius:25px;

  padding:13px;

  box-shadow:
    0 9px 25px
    rgba(190,120,150,.10);

  position:relative;
}

.slot-title{

  text-align:center;

  color:#a9607c;

  font-size:16px;

  margin:
    2px
    0
    10px;
}


/* =========================================================
   滚轮窗口

   现在改成 3 格：
   上面一格
   中间中奖格
   下面一格

   中间格才是最终结果
========================================================= */

.reel-window{

  position:relative;

  height:270px;

  overflow:hidden;

  border-radius:20px;

  background:#fff8fb;

  border:
    2px solid
    #f2d8e3;
}


/* 中间中奖线 */

.reel-window::before{

  content:"";

  position:absolute;

  z-index:20;

  left:4px;
  right:4px;

  top:90px;

  height:90px;

  border-radius:15px;

  border:
    3px solid
    #f29abb;

  background:
    rgba(255,255,255,.18);

  box-shadow:
    0 0 0 3px rgba(255,255,255,.75),
    0 4px 15px rgba(220,120,155,.12);

  pointer-events:none;
}


/* 左右小箭头 */

.reel-window::after{

  content:"♥";

  position:absolute;

  z-index:30;

  left:7px;

  top:121px;

  color:#ed8faf;

  font-size:16px;

  pointer-events:none;
}


/* 上下渐变 */

.reel-window .fade-top{

  position:absolute;
  z-index:15;

  top:0;
  left:0;
  right:0;

  height:55px;

  background:
    linear-gradient(
      to bottom,
      rgba(255,248,251,.98),
      rgba(255,248,251,0)
    );

  pointer-events:none;
}

.reel-window .fade-bottom{

  position:absolute;
  z-index:15;

  bottom:0;
  left:0;
  right:0;

  height:55px;

  background:
    linear-gradient(
      to top,
      rgba(255,248,251,.98),
      rgba(255,248,251,0)
    );

  pointer-events:none;
}


/* =========================================================
   真正移动的滚轮
========================================================= */

.reel{

  position:absolute;

  left:0;
  top:0;

  width:100%;

  will-change:transform;
}


/* =========================================================
   每个滚轮项目

   固定 90px 高度
========================================================= */

.reel-item{

  width:100%;

  height:90px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  padding:
    8px
    12px;

  overflow:hidden;
}


/* 图片统一尺寸 */

.reel-item img{

  width:62px;
  height:62px;

  min-width:62px;
  min-height:62px;

  object-fit:cover;

  border-radius:18px;

  border:
    3px solid
    white;

  background:#fff0f5;

  box-shadow:
    0 3px 10px
    rgba(160,100,125,.15);
}


/* 没有图片的时候 */

.reel-placeholder{

  width:62px;
  height:62px;

  min-width:62px;
  min-height:62px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:18px;

  background:#fff0f5;

  font-size:34px;

  border:
    3px solid
    white;

  box-shadow:
    0 3px 10px
    rgba(160,100,125,.10);
}


/* 名字 */

.reel-item-name{

  max-width:100px;

  color:#815a69;

  font-size:15px;

  line-height:1.25;

  text-align:center;

  word-break:break-word;
}


/* =========================================================
   单独停止按钮
========================================================= */

.stop-one{

  width:100%;

  margin-top:10px;

  border:0;

  border-radius:20px;

  padding:9px;

  background:#fff0f5;

  color:#ce6b8e;

  font-size:14px;

  transition:.2s;
}

.stop-one:hover{
  background:#ffe3ed;
}

.stop-one:disabled{

  opacity:.55;

  cursor:not-allowed;
}


/* 状态 */

.slot-status{

  min-height:22px;

  margin-top:5px;

  text-align:center;

  color:#b3929e;

  font-size:12px;
}


/* =========================================================
   最终结果
========================================================= */

.final-result{

  display:none;

  margin:
    30px
    auto
    0;

  padding:22px;

  background:#fff;

  border:
    2px dashed
    #efb3ca;

  border-radius:25px;

  box-shadow:
    0 8px 25px
    rgba(200,120,150,.08);
}

.final-result.show{
  display:block;
}

.final-result h2{

  text-align:center;

  margin:
    0
    0
    18px;

  color:#d76e97;
}

.result-grid{

  display:grid;

  grid-template-columns:
    repeat(6,minmax(0,1fr));

  gap:10px;
}

.result-item{

  text-align:center;

  padding:12px 7px;

  background:#fff8fb;

  border-radius:17px;
}

.result-item .label{

  color:#b28b98;

  font-size:11px;
}

.result-item .value{

  margin-top:5px;

  color:#8c5b70;

  font-size:14px;
}


/* 确认按钮 */

.confirm-result{

  display:block;

  margin:18px auto 0;

  border:0;

  border-radius:25px;

  padding:
    12px
    25px;

  background:#f391b7;

  color:white;

  font-size:16px;

  box-shadow:
    0 5px 15px
    rgba(220,120,155,.18);
}

.confirm-result:disabled{
  opacity:.5;
}


/* =========================================================
   设置页面
========================================================= */

.settings-title{

  text-align:center;

  color:#d76f97;

  font-size:32px;

  margin:
    0
    0
    7px;
}

.settings-desc{

  text-align:center;

  color:#ae8997;

  margin:
    0
    0
    25px;
}

.notice{

  padding:
    14px
    17px;

  background:#fff2f7;

  border-radius:18px;

  color:#9e7180;

  font-size:14px;

  margin-bottom:20px;
}


/* =========================================================
   设置区
========================================================= */

.settings-section{

  background:#fff;

  border:
    2px solid
    #f2dce5;

  border-radius:25px;

  padding:21px;

  margin-bottom:20px;

  box-shadow:
    0 6px 20px
    rgba(190,120,150,.06);
}

.settings-section h2{

  margin:
    0
    0
    8px;

  color:#a85e7c;

  font-size:21px;
}

.settings-section > p{

  color:#aa8794;

  font-size:13px;
}


/* =========================================================
   新增项目
========================================================= */

.add-row{

  display:flex;

  align-items:center;

  flex-wrap:wrap;

  gap:9px;

  margin:
    15px
    0;
}

.add-row input[type="text"]{

  flex:
    1
    1
    180px;

  min-width:150px;

  padding:
    11px
    14px;

  border:
    2px solid
    #ecdce3;

  border-radius:18px;

  outline:none;

  color:#795967;

  background:#fffafd;
}

.add-row input[type="text"]:focus{

  border-color:#efa0bb;
}


.upload-label{

  padding:
    10px
    15px;

  background:#fff0f5;

  color:#c86c8d;

  border-radius:18px;

  cursor:pointer;
}

.upload-label input{
  display:none;
}

.add-btn{

  border:0;

  padding:
    11px
    18px;

  border-radius:18px;

  background:#f292b6;

  color:white;
}


/* =========================================================
   管理列表
========================================================= */

.manage-list{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(165px,1fr)
    );

  gap:12px;
}

.manage-card{

  position:relative;

  background:#fff8fb;

  border:
    2px solid
    #f2e0e6;

  border-radius:20px;

  padding:12px;

  text-align:center;
}

.manage-card img,
.manage-placeholder{

  width:90px;
  height:90px;

  margin:
    0
    auto
    9px;

  object-fit:cover;

  border-radius:18px;
}

.manage-placeholder{

  display:flex;

  align-items:center;
  justify-content:center;

  background:#fff0f5;

  font-size:40px;
}

.manage-card-name{

  color:#795667;

  font-size:14px;

  margin-bottom:5px;
}

.stock-text{

  margin:
    5px
    0
    9px;

  font-size:12px;
}

.stock-good{
  color:#72aa7a;
}

.stock-low{
  color:#d99851;
}

.stock-zero{
  color:#d56f7c;
}

.stock-input{

  width:80px;

  text-align:center;

  padding:7px;

  border:
    2px solid
    #ecdde3;

  border-radius:13px;

  color:#765765;

  outline:none;
}

.save-stock-btn{

  margin-top:6px;

  border:0;

  border-radius:13px;

  padding:6px 10px;

  background:#fbe4ed;

  color:#c26b89;

  font-size:12px;
}

.delete-btn{

  margin-top:7px;

  border:0;

  border-radius:13px;

  padding:6px 12px;

  background:#ffe5ec;

  color:#c96b8c;

  font-size:12px;
}


/* =========================================================
   规则
========================================================= */

.rule-select{

  width:100%;

  max-width:430px;

  padding:
    11px
    13px;

  border:
    2px solid
    #eadbe2;

  border-radius:17px;

  background:#fff;

  color:#765765;

  outline:none;

  margin:
    10px
    0
    15px;
}

.rule-box{

  background:#fff8fb;

  padding:16px;

  border-radius:20px;

  margin-bottom:14px;
}

.rule-box h3{

  margin:
    0
    0
    10px;

  color:#a85e7c;

  font-size:16px;
}

.checkbox-grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(130px,1fr)
    );

  gap:8px;
}

.check-item{

  display:flex;

  align-items:center;

  gap:6px;

  padding:9px;

  background:#fff;

  border:
    1px solid
    #f0dfe5;

  border-radius:13px;

  color:#805e6d;

  font-size:13px;
}

.save-rule-btn,
.clear-rule-btn{

  border:0;

  border-radius:18px;

  padding:
    10px
    17px;

  margin-right:7px;

  margin-bottom:5px;
}

.save-rule-btn{

  background:#f292b6;

  color:white;
}

.clear-rule-btn{

  background:white;

  border:
    2px solid
    #efd8e1;

  color:#a47787;
}


/* =========================================================
   响应式
========================================================= */

@media(max-width:1100px){

  .slots-grid{

    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

  .result-grid{

    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

}

@media(max-width:650px){

  .header-inner{

    flex-direction:column;

    padding:
      12px;
  }

  .logo{
    font-size:19px;
  }

  .nav-buttons{
    width:100%;
  }

  .nav-buttons button{
    flex:1;
  }

  .page{
    padding:
      20px
      10px
      50px;
  }

  .slots-grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:9px;
  }

  .slot-card{

    padding:9px;

    border-radius:20px;
  }

  .slot-title{
    font-size:14px;
  }

  .reel-window{

    height:240px;
  }

  .reel-window::before{

    top:75px;

    height:90px;
  }

  .reel-window::after{

    top:105px;
  }

  .reel-item{

    height:90px;

    gap:5px;

    padding:5px;
  }

  .reel-item img,
  .reel-placeholder{

    width:52px;
    height:52px;

    min-width:52px;
    min-height:52px;
  }

  .reel-item-name{
    font-size:12px;
  }

  .result-grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}


/* =========================================================
   小装饰
========================================================= */

.sparkle{

  position:fixed;

  pointer-events:none;

  opacity:.35;

  font-size:18px;

  z-index:0;
}

</style>
</head>


<body>


<header>

  <div class="header-inner">

    <div class="logo">
      🧶 Krystal 的毛线研究室
    </div>

    <div class="nav-buttons">

      <button
        id="drawNav"
        class="active"
        onclick="showPage('draw')"
      >
        🎰 开始抽取
      </button>

      <button
        id="settingsNav"
        onclick="showPage('settings')"
      >
        ⚙️ 页面设置
      </button>

    </div>

  </div>

</header>



<!-- =====================================================
     抽取页面
===================================================== -->

<main
  id="drawPage"
  class="page active"
>

  <div class="hero">

    <h1>
      🎰 Krystal 研究室的老虎机
    </h1>

    <p>
      转一转，看看今天会抽到什么甜甜组合 ♡
    </p>

  </div>


  <div class="controls">

    <button
      class="main-btn start-btn"
      onclick="startAll()"
    >
      🎰 全部开始
    </button>

    <button
      class="main-btn stop-all-btn"
      onclick="stopAll()"
    >
      🛑 全部停止
    </button>

    <button
      class="main-btn reset-btn"
      onclick="resetAll()"
    >
      🔄 重置
    </button>

  </div>


  <div
    id="slotsGrid"
    class="slots-grid"
  ></div>


  <!-- 最终结果 -->

  <div
    id="finalResult"
    class="final-result"
  >

    <h2>
      ✨ 今日抽取结果 ✨
    </h2>

    <div
      id="resultGrid"
      class="result-grid"
    ></div>


    <button
      id="confirmResultBtn"
      class="confirm-result"
      onclick="confirmResult()"
    >
      💗 确认这组结果并扣库存
    </button>

  </div>

</main>



<!-- =====================================================
     设置页面
===================================================== -->

<main
  id="settingsPage"
  class="page"
>

  <h1 class="settings-title">
    ⚙️ 页面设置
  </h1>

  <p class="settings-desc">
    材料、图片、库存和搭配规则都可以在这里管理 ♡
  </p>


  <div class="notice">

    💡
    设置会自动保存在当前浏览器。
    新增材料、上传照片、修改库存，都不需要再修改代码。

  </div>



  <!-- ===================================================
       款式
  ==================================================== -->

  <section class="settings-section">

    <h2>
      👜 1. 款式管理
    </h2>

    <p>
      添加你的包包款式，并可以直接上传照片。
    </p>

    <div class="add-row">

      <input
        id="styleName"
        type="text"
        placeholder="例如：小云朵包"
      >

      <label class="upload-label">

        📷 上传图片

        <input
          id="styleImage"
          type="file"
          accept="image/*"
        >

      </label>

      <button
        class="add-btn"
        onclick="addItem('styles')"
      >
        ＋ 添加款式
      </button>

    </div>

    <div
      id="stylesList"
      class="manage-list"
    ></div>

  </section>



  <!-- ===================================================
       主色
  ==================================================== -->

  <section class="settings-section">

    <h2>
      🎨 2. 线材主色
    </h2>

    <div class="add-row">

      <input
        id="mainColorName"
        type="text"
        placeholder="例如：浅粉色"
      >

      <label class="upload-label">

        📷 上传图片

        <input
          id="mainColorImage"
          type="file"
          accept="image/*"
        >

      </label>

      <button
        class="add-btn"
        onclick="addItem('mainColors')"
      >
        ＋ 添加主色
      </button>

    </div>

    <div
      id="mainColorsList"
      class="manage-list"
    ></div>

  </section>



  <!-- ===================================================
       配色
  ==================================================== -->

  <section class="settings-section">

    <h2>
      🌈 3. 线材配色
    </h2>

    <div class="add-row">

      <input
        id="secondaryColorName"
        type="text"
        placeholder="例如：米白色"
      >

      <label class="upload-label">

        📷 上传图片

        <input
          id="secondaryColorImage"
          type="file"
          accept="image/*"
        >

      </label>

      <button
        class="add-btn"
        onclick="addItem('secondaryColors')"
      >
        ＋ 添加配色
      </button>

    </div>

    <div
      id="secondaryColorsList"
      class="manage-list"
    ></div>

  </section>



  <!-- ===================================================
       扣子
  ==================================================== -->

  <section class="settings-section">

    <h2>
      🔘 4. 扣子
    </h2>

    <div class="add-row">

      <input
        id="buttonName"
        type="text"
        placeholder="例如：草莓粉扣"
      >

      <label class="upload-label">

        📷 上传图片

        <input
          id="buttonImage"
          type="file"
          accept="image/*"
        >

      </label>

      <button
        class="add-btn"
        onclick="addItem('buttons')"
      >
        ＋ 添加扣子
      </button>

    </div>

    <div

/* =========================================================

function loadData(){

  const saved =
    localStorage.getItem(
      "krystalSlotData"
    );

  if(!saved){

    const copy =
      JSON.parse(
        JSON.stringify(DEFAULT_DATA)
      );

    localStorage.setItem(
      "krystalSlotData",
      JSON.stringify(copy)
    );

    return copy;
  }

  try{

    const parsed =
      JSON.parse(saved);

    /*
      给旧数据自动补库存。
      所以你上一版已经添加的数据不会直接消失。
    */

    const types = [
      "styles",
      "mainColors",
      "secondaryColors",
      "buttons",
      "charms"
    ];

    types.forEach(type => {

      if(!Array.isArray(parsed[type])){
        parsed[type] = [];
      }

      parsed[type].forEach(item => {

        if(
          typeof item.stock !== "number"
        ){

          item.stock = 5;

        }

      });

    });

    if(!parsed.styleRules){
      parsed.styleRules = {};
    }

    if(!parsed.colorRules){
      parsed.colorRules = {};
    }

    return parsed;

  }catch(e){

    return JSON.parse(
      JSON.stringify(DEFAULT_DATA)
    );

  }

}

function saveData(){

/* =========================================================
   HTML 安全
========================================================= */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   图片
========================================================= */

function getFile(inputId){

  const input =
    document.getElementById(inputId);

  if(
    !input ||
    !input.files ||
    !input.files[0]
  ){

    return Promise.resolve("");

  }

  return new Promise(resolve => {

    const reader =
      new FileReader();

    reader.onload =
      e =>
        resolve(
          e.target.result
        );

    reader.readAsDataURL(
      input.files[0]
    );

  });

}

async function addItem(type){

  const config = {

    styles:{
      name:"styleName",
      image:"styleImage"
    },

    mainColors:{
      name:"mainColorName",
      image:"mainColorImage"
    },

      name:"buttonName",
      image:"buttonImage"

      image:"charmImage"
    }

  };

  const c =
    config[type];

  const name =
    document
      .getElementById(c.name)
      .value
      .trim();

  if(!name){

    return;

  }

    .getElementById(c.image)

========================================================= */

function deleteItem(type,id){

  data[type] =
    data[type].filter(
      item => item.id !== id

  renderSettings();

  buildSlots();

}


/* =========================================================
   库存
========================================================= */

function getStockClass(stock){

  if(stock <= 0){
    return "stock-zero";
  }

  if(stock <= 2){
    return "stock-low";
  }

  return "stock-good";

}


function getStockText(stock){

  if(stock <= 0){
    return "🔴 缺货";
  }

  if(stock <= 2){
    return "🟠 库存紧张";
  }

  return "🟢 有库存";

}


function saveStock(type,id){

  const input =
    document.getElementById(
      "stock_" +
      id
    );

  if(!input){
    return;
  }

  let value =
    parseInt(
      input.value,
      10
    );

  if(
    isNaN(value) ||
    value < 0
  ){

    value = 0;

  }

  const item =
    data[type].find(
      x => x.id === id
    );

  if(!item){
    return;
  }

  item.stock = value;

  saveData();

  renderSettings();

  buildSlots();

}

function buildSlots(){

/* =========================================================
   当前每个项目的固定高度
========================================================= */

function getItemHeight(){

  return 90;

}


/* =========================================================
   空闲状态
========================================================= */

function prepareIdleReels(){

  const pools = {

    style:data.styles,

    mainColor:data.mainColors,

    secondaryColor:data.secondaryColors,

    button1:data.buttons,

    button2:data.buttons,

    charm:data.charms

  };


  SLOT_CONFIG.forEach(slot => {

    const reel =
      document.getElementById(
        "reel-" +
        slot.key
      );

    if(!reel){
      return;
    }

    const items =
      pools[slot.key] || [];

    reel.innerHTML = "";

    if(items.length === 0){

      reel.appendChild(
        createReelItem({
          id:"empty",
          name:"请先设置",
          image:""
        })
      );

      return;

    }


    /*
      先放三轮。
      中央位置从第二个项目开始。
    */

    const repeated = [
      ...items,
      ...items,
      ...items
    ];


    repeated.forEach(item => {

      reel.appendChild(
        createReelItem(item)
      );

    });


    /*
      让第二轮的第一个项目进入中央
    */

    reel.style.transition = "none";

    reel.style.transform =
      `translateY(-${items.length * getItemHeight()}px)`;

  });

}


/* =========================================================
   创建滚轮项目
========================================================= */

function createReelItem(item){

  const div =
    document.createElement("div");

  div.className =
    "reel-item";


  let visual = "";

  if(item.image){

    visual = `

      <img
        src="${item.image}"
        alt=""
      >

    `;

  }else{

    visual = `

      <div class="reel-placeholder">
        🧶
      </div>

    `;

  }


  div.innerHTML = `

    ${visual}

    <div class="reel-item-name">
      ${escapeHtml(item.name)}
    </div>

  `;


  return div;

}


/* =========================================================
   获取指定类别
========================================================= */

function getPoolByKey(key){

  if(key === "style"){
    return data.styles;
  }

  if(key === "mainColor"){
    return data.mainColors;
  }

  if(key === "secondaryColor"){
    return data.secondaryColors;
  }

  if(
    key === "button1" ||
    key === "button2"
  ){

    return data.buttons;

  }

  if(key === "charm"){
    return data.charms;
  }

  return [];

}


/* =========================================================
   允许项目

   ★ 这里同时过滤库存
========================================================= */

function getAllowed(type,context){

  let pool =
    getPoolByKey(type);


  /*
    只让库存 > 0 的项目进入抽奖池
  */

  pool =
    pool.filter(
      item =>
        Number(item.stock) > 0
    );


  /* 款式 */

  if(type === "style"){

    return pool;

  }


  /* 主色 */

  if(type === "mainColor"){

    const rule =
      data.styleRules[
        context.style
      ];

    if(
      rule &&
      Array.isArray(
        rule.mainColors
      )
    ){

      pool =
        pool.filter(
          item =>
            rule.mainColors.includes(
              item.id
            )
        );

    }

    return pool;

  }


  /* 配色 */

  if(type === "secondaryColor"){

    const rule =
      data.colorRules[
        context.mainColor
      ];

    if(
      Array.isArray(rule)
    ){

      pool =
        pool.filter(
          item =>
            rule.includes(item.id)
        );

    }

    return pool;

  }


  /* 扣子 */

  if(
    type === "button1" ||
    type === "button2"
  ){

    const rule =
      data.styleRules[
        context.style
      ];

    if(
      rule &&
      Array.isArray(
        rule.buttons
      )
    ){

      pool =
        pool.filter(
          item =>
            rule.buttons.includes(
              item.id
            )
        );

    }

    return pool;

  }


  /* 吊饰 */

  if(type === "charm"){

    const rule =
      data.styleRules[
        context.style
      ];

    if(
      rule &&
      Array.isArray(
        rule.charms
      )
    ){

      pool =
        pool.filter(
          item =>
            rule.charms.includes(
              item.id
            )
        );

    }

    return pool;

  }


  return pool;

}


/* =========================================================
   随机
========================================================= */

function randomItem(pool){

  if(
    !pool ||
    pool.length === 0
  ){

    return null;

  }

  return pool[
    Math.floor(
      Math.random() *
      pool.length
    )
  ];

}


/* =========================================================
   生成最终结果
========================================================= */

function generateFinalResults(){

  const result = {};


  /*
    1.
    先抽款式
  */

  const styles =
    getAllowed(
      "style",
      result
    );

  result.style =
    randomItem(styles);


  /*
    如果没有款式
  */

  if(!result.style){

    return null;

  }


  /*
    2.
    根据款式抽主色
  */

  const mains =
    getAllowed(
      "mainColor",
      {
        style:
          result.style.id
      }
    );

  result.mainColor =
    randomItem(mains);


  if(!result.mainColor){

    return null;

  }


  /*
    3.
    根据主色抽配色
  */

  const secondaries =
    getAllowed(
      "secondaryColor",
      {
        mainColor:
          result.mainColor.id
      }
    );

  result.secondaryColor =
    randomItem(secondaries);


  if(!result.secondaryColor){

    return null;

  }


  /*
    4.
    扣子
  */

  const buttonContext = {

    style:
      result.style.id

  };


  const buttons =
    getAllowed(
      "button1",
      buttonContext
    );


  result.button1 =
    randomItem(buttons);


  result.button2 =
    randomItem(buttons);


  if(
    !result.button1 ||
    !result.button2
  ){

    return null;

  }


  /*
    5.
    吊饰
  */

  const charms =
    getAllowed(
      "charm",
      buttonContext
    );


  result.charm =
    randomItem(charms);


  if(!result.charm){

    return null;

  }


  return result;

}


/* =========================================================
   开始全部
========================================================= */

function startAll(){

  /*
    防止重复点击
  */

  if(
    SLOT_CONFIG.some(
      slot =>
        slotStates[slot.key] &&
        slotStates[slot.key].running
    )
  ){

    return;

  }


  sessionId++;

  const thisSession =
    sessionId;


  currentFinalResults =
    generateFinalResults();


  if(!currentFinalResults){

    alert(
      "目前没有足够的有库存项目可以组成完整组合。\n\n请到「页面设置」检查库存和搭配限制。"
    );

    return;

  }


  resultConfirmed =
    false;


  document
    .getElementById(
      "finalResult"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "confirmResultBtn"
    )
    .disabled = false;


  /*
    6 个一起开始
  */

  SLOT_CONFIG.forEach(slot => {

    startSlot(
      slot.key,
      currentFinalResults[
        slot.key
      ],
      thisSession
    );

  });


  /*
    约 2.2 秒以后开始逐个停
  */

  setTimeout(
    () =>
      autoStopSequence(
        thisSession
      ),
    2200
  );

}


/* =========================================================
   逐个自动停止
========================================================= */

function autoStopSequence(session){

  if(
    session !== sessionId
  ){

    return;

  }


  const order = [

    "style",
    "mainColor",
    "secondaryColor",
    "button1",
    "button2",
    "charm"

  ];


  order.forEach(
    (key,index) => {

      setTimeout(
        () => {

          if(
            session !== sessionId
          ){

            return;

          }

          const state =
            slotStates[key];

          if(
            state &&
            state.running
          ){

            settleSlot(state);

          }

        },

        index * 950
      );

    }
  );

}


/* =========================================================
   开始单格
========================================================= */

function startSlot(
  key,
  target,
  session
){

  const reel =
    document.getElementById(
      "reel-" + key
    );

  const stopButton =
    document.getElementById(
      "stop-" + key
    );

  const status =
    document.getElementById(
      "status-" + key
    );


  if(!reel){
    return;
  }


  if(!target){

    status.textContent =
      "没有可抽项目";

    return;

  }


  const slotItems =
    getPoolByKey(key)
    .filter(
      item =>
        Number(item.stock) > 0
    );


  if(!slotItems.length){

    status.textContent =
      "没有库存";

    return;

  }


  /*
    找目标项目
  */

  let targetIndex =
    slotItems.findIndex(
      item =>
        item.id === target.id
    );


  if(targetIndex < 0){

    targetIndex = 0;

  }


  /*
    做很多轮，
    确保滚动的时候永远有东西
  */

  const rounds = 50;


  reel.innerHTML = "";


  for(
    let round=0;
    round<rounds;
    round++
  ){

    slotItems.forEach(item => {

      reel.appendChild(
        createReelItem(item)
      );

    });

  }


  const itemHeight =
    getItemHeight();


  const cycleHeight =
    slotItems.length *
    itemHeight;


  const state = {

    key:key,

    target:target,

    targetIndex:targetIndex,

    items:slotItems,

    itemHeight:itemHeight,

    cycleHeight:cycleHeight,

    distance:0,

    startTime:
      performance.now(),

    running:true,

    stopped:false,

    animationId:null,

    session:session

  };


  slotStates[key] =
    state;


  stopButton.disabled =
    false;


  status.textContent =
    "🎰 滚动中…";


  spinAnimation(state);

}


/* =========================================================
   连续滚动
========================================================= */

function spinAnimation(state){

  if(
    !state.running
  ){

    return;

  }


  if(
    state.session !== sessionId
  ){

    return;

  }


  const now =
    performance.now();


  const elapsed =
    now -
    state.startTime;


  /*
    速度
  */

  const speed =
    720;


  state.distance =
    elapsed /
    1000 *
    speed;


  const reel =
    document.getElementById(
      "reel-" +
      state.key
    );


  if(!reel){
    return;
  }


  /*
    不断循环，
    视觉上永远向上
  */

  const totalHeight =
    state.items.length *
    getItemHeight();


  const loopDistance =
    state.distance %
    totalHeight;


  reel.style.transform =
    `translateY(-${loopDistance}px)`;


  state.currentLoopDistance =
    loopDistance;


  state.animationId =
    requestAnimationFrame(
      () =>
        spinAnimation(state)
    );

}


/* =========================================================
   单独停止
========================================================= */

function stopOne(key){

  const state =
    slotStates[key];


  if(
    !state ||
    !state.running
  ){

    return;

  }


  settleSlot(state);

}


/* =========================================================
   全部停止
========================================================= */

function stopAll(){

  SLOT_CONFIG.forEach(slot => {

    const state =
      slotStates[
        slot.key
      ];

    if(
      state &&
      state.running
    ){

      settleSlot(state);

    }

  });

}


/* =========================================================
   停到中央
========================================================= */

function settleSlot(state){

  if(
    state.stopped
  ){

    return;

  }


  state.running =
    false;

  state.stopped =
    true;


  cancelAnimationFrame(
    state.animationId
  );


  const reel =
    document.getElementById(
      "reel-" +
      state.key
    );


  const stopButton =
    document.getElementById(
      "stop-" +
      state.key
    );


  const status =
    document.getElementById(
      "status-" +
      state.key
    );


  if(!reel){
    return;
  }


  const itemHeight =
    getItemHeight();


  const itemCount =
    state.items.length;


  const cycleHeight =
    itemCount *
    itemHeight;


  /*
    当前滚动位置。
  */

  let currentDistance =
    state.currentLoopDistance || 0;


  /*
    计算目标位置。

    注意：

    reel-item 第一个项目
    在 y=0

    但是中奖区域位于：

    90px ~ 180px

    所以要让目标项目
    出现在中央的 135px。

    每个项目高度 90px。

    因此：
    target top
    + 45px
    = 135px

    => target top = 90px

    所以目标 transform：

    -(index * 90 - 90)
  */

  const targetInsideCycle =
    state.targetIndex *
    itemHeight;


  /*
    我们让目标项目的顶部
    对准中央格顶部。

    中央格顶部 = 90px。

    所以：
    transform =
    -(index*90 - 90)
  */

  let targetPosition =
    targetInsideCycle -
    itemHeight;


  /*
    找一个未来的位置，
    避免突然倒转。
  */

  while(
    targetPosition <=
    currentDistance
  ){

    targetPosition +=
      cycleHeight;

  }


  /*
    如果距离太近，
    再多转一圈。
  */

  if(
    targetPosition -
    currentDistance
    <
    cycleHeight * .7
  ){

    targetPosition +=
      cycleHeight;

  }


  /*
    重新建立位置，
    这样可以一直向前滚。
  */

  const finalTransform =
    -targetPosition;


  reel.style.transition =
    "transform 1s cubic-bezier(.12,.72,.2,1)";


  reel.style.transform =
    `translateY(${finalTransform}px)`;


  stopButton.disabled =
    true;


  status.textContent =
    "✨ 停止";


  /*
    等动画真正结束
  */

  setTimeout(
    () => {

      reel.style.transition =
        "none";

      status.textContent =
        "💗 已选中";

      checkAllStopped();

    },

    1050
  );

}


/* =========================================================
   检查全部停止
========================================================= */

function checkAllStopped(){

  const allStopped =
    SLOT_CONFIG.every(
      slot => {

        const state =
          slotStates[
            slot.key
          ];

        return (
          state &&
          state.stopped
        );

      }
    );


  if(!allStopped){

    return;

  }


  showFinalResult();

}


/* =========================================================
   最终结果
========================================================= */

function showFinalResult(){

  if(!currentFinalResults){
    return;
  }


  const container =
    document.getElementById(
      "resultGrid"
    );


  container.innerHTML = "";


  const labels = {

    style:"款式",

    mainColor:"线材主色",

    secondaryColor:"线材配色",

    button1:"扣子 1",

    button2:"扣子 2",

    charm:"小吊饰"

  };


  SLOT_CONFIG.forEach(slot => {

    const item =
      currentFinalResults[
        slot.key
      ];


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "result-item";


    div.innerHTML = `

      <div class="label">
        ${labels[slot.key]}
      </div>

      <div class="value">
        ${
          item
          ?
          escapeHtml(
            item.name
          )
          :
          "未设置"
        }
      </div>

    `;


    container.appendChild(div);

  });


  document
    .getElementById(
      "finalResult"
    )
    .classList.add(
      "show"
    );

}


/* =========================================================
   确认结果
   ★ 这里才扣库存
========================================================= */

function confirmResult(){

  if(
    !currentFinalResults ||
    resultConfirmed
  ){

    return;

  }


  const result =
    currentFinalResults;


  const mapping = {

    style:"styles",

    mainColor:"mainColors",

    secondaryColor:"secondaryColors",

    button1:"buttons",

    button2:"buttons",

    charm:"charms"

  };


  /*
    先检查一次库存，
    防止期间库存发生变化。
  */

  for(
    const slot of SLOT_CONFIG
  ){

    const item =
      result[
        slot.key
      ];

    if(!item){
      continue;
    }


    const type =
      mapping[
        slot.key
      ];


    const actual =
      data[type].find(
        x =>
          x.id ===
          item.id
      );


    if(
      !actual ||
      Number(actual.stock) <= 0
    ){

      alert(
        `「${item.name}」已经没有库存了，请重新抽取。`
      );

      return;

    }

  }


  /*
    扣库存。

    注意：
    button1 和 button2
    如果抽到同一个扣子，
    要扣 2 个。
  */

  const deductions = {};


  SLOT_CONFIG.forEach(slot => {

    const item =
      result[
        slot.key
      ];

    if(!item){
      return;
    }


    const type =
      mapping[
        slot.key
      ];


    const key =
      type +
      "|" +
      item.id;


    if(!deductions[key]){

      deductions[key] = {
        type:type,
        id:item.id,
        amount:0
      };

    }


    deductions[key].amount++;

  });


  /*
    真正扣库存
  */

  Object.values(
    deductions
  ).forEach(d => {

    const item =
      data[d.type].find(
        x =>
          x.id === d.id
      );


    if(item){

      item.stock =
        Math.max(
          0,
          Number(item.stock) -
          d.amount
        );

    }

  });


  saveData();


  resultConfirmed =
    true;


  document
    .getElementById(
      "confirmResultBtn"
    )
    .disabled = true;


  alert(
    "✨ 已确认这组搭配，库存已经扣除 ♡"
  );


  renderSettings();

}


/* =========================================================
   重置
========================================================= */

function resetAll(){

  sessionId++;


  SLOT_CONFIG.forEach(slot => {

    const state =
      slotStates[
        slot.key
      ];


    if(state){

      state.running =
        false;

      state.stopped =
        true;

      cancelAnimationFrame(
        state.animationId
      );

    }


    const button =
      document.getElementById(
        "stop-" +
        slot.key
      );


    const status =
      document.getElementById(
        "status-" +
        slot.key
      );


    if(button){

      button.disabled =
        false;

    }


    if(status){

      status.textContent =
        "准备好了";

    }

  });


  currentFinalResults =
    null;

  resultConfirmed =
    false;


  document
    .getElementById(
      "finalResult"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "confirmResultBtn"
    )
    .disabled = false;


  prepareIdleReels();

}


/* =========================================================
   初始化
========================================================= */

buildSlots();

renderSettings();


</script>
