<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Krystal 的毛线老虎机</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff5fa;
      padding: 50px 20px;
    }

    h1 {
      color: #d96b9b;
      margin-bottom: 10px;
    }

    p {
      color: #777;
      font-size: 18px;
    }

    button {
      background: #f39abb;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 15px 35px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #e47fa5;
    }

    #result {
      margin-top: 35px;
      font-size: 26px;
      font-weight: bold;
      color: #d96b9b;
    }
  </style>
</head>

<body>

  <h1>🎰 Krystal 的毛线老虎机</h1>

  <p>准备好了吗？</p>

  <button onclick="startDraw()">开始抽取</button>

  <div id="result"></div>

  <script>

    const colors = [
      "酒红色",
      "米白色",
      "牛油果绿",
      "浅灰色",
      "金黄色",
      "大红色",
      "橘黄色",
      "玫红色",
      "深粉色",
      "浅粉色",
      "浅紫色",
      "米黄色"
    ];

    function startDraw() {

      const randomIndex = Math.floor(Math.random() * colors.length);

      const randomColor = colors[randomIndex];

      document.getElementById("result").innerText =
        "🎉 抽到了：" + randomColor + "！";

    }

  </script>

</body>
</html>
